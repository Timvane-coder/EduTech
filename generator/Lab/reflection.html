<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Ferrari Intro → Reflection of Light</title>
    <style>
        /* ─── reset ─── */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#111; overflow:hidden; font-family:'Segoe UI',sans-serif; }
        canvas { display:block; }

        /* ─── intro overlay ─── */
        #introTitle {
            position:fixed; bottom:48px; left:50%;
            transform:translateX(-50%);
            color:#fff; font-size:13px; letter-spacing:.25em;
            text-transform:uppercase; opacity:.55;
            pointer-events:none; z-index:10;
        }

        /* ─── lab UI hidden until transition ─── */
        #labUI { display:none; }

        /* top bar */
        #topmenu {
            position:fixed; top:0; left:0; right:0; height:38px;
            background:rgba(15,15,20,.93);
            color:#e8e8e8; font-size:13px; letter-spacing:.12em;
            text-transform:uppercase;
            display:flex; align-items:center; padding:0 18px;
            z-index:100;
            border-bottom:1px solid rgba(255,255,255,.08);
        }

        /* left panel — empty for reflection, kept for future use */
        #sidemenu {
            position:fixed; top:38px; left:0; width:0;
            z-index:100;
        }

        /* bottom bar */
        #menu {
            position:fixed; bottom:0; left:0; right:0;
            background:rgba(15,15,20,.93);
            color:#d4d4d4; font-size:12.5px;
            padding:9px 18px;
            display:flex; align-items:center;
            flex-wrap:wrap; gap:8px;
            z-index:100;
            border-top:1px solid rgba(255,255,255,.08);
        }
        #menu strong { color:#e8e8e8; font-size:11.5px; flex:1 1 100%; }

        /* buttons */
        #menu button {
            padding:6px 16px; border:none; border-radius:4px;
            font-size:12px; font-weight:600; letter-spacing:.06em;
            cursor:pointer; color:#fff; transition:filter .15s;
            background:#1a4e8f;
        }
        #menu button:hover { filter:brightness(1.18); }
        #moveEl  { background:#1a4e8f; }
        #rotEl   { background:#2a6e3f; }
        #lawEl   { background:rgb(164,26,26); }
    </style>
</head>
<body>

<!-- ─── intro overlay ─── -->
<div id="introTitle">Ferrari SF90 Stradale &nbsp;&middot;&nbsp; Loading Lab&hellip;</div>

<!-- ─── lab UI shown after transition ─── -->
<div id="labUI">

    <div id="topmenu">Reflection of Light</div>

    <div id="sidemenu"></div>

    <div id="menu">
        <strong>Click to select an object. &nbsp; Press <kbd>T</kbd> to Translate &amp; <kbd>R</kbd> to Rotate.</strong>
        <button id="moveEl">TRANSLATE</button>
        <button id="rotEl">ROTATE</button>
        <button id="lawEl">LAW OF REFLECTION</button>
    </div>

</div><!-- /labUI -->


<script type="importmap">
{
    "imports": {
        "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "tween":         "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js"
    }
}
</script>

<script type="module">

import * as THREE            from 'three';
import { OrbitControls }     from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { Reflector }         from 'three/addons/objects/Reflector.js';
import { GLTFLoader }        from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }       from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader }        from 'three/addons/loaders/RGBELoader.js';
import TWEEN                 from 'tween';

/* ════════════════════════════════════════
   GLOBALS
════════════════════════════════════════ */

let renderer, camera, scene, controls;

/* ── groups ── */
let ferrariGroup    = new THREE.Group();
let reflectionGroup = new THREE.Group();

/* ── ferrari ── */
let car, grid;
const wheels     = [];
const lookTarget = new THREE.Vector3(0, 0.5, 0);
const smoothLook = new THREE.Vector3(0, 0.5, 0);

let introFinished      = false;
let motionBlurStrength = 0;
let currentExposure    = 1.1;

/* ── reflection scene objects ── */
let sphere, earth, rod;
let mirror, mirrorBack;
let incidentRay, reflectedRay;
let transformControls;
let law = false;
let image = new THREE.Object3D();
let rayGroup = new THREE.Group();

const objects  = [];   // raycaster targets
const mouse    = new THREE.Vector2();
const raycaster = new THREE.Raycaster();
let SELECTED;

const reflParams = {
    ideg: 30,
    irad: 30 * (Math.PI / 180),
    pos : 9
};

/* ── DOM refs — filled in setupReflectionUI() ── */
let buttonMove, buttonRotate, buttonLaw;

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */

init();

function init() {

    /* renderer — identical to working integrated file */
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled   = true;
    renderer.shadowMap.type      = THREE.PCFShadowMap;
    document.body.appendChild(renderer.domElement);

    /* camera — Ferrari FOV 40 during intro;
       reflection scene uses FOV 50, we set that in createReflectionScene
       so the intro still looks correct */
    camera = new THREE.PerspectiveCamera(
        40,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    /* orbit controls — disabled during intro */
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled    = false;
    controls.enablePan  = true;
    controls.enableZoom = true;

    createLights();
    createFerrariShowroom();
    createReflectionScene();

    animate();

    window.addEventListener('resize', onResize);
}

/* ════════════════════════════════════════
   LIGHTS
   (identical to working integrated file)
════════════════════════════════════════ */

function createLights() {

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    const dir = new THREE.DirectionalLight(0xffffff, 4);
    dir.position.set(5, 10, 7);
    scene.add(dir);
}

/* ════════════════════════════════════════
   FERRARI SHOWROOM
   (identical to working integrated file)
════════════════════════════════════════ */

function createFerrariShowroom() {

    scene.add(ferrariGroup);

    grid = new THREE.GridHelper(20, 40, 0xffffff, 0xffffff);
    grid.material.opacity     = 0.15;
    grid.material.transparent = true;
    ferrariGroup.add(grid);

    new RGBELoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
            'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
            function (texture) {
                const pmrem = new THREE.PMREMGenerator(renderer);
                const env   = pmrem.fromEquirectangular(texture).texture;
                scene.environment = env;
                texture.dispose();
                pmrem.dispose();
            }
        );

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.load(
        'https://threejs.org/examples/models/gltf/ferrari.glb',
        function (gltf) {
            car = gltf.scene.children[0];

            car.getObjectByName('body').material =
                new THREE.MeshPhysicalMaterial({
                    color: 0xff0000, metalness: 1,
                    roughness: 0.35, clearcoat: 1
                });

            wheels.push(
                car.getObjectByName('wheel_fl'),
                car.getObjectByName('wheel_fr'),
                car.getObjectByName('wheel_rl'),
                car.getObjectByName('wheel_rr')
            );

            ferrariGroup.add(car);
            startFerrariSequence();
        }
    );
}

/* ════════════════════════════════════════
   CAMERA HELPERS
   (identical to working integrated file)
════════════════════════════════════════ */

function moveCamera(x, y, z, tx, ty, tz, duration) {
    return new TWEEN.Tween(camera.position)
        .to({ x, y, z }, duration)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onStart(() => {
            new TWEEN.Tween(lookTarget)
                .to({ x: tx, y: ty, z: tz }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        });
}

function bounceCar() {
    return new TWEEN.Tween(car.position)
        .to({ y: 0.15 }, 400)
        .yoyo(true).repeat(1)
        .easing(TWEEN.Easing.Quadratic.Out);
}

/* ════════════════════════════════════════
   FERRARI CINEMATIC
   (identical to working integrated file,
    only transition.onComplete is updated)
════════════════════════════════════════ */

function startFerrariSequence() {

    camera.position.set(0, 25, -80);

    const fly = moveCamera(0, 8, -18, 0, 0.5, 0, 2500)
        .onStart(() => { motionBlurStrength = 0.25; });

    const approach = moveCamera(0, 3, -8, 0, 0.5, 0, 2500)
        .onComplete(() => { motionBlurStrength = 0.05; });

    const orbitObj = { angle: 0 };
    const orbit = new TWEEN.Tween(orbitObj)
        .to({ angle: Math.PI * 2 }, 8000)
        .easing(TWEEN.Easing.Sinusoidal.InOut)
        .onUpdate(() => {
            camera.position.x = Math.cos(orbitObj.angle) * 8;
            camera.position.z = Math.sin(orbitObj.angle) * 8;
            camera.position.y = 2.5 + Math.sin(orbitObj.angle * 2) * 0.5;
        });

    const frontInspect = moveCamera( 2,  1.5,  4, 0, 0.5, 0, 2200);
    const sideInspect  = moveCamera(-4,  1.2,  0, 0, 0.5, 0, 2200);
    const rearInspect  = moveCamera( 0,  2,   -5, 0, 0.5, 0, 2200);
    const bounce       = bounceCar();

    const rise = moveCamera(0, 12, -14, 0, 0, 0, 3000)
        .onStart(() => { motionBlurStrength = 0.12; });

    /* ── transition → reflection scene ── */
    const transition = moveCamera(-20, 10, 20, 0, 5, 0, 5000)
        .onStart(() => { motionBlurStrength = 0.4; })
        .onComplete(() => {

            /* swap groups */
            ferrariGroup.visible    = false;
            reflectionGroup.visible = true;

            /* reflection scene background */
            scene.background = new THREE.Color(0xbfd1e5);

            /* show lab UI */
            document.getElementById('introTitle').style.display = 'none';
            document.getElementById('labUI').style.display      = 'block';

            /* match reflection scene camera exactly */
            camera.fov  = 50;
            camera.near = 0.1;
            camera.far  = 1000;
            camera.updateProjectionMatrix();

            /* orbit controls target from reflection scene */
            controls.enabled          = true;
            controls.enableDamping    = true;
            controls.dampingFactor    = 0.05;
            controls.rotateSpeed      = 0.1;
            controls.target.set(0, 5, 0);
            controls.update();

            motionBlurStrength = 0;
            introFinished      = true;

            /* lazy-load lil-gui only now that the lab is visible */
            import('https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js')
                .then(({ GUI }) => { setupReflectionGUI(GUI); });
        });

    fly.chain(approach);
    approach.chain(orbit);
    orbit.chain(frontInspect);
    frontInspect.chain(sideInspect);
    sideInspect.chain(rearInspect);
    rearInspect.chain(bounce);
    bounce.chain(rise);
    rise.chain(transition);

    fly.start();
}

/* ════════════════════════════════════════
   REFLECTION SCENE
════════════════════════════════════════ */

function createReflectionScene() {

    reflectionGroup.visible = false;
    scene.add(reflectionGroup);

    /* ── ground grid ── */
    const scaleHorizontal = new THREE.GridHelper(70, 70);
    scaleHorizontal.position.y = -0.02;
    reflectionGroup.add(scaleHorizontal);

    /* ── floor plane ── */
    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(70, 1, 70),
        new THREE.MeshPhongMaterial({ color: 0xf9c834 })
    );
    floor.position.y    = -0.52;
    floor.castShadow    = true;
    floor.receiveShadow = true;
    reflectionGroup.add(floor);

    /* ── axes helper ── */
    const axesHelper = new THREE.AxesHelper(8);
    reflectionGroup.add(axesHelper);

    /* ── rod ── */
    rod = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.5, 6, 6),
        new THREE.MeshPhongMaterial({ color: 'red' })
    );
    rod.position.set(3, 3, 0);
    reflectionGroup.add(rod);
    objects.push(rod);

    /* ── grey sphere ── */
    sphere = new THREE.Mesh(
        new THREE.SphereGeometry(2, 22, 16),
        new THREE.MeshPhongMaterial({ color: 'grey' })
    );
    sphere.position.set(0, 2, 0);
    reflectionGroup.add(sphere);
    objects.push(sphere);

    /* ── earth ── */
    const earthTex = new THREE.TextureLoader()
        .load('./assets/gravity/earth.jpg');
    earth = new THREE.Mesh(
        new THREE.SphereGeometry(2, 22, 16),
        new THREE.MeshBasicMaterial({ map: earthTex })
    );
    earth.position.set(-5, 2, 15);
    reflectionGroup.add(earth);
    objects.push(earth);

    /* ── mirror (Reflector) ── */
    mirror = new Reflector(
        new THREE.PlaneGeometry(15, 15),
        {
            color             : new THREE.Color(0x7f7f7f),
            textureWidth      : window.innerWidth  * window.devicePixelRatio,
            textureHeight     : window.innerHeight * window.devicePixelRatio
        }
    );
    mirror.rotation.x = 0;
    mirror.position.set(0, 8, -7.5);
    reflectionGroup.add(mirror);

    /* mirror back face */
    mirrorBack = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 16),
        new THREE.MeshPhongMaterial({ color: new THREE.Color(0x7f7f7f) })
    );
    mirrorBack.position.z = -0.01;
    mirror.add(mirrorBack);

    /* ── image object (virtual image origin) ── */
    scene.add(image);

    /* ── transform controls (attached after transition) ── */
    transformControls = new TransformControls(camera, renderer.domElement);

    transformControls.addEventListener('change', () => {
        /* clamp positions so objects stay above floor / in front of mirror */
        if (earth.position.y  <= 2)    earth.position.y  = 2;
        if (earth.position.z  <= -5.5) earth.position.z  = -5.5;
        if (sphere.position.y <= 2)    sphere.position.y = 2;
        if (sphere.position.z <= -5.5) sphere.position.z = -5.5;
        if (rod.position.y    <= 3)    rod.position.y    = 3;
        if (rod.position.z    <= -2)   rod.position.z    = -2;
    });

    transformControls.addEventListener('dragging-changed', (event) => {
        controls.enabled = !event.value;
        if (law) {
            image.position.x = -sphere.position.x;
            image.position.y =  sphere.position.y;
            image.position.z = -sphere.position.z;
            adjustRays(incidentRay,  sphere.position);
            adjustRays(reflectedRay, image.position);
        }
    });

    /* start attached to earth (same as original) */
    transformControls.attach(earth);
    scene.add(transformControls);

    /* ── keyboard shortcuts ── */
    window.addEventListener('keydown', (event) => {
        if (!introFinished) return;
        switch (event.keyCode) {
            case 84: transformControls.setMode('translate'); break; // T
            case 82: transformControls.setMode('rotate');    break; // R
        }
    });

    /* ── click to select ── */
    document.addEventListener('click', onReflectionClick);

    /* ── wire up buttons ── */
    setupReflectionUI();
}

/* ────────────────────────────────────────
   setupReflectionUI  (button wiring)
──────────────────────────────────────── */

function setupReflectionUI() {

    buttonMove   = document.getElementById('moveEl');
    buttonRotate = document.getElementById('rotEl');
    buttonLaw    = document.getElementById('lawEl');

    buttonMove.addEventListener('click', () => {
        transformControls.setMode('translate');
    });

    buttonRotate.addEventListener('click', () => {
        transformControls.setMode('rotate');
    });

    buttonLaw.addEventListener('click', reflectionLaw);
}

/* ────────────────────────────────────────
   setupReflectionGUI  (lazy-loaded lil-gui)
──────────────────────────────────────── */

function setupReflectionGUI(GUI) {

    const gui = new GUI({ width: 220 });
    gui.close();

    const camFolder = gui.addFolder('Camera');
    camFolder.add(camera.position, 'x', -50, 50).name('pos X').listen();
    camFolder.add(camera.position, 'y', -20, 40).name('pos Y').listen();
    camFolder.add(camera.position, 'z', -50, 50).name('pos Z').listen();

    const mirrorFolder = gui.addFolder('Mirror');
    mirrorFolder.add(mirror.position, 'x', -20, 20).name('pos X');
    mirrorFolder.add(mirror.position, 'y',   0, 20).name('pos Y');
    mirrorFolder.add(mirror.position, 'z', -20,  5).name('pos Z');
    mirrorFolder.add(mirror.rotation, 'x', -Math.PI, Math.PI).name('rot X');
}

/* ────────────────────────────────────────
   reflectionLaw  (toggle law mode)
──────────────────────────────────────── */

function reflectionLaw() {

    law = !law;

    if (law) {

        buttonLaw.innerText = 'INTRODUCTION';

        /* lay mirror flat on the floor */
        mirror.rotation.x = -1.57;
        mirror.position.set(0, 0, 0);

        /* switch transform control to sphere */
        transformControls.attach(sphere);
        sphere.scale.set(0.1, 0.1, 0.1);
        sphere.position.set(
            reflParams.pos * reflParams.irad,
            reflParams.pos,
            0
        );

        /* virtual image */
        image.position.set(
            -reflParams.pos * reflParams.irad,
             reflParams.pos,
             0
        );

        /* draw incident and reflected rays */
        incidentRay  = addLines(new THREE.Vector3(0,0,0), sphere.position, 'red');
        reflectedRay = addLines(new THREE.Vector3(0,0,0), image.position,  'blue');
        rayGroup.add(incidentRay, reflectedRay);
        scene.add(rayGroup);

        rod.visible = false;

    } else {

        buttonLaw.innerText = 'LAW OF REFLECTION';

        /* restore mirror */
        mirror.rotation.x = 0;
        mirror.position.set(0, 8, -7.5);

        /* restore objects */
        transformControls.attach(earth);
        sphere.scale.set(1, 1, 1);
        sphere.position.set(0, 2, 0);
        rod.visible = true;

        /* remove ray lines */
        scene.remove(rayGroup);
        rayGroup = new THREE.Group();
    }
}

/* ────────────────────────────────────────
   onReflectionClick
──────────────────────────────────────── */

function onReflectionClick(event) {

    if (!introFinished) return;

    mouse.x =  (event.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight)  * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(objects, true);

    if (intersects.length > 0) {
        SELECTED = intersects[0].object;
        transformControls.attach(SELECTED);
    }
}

/* ────────────────────────────────────────
   addLines  — draw a line between two vectors
──────────────────────────────────────── */

function addLines(vector1, vector2, col) {

    const lineMat  = new THREE.LineBasicMaterial({ color: col });
    const lineGeo  = new THREE.BufferGeometry().setFromPoints([vector1, vector2]);
    return new THREE.Line(lineGeo, lineMat);
}

/* ────────────────────────────────────────
   adjustRays  — update geometry in-place
──────────────────────────────────────── */

function adjustRays(obj, vector) {

    obj.geometry.dispose();
    obj.geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        vector
    ]);
}

/* ════════════════════════════════════════
   RESIZE
   (identical to working integrated file)
════════════════════════════════════════ */

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ════════════════════════════════════════
   ANIMATE
════════════════════════════════════════ */

function animate() {

    requestAnimationFrame(animate);

    TWEEN.update();

    /* ── Ferrari intro steering ── */
    if (!introFinished) {

        smoothLook.lerp(lookTarget, 0.05);
        camera.lookAt(smoothLook);

        const time = -performance.now() / 1000;
        grid.position.z = -(time) % 1;

        for (let i = 0; i < wheels.length; i++) {
            wheels[i].rotation.x = time * Math.PI * 2;
        }
    }

    controls.update();

    /* fake motion-blur via tone-mapping exposure */
    currentExposure += ((1.1 - motionBlurStrength) - currentExposure) * 0.03;
    renderer.toneMappingExposure = currentExposure;

    renderer.render(scene, camera);
}

</script>
</body>
</html>
