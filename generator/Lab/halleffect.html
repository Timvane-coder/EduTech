<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Ferrari Intro → Hall Effect</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        canvas { display:block; }

        /* ── intro overlay ── */

            position:fixed; bottom:48px; left:50%;
            transform:translateX(-50%);
            color:#fff; font-size:13px; letter-spacing:.25em;
            text-transform:uppercase; opacity:.55;
            pointer-events:none; z-index:10;
        }

        /* ── lab UI hidden until transition ── */

        /* top bar */

            position:fixed; top:0; left:0; right:0; height:42px;
            background:rgba(15,15,20,.93);
            color:#e8e8e8; font-size:14px; font-weight:bold;
            letter-spacing:.08em; text-transform:uppercase;
            display:flex; align-items:center; padding:0 18px;
            z-index:100;
            border-bottom:1px solid rgba(255,255,255,.08);
        }

        /* bottom bar */
        #menu {
            position:fixed; bottom:0; left:0; right:0;
            background:rgba(15,15,20,.93);
            color:#d4d4d4; font-size:12.5px;
            padding:10px 18px;
            display:flex; align-items:center;
            flex-wrap:wrap; gap:8px;

        }

</head>
<body>

<!-- ── intro overlay ── -->
<div id="introTitle">Ferrari SF90 Stradale &nbsp;&middot;&nbsp; Hall Effect Lab&hellip;</div>

<!-- ── lab UI shown after transition ── -->
<div id="labUI">

    <div id="topmenu">Hall Effect</div>

    <div id="menu">
        <a id="conductor-el"></a>
        <a id="message-el">Investigate the effect of magnetic field on a thin slab of conductor</a>
        <button id="theorybutton">THEORY</button>
        <button id="change-el">CURRENT CHANGE</button>
        <button id="flip-el">FIELD FLIP</button>
        <button id="move-el">MOVE MAGNET</button>
        <button id="reset-el" style="visibility:hidden">RESET MAGNET</button>
    </div>

</div><!-- /labUI -->


<script type="importmap">
{
    "imports": {
        "three":            "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/":    "https://unpkg.com/three@0.160.0/examples/jsm/",
        "tween":            "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js"
    }
}
</script>

<script type="module">

import * as THREE           from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }       from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }      from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader }       from 'three/addons/loaders/RGBELoader.js';
import TWEEN                from 'tween';
import { InstancedFlow }    from 'three/addons/modifiers/CurveModifier.js';

/* ════════════════════════════════════════
   GLOBALS
════════════════════════════════════════ */

let renderer, camera, scene, controls;

/* ── groups ── */
let ferrariGroup    = new THREE.Group();
let hallEffectGroup = new THREE.Group();

/* ── ferrari ── */
let car, grid;
const wheels     = [];
const lookTarget = new THREE.Vector3(0, 0.5, 0);
const smoothLook = new THREE.Vector3(0, 0.5, 0);

let introFinished      = false;
let motionBlurStrength = 0;
let currentExposure    = 1.1;

/* ── hall effect ── */
let element   = 0;
let flip      = false;
let flow;                          // InstancedFlow
let slow      = false;
let direction = true;
let mrotate   = false;
let change    = false;
let hallClock;

let electronGeometry, electronMaterial;
let curveHandles = [];
let curves       = [];

let magField;
let galvNeedle;
let disp = 0.0;
let t    = 0.001;

let cell        = new THREE.Group();
let magnet      = new THREE.Group();
let hallElectrons = new THREE.Group();
let hall        = new THREE.Group();

/* ── hall DOM refs (populated in setupHallUI) ── */
let messageEl, buttonMagnet, buttonCurrent, buttonMove, buttonReset;

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */

init();

function init() {

    /* renderer */
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    /* camera – FOV 40 for the Ferrari intro;
       transition onComplete will set it to 50 for the hall scene */
    camera = new THREE.PerspectiveCamera(
        40,
        window.innerWidth / window.innerHeight,
        0.1,
        1500
    );

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled      = false;
    controls.enablePan    = true;
    controls.enableZoom   = true;
    controls.enableDamping  = true;
    controls.dampingFactor  = 0.05;
    controls.rotateSpeed    = 0.1;

    hallClock = new THREE.Clock();

    createLights();
    createFerrariShowroom();
    createHallEffectScene();

    animate();

    window.addEventListener('resize', onResize);
}

/* ════════════════════════════════════════
   LIGHTS
   (identical to capacitor version – kept as-is)
════════════════════════════════════════ */

function createLights() {

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    const dir = new THREE.DirectionalLight(0xffffff, 4);
    dir.position.set(5, 10, 7);
    scene.add(dir);
}

/* ════════════════════════════════════════
   FERRARI SHOWROOM
   (identical – kept as-is)
════════════════════════════════════════ */

function createFerrariShowroom() {

    scene.add(ferrariGroup);

    grid = new THREE.GridHelper(20, 40, 0xffffff, 0xffffff);
    grid.material.opacity     = 0.15;
    grid.material.transparent = true;
    ferrariGroup.add(grid);

    new RGBELoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
            'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
            function(texture) {
                const pmrem = new THREE.PMREMGenerator(renderer);
                const env   = pmrem.fromEquirectangular(texture).texture;
                scene.environment = env;
                texture.dispose();
                pmrem.dispose();
            }
        );

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.load(
        'https://threejs.org/examples/models/gltf/ferrari.glb',
        function(gltf) {
            car = gltf.scene.children[0];

            car.getObjectByName('body').material =
                new THREE.MeshPhysicalMaterial({
                    color: 0xff0000, metalness: 1,
                    roughness: 0.35, clearcoat: 1
                });

            wheels.push(
                car.getObjectByName('wheel_fl'),
                car.getObjectByName('wheel_fr'),
                car.getObjectByName('wheel_rl'),
                car.getObjectByName('wheel_rr')
            );

            ferrariGroup.add(car);
            startFerrariSequence();
        }
    );
}

/* ════════════════════════════════════════
   CAMERA HELPERS
   (identical – kept as-is)
════════════════════════════════════════ */

function moveCamera(x, y, z, tx, ty, tz, duration) {
    return new TWEEN.Tween(camera.position)
        .to({ x, y, z }, duration)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onStart(() => {
            new TWEEN.Tween(lookTarget)
                .to({ x:tx, y:ty, z:tz }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        });
}

function bounceCar() {
    return new TWEEN.Tween(car.position)
        .to({ y: 0.15 }, 400)
        .yoyo(true).repeat(1)
        .easing(TWEEN.Easing.Quadratic.Out);
}

/* ════════════════════════════════════════
   FERRARI CINEMATIC
   (identical – kept as-is)
════════════════════════════════════════ */

function startFerrariSequence() {

    camera.position.set(0, 25, -80);

    const fly = moveCamera(0, 8, -18, 0, 0.5, 0, 2500)
        .onStart(() => { motionBlurStrength = 0.25; });

    const approach = moveCamera(0, 3, -8, 0, 0.5, 0, 2500)
        .onComplete(() => { motionBlurStrength = 0.05; });

    const orbitObj = { angle: 0 };
    const orbit = new TWEEN.Tween(orbitObj)
        .to({ angle: Math.PI * 2 }, 8000)
        .easing(TWEEN.Easing.Sinusoidal.InOut)
        .onUpdate(() => {
            camera.position.x = Math.cos(orbitObj.angle) * 8;
            camera.position.z = Math.sin(orbitObj.angle) * 8;
            camera.position.y = 2.5 + Math.sin(orbitObj.angle * 2) * 0.5;
        });

    const frontInspect = moveCamera( 2,  1.5,  4, 0, 0.5, 0, 2200);
    const sideInspect  = moveCamera(-4,  1.2,  0, 0, 0.5, 0, 2200);
    const rearInspect  = moveCamera( 0,  2,   -5, 0, 0.5, 0, 2200);
    const bounce       = bounceCar();

    const rise = moveCamera(0, 12, -14, 0, 0, 0, 3000)
        .onStart(() => { motionBlurStrength = 0.12; });

    /* transition lands the camera at hall effect view position */
    const transition = moveCamera(6, 9, 11, 0, 1, 0, 5000)
        .onStart(() => { motionBlurStrength = 0.4; })
        .onComplete(() => {

            /* swap scenes */
            ferrariGroup.visible    = false;
            hallEffectGroup.visible = true;

            /* hall effect scene background */
            scene.background = new THREE.Color(0xbfd1e5);

            /* show lab UI */
            document.getElementById('introTitle').style.display = 'none';
            document.getElementById('labUI').style.display      = 'block';

            /* update camera FOV to match hall effect original */
            camera.fov = 50;
            camera.updateProjectionMatrix();

            /* hand orbit controls to hall effect target */
            controls.enabled = true;
            controls.target.set(0, 1, 0);
            controls.update();

            motionBlurStrength = 0;
            introFinished      = true;
        });

    fly.chain(approach);
    approach.chain(orbit);
    orbit.chain(frontInspect);
    frontInspect.chain(sideInspect);
    sideInspect.chain(rearInspect);
    rearInspect.chain(bounce);
    bounce.chain(rise);
    rise.chain(transition);

    fly.start();
}

/* ════════════════════════════════════════
   HALL EFFECT SCENE
════════════════════════════════════════ */

function createHallEffectScene() {

    hallEffectGroup.visible = false;
    scene.add(hallEffectGroup);

    /* grid */
    const gridHelper = new THREE.GridHelper(10, 10);
    hallEffectGroup.add(gridHelper);

    /* ── conductor sample and connectors ── */
    let sample     = createConnector(4,  0.8, 4,  0xb0b0b0, new THREE.Vector3( 0,  0,  0), true);
    let connector1 = createConnector(0.6, 1,  0.5, 0xEF3523, new THREE.Vector3( 2,  0,  0), false);
    let connector2 = createConnector(0.6, 1,  0.5, 0xEF3523, new THREE.Vector3(-2,  0,  0), false);
    let connector3 = createConnector(0.5, 1,  0.6, 0xEF3523, new THREE.Vector3( 0,  0,  2), false);
    let connector4 = createConnector(0.5, 1,  0.6, 0xEF3523, new THREE.Vector3( 0,  0, -2), false);
    hallEffectGroup.add(sample, connector1, connector2, connector3, connector4);

    /* ── measurement loop (red tube) ── */
    const measureSpline = new THREE.CatmullRomCurve3([
        new THREE.Vector3( 2,  0,  0),
        new THREE.Vector3( 4,  1,  0),
        new THREE.Vector3( 4,  3,  0),
        new THREE.Vector3(-4,  3,  0),
        new THREE.Vector3(-4,  1,  0),
        new THREE.Vector3(-2,  0,  0)
    ]);
    let measureTube = new THREE.TubeGeometry(measureSpline, 60, 0.1, 4, false);
    let measureMesh = new THREE.Mesh(measureTube,
        new THREE.MeshLambertMaterial({ color: 0xb00000 }));
    hallEffectGroup.add(measureMesh);

    /* ── supply loop (yellow tube) ── */
    const supplySpline = new THREE.CatmullRomCurve3([
        new THREE.Vector3( 0,    0,    2),
        new THREE.Vector3( 0.5,  0,    4),
        new THREE.Vector3( 5,    0.5,  3.6),
        new THREE.Vector3( 5,    0.5, -4),
        new THREE.Vector3( 0.5,  0,   -3.6),
        new THREE.Vector3( 0,    0,   -2)
    ]);
    let supplyTube = new THREE.TubeGeometry(supplySpline, 60, 0.1, 4, false);
    let supplyMesh = new THREE.Mesh(supplyTube,
        new THREE.MeshLambertMaterial({ color: 'yellow' }));
    hallEffectGroup.add(supplyMesh);

    /* ── battery / cell ── */
    let cell1    = createConnector(1.5, 1,   2.5, 0xFF3500, new THREE.Vector3(0, 0.5,  1),    false);
    let pos1     = createConnector(0.1, 0.05, 0.6, 0x000000, new THREE.Vector3(0, 0.5,  0.5), false);
    let pos2     = createConnector(0.6, 0.05, 0.1, 0x000000, new THREE.Vector3(0, 0.5,  0.5), false);
    let positive = new THREE.Group();
    positive.add(pos1, pos2);
    cell1.add(positive);

    let cell2    = createConnector(1.5, 1,  1.5, 0x000000, new THREE.Vector3(0, 0.5, -1),   false);
    let negative = createConnector(0.1, 0.05, 0.6, 0xffffff, new THREE.Vector3(0, 0.5, -0.3), false);
    cell2.add(negative);

    cell.add(cell1, cell2);
    cell.position.x = 5.5;
    cell.rotation.y = 0;
    hallEffectGroup.add(cell);

    /* ── magnet ── */
    let north1 = createConnector(3,   1,   1.5, 0xFF0030, new THREE.Vector3( 0, -1.5, 1), false);
    let north2 = createConnector(1,   2.0, 1.5, 0xFF0030, new THREE.Vector3(-2, -1.0, 1), false);
    let south1 = createConnector(3,   1,   1.5, 0x3000FF, new THREE.Vector3( 0,  1.5, 1), false);
    let south2 = createConnector(1,   2.0, 1.5, 0x3000FF, new THREE.Vector3(-2,  1.0, 1), false);
    magnet.add(north1, north2, south1, south2);

    /* field arrow indicator */
    magField = createConnector(0.06, 1.8,  0.05, 0x000000, new THREE.Vector3(0, 0, 0), false);
    const magHead1 = createConnector(0.06, 0.6, 0.05, 0x000000, new THREE.Vector3( 0.15, 0.6, 0), false);
    const magHead2 = createConnector(0.06, 0.6, 0.05, 0x000000, new THREE.Vector3(-0.15, 0.6, 0), false);
    const magNorth = createConnector(0.06, 0.6, 0.05, 0x000000, new THREE.Vector3(-0.15,-1.3, 0), false);
    const magN1    = createConnector(0.06, 0.6, 0.05, 0x000000, new THREE.Vector3( 0.15, 0,  0), false);
    const magN2    = createConnector(0.06, 0.6, 0.05, 0x000000, new THREE.Vector3( 0.32, 0,  0), false);
    magN1.rotation.z    = 0.5;
    magNorth.add(magN1, magN2);
    magHead1.rotation.z =  0.5;
    magHead2.rotation.z = -0.5;
    magField.add(magHead1, magHead2, magNorth);
    magnet.add(magField);
    magField.position.z = 1.8;
    magnet.position.x   = -8;
    hallEffectGroup.add(magnet);

    /* ── galvanometer ── */
    let galv = createConnector(2.5, 2, 0.5, 0xEFb035, new THREE.Vector3(0, 4.5, 0), false);
    galvNeedle = createConnector(0.06, 1, 0.05, 0x000000, new THREE.Vector3(0, 4, 0.26), false);
    galvNeedle.geometry.translate(0, 0.5, 0);
    galvNeedle.rotation.z = 0;
    hallEffectGroup.add(galv, galvNeedle);

    /* galvanometer face texture */
    const texture    = new THREE.TextureLoader().load('./assets/img/galvReading.png');
    const galvDisplay = new THREE.Mesh(
        new THREE.PlaneGeometry(0.45, 0.5),
        new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, map: texture, transparent: true })
    );
    galvDisplay.scale.set(5, 2.5, 1);
    galvDisplay.position.copy(new THREE.Vector3(0, 4.6, 0.26));
    hallEffectGroup.add(galvDisplay);

    /* ── hall effect electron slabs ── */
    let hallElectron  = createConnector(0.5, 0.9, 4.1, 0x00b0ff, new THREE.Vector3( 1.8, 0, 0), true);
    let hallPositron  = createConnector(0.5, 0.9, 4.1, 0xff020b, new THREE.Vector3(-1.8, 0, 0), true);
    hallElectrons.add(hallElectron, hallPositron);
    hallElectrons.visible = false;
    hallEffectGroup.add(hallElectrons);

    /* ── instanced electron flow ── */
    currentFlow();

    /* ── wire UI buttons ── */
    setupHallUI();
}

/* ─────────────────────────────────────────
   createConnector  (helper used throughout)
───────────────────────────────────────── */

function createConnector(x, y, z, col, loc, transparent) {

    const geo  = new THREE.BoxGeometry(x, y, z);
    const mat  = new THREE.MeshPhongMaterial({
        color      : col,
        side       : THREE.DoubleSide,
        transparent: transparent,
        opacity    : 0.45
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(loc);
    return mesh;
}

/* ─────────────────────────────────────────
   currentFlow  – InstancedFlow electron path
───────────────────────────────────────── */

function currentFlow() {

    const boxGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const boxMaterial = new THREE.MeshBasicMaterial();

    curves = [[
        { x:  0,    y: 0,   z:  2   },
        { x:  0.5,  y: 0,   z:  4   },
        { x:  5,    y: 0.5, z:  3.6 },
        { x:  5,    y: 0.5, z: -4   },
        { x:  0.5,  y: 0,   z: -3.6 },
        { x:  0,    y: 0,   z: -2   },
        { x: disp,  y: 0,   z:  0   }
    ]].map(function(curvePoints) {

        const curveVertices = curvePoints.map(function(handlePos) {
            const handle = new THREE.Mesh(boxGeometry, boxMaterial);
            handle.position.copy(handlePos);
            curveHandles.push(handle);
            return handle.position;
        });

        const curve = new THREE.CatmullRomCurve3(curveVertices);
        curve.curveType = 'centripetal';
        curve.closed    = true;

        const points = curve.getPoints(50);
        const line   = new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(points),
            new THREE.LineBasicMaterial({ color: 0x00ff00 })
        );
        scene.add(line);

        return { curve, line };
    });

    electronGeometry = new THREE.IcosahedronGeometry(0.15, 0);
    electronMaterial = new THREE.MeshBasicMaterial({ color: 0x00b0ff });

    const numberOfInstances = 20;
    flow = new InstancedFlow(numberOfInstances, curves.length, electronGeometry, electronMaterial);

    curves.forEach(function({ curve }, i) {
        flow.updateCurve(i, curve);
        scene.add(flow.object3D);
    });

    for (let i = 0; i < numberOfInstances; i++) {
        const curveIndex = i % curves.length;
        flow.setCurve(i, curveIndex);
        flow.moveIndividualAlongCurve(i, i * 1 / numberOfInstances);
        flow.object3D.setColorAt(i, new THREE.Color(0x00b0ff));
    }
}

/* ─────────────────────────────────────────
   squareFromPoints  – force arrow triangles
───────────────────────────────────────── */

function squareFromPoints(points) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position',
        new THREE.BufferAttribute(new Float32Array(points), 3));
    const material = new THREE.MeshBasicMaterial({
        color      : 0x111111,
        transparent: true,
        opacity    : 0.9,
        side       : THREE.DoubleSide
    });
    return new THREE.Mesh(geometry, material);
}

/* ─────────────────────────────────────────
   positiveHall
───────────────────────────────────────── */

function positiveHall() {

    scene.remove(hall);
    hall = new THREE.Group();

    new TWEEN.Tween(magnet.position)
        .to({ x: -1 }, 3000)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
    magnet.position.z = 0;
    change = 2;

    setTimeout(function() {
        pointChange();
        setTimeout(function() {
            hallElectrons.visible    = true;
            hallElectrons.rotation.y = 0;
            hall.add(squareFromPoints([ 3.5, .4, -.6,  3.5, .4, .6,  2.5, .2,  0  ]));
            hall.add(squareFromPoints([-3.5, .6,  0,  -2.5, .2, -.6, -2.5, .2, .6  ]));
            hall.add(squareFromPoints([-1.5, 3.6, 0,  -2.5, 3.5, -.6,-2.5, 3.5, .6 ]));
            hall.add(squareFromPoints([ 1.5, 3.6, -.6, 1.5, 3.6, .6,  2.5, 3.5, 0  ]));
            scene.add(hall);
            new TWEEN.Tween(galvNeedle.rotation)
                .to({ z: 0.8 }, 1500)
                .easing(TWEEN.Easing.Cubic.In)
                .start();
        }, 1500);
    }, 2500);
}

/* ─────────────────────────────────────────
   negativeHall
───────────────────────────────────────── */

function negativeHall() {

    scene.remove(hall);
    hall = new THREE.Group();

    new TWEEN.Tween(magnet.position)
        .to({ x: -1 }, 3000)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
    magnet.position.z = 0;
    change = 1;

    setTimeout(function() {
        pointChange();
        setTimeout(function() {
            hallElectrons.visible    = true;
            hallElectrons.rotation.y = 3.14;
            hall.add(squareFromPoints([ 2.5, .2, -.6,  2.5, .2,  .6,  3.5, .5,  0  ]));
            hall.add(squareFromPoints([-2.5, .2,  0,  -3.5, .5, -.2, -3.5, .5,  .6 ]));
            hall.add(squareFromPoints([-2.5, 3.5, 0,  -1.5, 3.6, -.6,-1.5, 3.6, .6 ]));
            hall.add(squareFromPoints([ 2.5, 3.5, -.6, 2.5, 3.5, .6,  1.5, 3.6,  0 ]));
            scene.add(hall);
            new TWEEN.Tween(galvNeedle.rotation)
                .to({ z: -0.8 }, 1500)
                .easing(TWEEN.Easing.Cubic.In)
                .start();
        }, 1500);
    }, 2500);
}

/* ─────────────────────────────────────────
   pointChange  – shift electron loop offset
───────────────────────────────────────── */

function pointChange() {

    const offsets = { 0: new THREE.Vector3(0, 0, 0), 1: new THREE.Vector3(-0.9, 0, 0), 2: new THREE.Vector3(0.9, 0, 0) };
    curves[0].curve.points[6] = offsets[change];

    curves.forEach(function({ curve, line }) {
        const points = curve.getPoints(50);
        line.geometry.setFromPoints(points);
        flow.updateCurve(0, curve);
    });
}

/* ─────────────────────────────────────────
   theorySite
───────────────────────────────────────── */

function theorySite() {
    window.open('../Theory/Magnetism/Magnetism_Hall_Effect.html', '_self');
}

/* ─────────────────────────────────────────
   setupHallUI  (= buttonLoad in original)
───────────────────────────────────────── */

function setupHallUI() {

    messageEl     = document.getElementById('message-el');
    buttonCurrent = document.getElementById('change-el');
    buttonMagnet  = document.getElementById('flip-el');
    buttonMove    = document.getElementById('move-el');
    buttonReset   = document.getElementById('reset-el');

    document.getElementById('theorybutton')
        .addEventListener('click', theorySite);

    /* CURRENT CHANGE */
    buttonCurrent.addEventListener('click', function() {
        direction = !direction;
        if (direction) {
            cell.rotation.y  = 0;
            cell.position.z  = 0;
            t = 0.001;
        } else {
            cell.rotation.y  = 3.14;
            cell.position.z  = 0.5;
            t = -0.001;
        }
    });

    /* FIELD FLIP */
    buttonMagnet.addEventListener('click', function() {
        mrotate = !mrotate;
        if (mrotate) {
            magField.rotation.y  =  3.14;
            magField.position.z  =  0.25;
            magnet.rotation.x    =  3.14;
        } else {
            magnet.rotation.x    =  0;
            magField.position.z  =  1.8;
            magField.rotation.y  =  0;
        }
    });

    /* MOVE MAGNET */
    buttonMove.addEventListener('click', function() {
        buttonCurrent.disabled = true;
        buttonMagnet.disabled  = true;

        if      (!mrotate &&  direction) positiveHall();
        else if ( mrotate &&  direction) negativeHall();
        else if (!mrotate && !direction) negativeHall();
        else if ( mrotate && !direction) positiveHall();

        setTimeout(function() {
            buttonReset.style.visibility = 'visible';
        }, 7000);
    });

    /* RESET MAGNET */
    buttonReset.addEventListener('click', function() {
        new TWEEN.Tween(magnet.position)
            .to({ x: -8 }, 8000)
            .easing(TWEEN.Easing.Cubic.Out)
            .start();
        magnet.position.z = 0;
        change = 0;

        setTimeout(function() {
            pointChange();
            buttonReset.style.visibility = 'hidden';
            buttonCurrent.disabled       = false;
            buttonMagnet.disabled        = false;
            hallElectrons.visible        = false;
            hall.visible                 = false;
            new TWEEN.Tween(galvNeedle.rotation)
                .to({ z: 0 }, 2000)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();
        }, 2500);
    });
}

/* ════════════════════════════════════════
   RESIZE
   (identical – kept as-is)
════════════════════════════════════════ */

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ════════════════════════════════════════
   ANIMATE
════════════════════════════════════════ */

function animate() {

    requestAnimationFrame(animate);

    TWEEN.update();

    /* ── Ferrari intro camera steering ── */
    if (!introFinished) {

        smoothLook.lerp(lookTarget, 0.05);
        camera.lookAt(smoothLook);

        const time = -performance.now() / 1000;
        grid.position.z = -(time) % 1;

        for (let i = 0; i < wheels.length; i++) {
            wheels[i].rotation.x = time * Math.PI * 2;
        }
    }

    controls.update();

    /* fake motion-blur via exposure during Ferrari sequence */
    currentExposure += ((1.1 - motionBlurStrength) - currentExposure) * 0.03;
    renderer.toneMappingExposure = currentExposure;

    /* ── Hall effect per-frame updates ── */
    if (introFinished && flow) {
        flow.moveAlongCurve(t);
    }

    renderer.render(scene, camera);
}
