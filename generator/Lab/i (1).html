<script type="importmap">
{
    "imports": {

        "three":
        "https://unpkg.com/three@0.160.0/build/three.module.js",

        "three/addons/":
        "https://unpkg.com/three@0.160.0/examples/jsm/",

        "tween":
        "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js",

        "lil-gui":

<body>


<script type="module">


/* ------------------------------------------------ */
/* IMPORTS  — via importmap                          */
/* ------------------------------------------------ */



import * as THREE
from 'three';


import { OrbitControls }
from 'three/addons/controls/OrbitControls.js';
                                                          
import { DragControls }
from 'three/addons/controls/DragControls.js';

import { TransformControls }  from 'three/addons/controls/TransformControls.js';

import { GLTFLoader }
from 'three/addons/loaders/GLTFLoader.js';

import { DRACOLoader }
from 'three/addons/loaders/DRACOLoader.js';                 
import { RGBELoader }
from 'three/addons/loaders/RGBELoader.js';

import TWEEN
from 'tween';

import { GUI }
from 'lil-gui';

/* ------------------------------------------------ */
/* GLOBALS                                           */
/* ------------------------------------------------ */

let renderer;
let camera;
let scene;
let controls;

let ferrariGroup = new THREE.Group();
let capacitorGroup = new THREE.Group();

let car;
let grid;

const wheels = [];

const lookTarget =
new THREE.Vector3(0,0.5,0);

const smoothLook =
new THREE.Vector3(0,0.5,0);

let introFinished = false;

let motionBlurStrength = 0;
let currentExposure = 1.1;


/* ------------------------------------------------ */
/* INIT                                              */
/* ------------------------------------------------ */

init();

function init(){

    renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        window.devicePixelRatio
    );

    renderer.outputColorSpace =
    THREE.SRGBColorSpace;

    renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 1.1;

    document.body.appendChild(
        renderer.domElement
    );

    camera =
    new THREE.PerspectiveCamera(
        40,
        window.innerWidth/window.innerHeight,
        0.1,
        50000
    );

    scene = new THREE.Scene();

    scene.background =
    new THREE.Color(0x111111);

    controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enabled = false;

    createLights();

    createFerrariShowroom();
    createCapacitorScene();


    animate();

    window.addEventListener(
        'resize',
        onResize
    );
}


/* ------------------------------------------------ */
/* LIGHTS                                            */
/* ------------------------------------------------ */

function createLights(){

    const ambient =
    new THREE.AmbientLight(
        0xffffff,
        2
    );

    scene.add(ambient);

    const dir =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );

    dir.position.set(
        5,
        10,
        7
    );

    scene.add(dir);
}


/* ------------------------------------------------ */
/* FERRARI INTRO                                     */
/* ------------------------------------------------ */

function createFerrariShowroom(){

    scene.add(ferrariGroup);

    grid =
    new THREE.GridHelper(
        20,
        40,
        0xffffff,
        0xffffff
    );

    grid.material.opacity = 0.15;
    grid.material.transparent = true;

    ferrariGroup.add(grid);

    new RGBELoader()

    .setDataType(
        THREE.UnsignedByteType
    )

    .load(

        'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',

        function(texture){

            const pmrem =
            new THREE.PMREMGenerator(renderer);

            const env =
            pmrem
            .fromEquirectangular(texture)
            .texture;

            scene.environment = env;

            texture.dispose();
            pmrem.dispose();
        }
    );

    const dracoLoader =
    new DRACOLoader();

    dracoLoader.setDecoderPath(
        'https://www.gstatic.com/draco/v1/decoders/'
    );

    const loader =
    new GLTFLoader();

    loader.setDRACOLoader(
        dracoLoader
    );

    loader.load(

        'https://threejs.org/examples/models/gltf/ferrari.glb',

        function(gltf){

            car =
            gltf.scene.children[0];

            const bodyMaterial =
            new THREE.MeshPhysicalMaterial({

                color:0xff0000,
                metalness:1,
                roughness:0.35,
                clearcoat:1
            });

            car.getObjectByName(
                'body'
            ).material = bodyMaterial;

            wheels.push(

                car.getObjectByName('wheel_fl'),
                car.getObjectByName('wheel_fr'),
                car.getObjectByName('wheel_rl'),
                car.getObjectByName('wheel_rr')
            );

            ferrariGroup.add(car);

            startFerrariSequence();
        }
    );
}


/* ------------------------------------------------ */
/* CAMERA MOVE                                       */
/* ------------------------------------------------ */

function moveCamera(
    x,y,z,
    tx,ty,tz,
    duration
){

    return new TWEEN.Tween(
        camera.position
    )

    .to({
        x,y,z
    },duration)

    .easing(
        TWEEN.Easing.Cubic.InOut
    )

    .onStart(()=>{

        new TWEEN.Tween(
            lookTarget
        )

        .to({
            x:tx,
            y:ty,
            z:tz
        },duration)

        .easing(
            TWEEN.Easing.Cubic.InOut
        )

        .start();
    });
}

function bounceCar(){

    return new TWEEN.Tween(
        car.position
    )

    .to({
        y:0.15
    },400)

    .yoyo(true)

    .repeat(1)

    .easing(
        TWEEN.Easing.Quadratic.Out
    );
}


/* ------------------------------------------------ */
/* FERRARI CINEMATIC                                 */
/* ------------------------------------------------ */

function startFerrariSequence(){

    camera.position.set(
        0,
        25,
        -80
    );

    /*
        SHOT 1
        Fast fly-in
    */

    const fly =
    moveCamera(
        0,8,-18,
        0,0.5,0,
        2500
    )

    .onStart(()=>{

        motionBlurStrength = 0.25;
    });

    /*
        SHOT 2
        Slow approach
    */

    const approach =
    moveCamera(
        0,3,-8,
        0,0.5,0,
        2500
    )

    .onComplete(()=>{

        motionBlurStrength = 0.05;
    });

    /*
        SHOT 3
        Orbit
    */

    const orbitObj = {
        angle:0
    };

    const orbit =
    new TWEEN.Tween(orbitObj)

    .to({
        angle:Math.PI*2
    },8000)

    .easing(
        TWEEN.Easing.Sinusoidal.InOut
    )

    .onUpdate(()=>{

        camera.position.x =
        Math.cos(
            orbitObj.angle
        ) * 8;

        camera.position.z =
        Math.sin(
            orbitObj.angle
        ) * 8;

        camera.position.y =
        2.5 +

        Math.sin(
            orbitObj.angle * 2
        ) * 0.5;
    });

    /*
        SHOT 4
        Front inspection
    */

    const frontInspect =
    moveCamera(
        2,
        1.5,
        4,
        0,
        0.5,
        0,
        2200
    );

    /*
        SHOT 5
        Side inspection
    */

    const sideInspect =
    moveCamera(
        -4,
        1.2,
        0,
        0,
        0.5,
        0,
        2200
    );

    /*
        SHOT 6
        Rear inspection
    */

    const rearInspect =
    moveCamera(
        0,
        2,
        -5,
        0,
        0.5,
        0,
        2200
    );

    /*
        SHOT 7
        Suspension bounce
    */

    const bounce =
    bounceCar();

    /*
        SHOT 8
        Ascend shot
    */

    const rise =
    moveCamera(
        0,
        12,
        -14,
        0,
        0,
        0,
        3000
    )

    .onStart(()=>{

        motionBlurStrength = 0.12;
    });

    /*
        SHOT 9
        Massive transition
    */

    const transition =
    moveCamera(
        1650,
        300,
        800,
        0,
        0,
        0,
        5000
    )

    .onStart(()=>{

        motionBlurStrength = 0.4;
    })

    .onComplete(()=>{

        ferrariGroup.visible = false;

        capacitorGroup.visible = true;

        document.getElementById(
            'introTitle'
        ).style.display = 'none';

        document.getElementById(
            'labUI'
        ).style.display = 'block';

        controls.enabled = true;

        controls.target.set(
            80,
            130,
            -30
        );

        controls.update();

        motionBlurStrength = 0;

        introFinished = true;
    });

    /*
        REAL CINEMATIC CHAIN
    */

    fly.chain(
        approach
    );

    approach.chain(
        orbit
    );

    orbit.chain(
        frontInspect
    );

    frontInspect.chain(
        sideInspect
    );

    sideInspect.chain(
        rearInspect
    );

    rearInspect.chain(
        bounce
    );

    bounce.chain(
        rise
    );

    rise.chain(
        transition
    );

    fly.start();
}




/* ------------------------------------------------ */
/* RESIZE                                            */
/* ------------------------------------------------ */

function onResize(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* ------------------------------------------------ */
/* ANIMATE                                           */
/* ------------------------------------------------ */

function animate(){

    requestAnimationFrame(
        animate
    );

    TWEEN.update();

    smoothLook.lerp(
        lookTarget,
        0.05
    );

    if(!introFinished){

        camera.lookAt(
            smoothLook
        );

        const time =
        -performance.now()/1000;

        grid.position.z =
        -(time)%1;

        for(let i=0;i<wheels.length;i++){

            wheels[i].rotation.x =
            time*Math.PI*2;
        }
    }

    controls.update();

 
    /*
    Fake cinematic motion blur
*/

    currentExposure +=
    (
        (1.1 - motionBlurStrength)
        - currentExposure
    ) * 0.03;

    renderer.toneMappingExposure =
    currentExposure;

    renderer.render(
        scene,
        camera
    );
}

</script>

</body>
</html>
