<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Three.js Video Background</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
    }

    /* Fullscreen video */
    #bg-video {
        position: fixed;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;

        z-index: -1;
    }

    canvas {
        display: block;
    }
</style>
</head>
<body>

<video
    id="bg-video"
    autoplay
    muted
    loop
    playsinline>
    <source src="./bigbucksbunny.mp4" type="video/mp4">
</video>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.181.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.181.1/examples/jsm/"
  }
}
</script>

<script type="module" src="./main.js"></script>

</body>
</html>
