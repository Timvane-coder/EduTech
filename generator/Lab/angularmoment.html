<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Ferrari Intro → Angular Momentum Lab</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#111; overflow:hidden; font-family:'Segoe UI',sans-serif; }
        canvas { display:block; }

        #introTitle {
            position:fixed; bottom:48px; left:50%;
            transform:translateX(-50%);
            color:#fff; font-size:13px; letter-spacing:.25em;
            text-transform:uppercase; opacity:.55;
            pointer-events:none; z-index:10;
        }

        #labUI { display:none; }

        /* ── Top menu ── */
        #topmenu {
            position:fixed; top:0; left:0; right:0; height:38px;
            background:rgba(15,15,20,.93);
            color:#e8e8e8; font-size:13px; letter-spacing:.12em;
            text-transform:uppercase;
            display:flex; align-items:center; padding:0 18px;
            z-index:100;
            border-bottom:1px solid rgba(255,255,255,.08);
        }

        /* ── Bottom menu ── */
        #menu {
            position:fixed; bottom:0; left:0; right:0;
            background:rgba(15,15,20,.93);
            color:#d4d4d4; font-size:12.5px;
            padding:9px 18px;
            display:flex; align-items:center;
            flex-wrap:wrap; gap:8px;
            z-index:100;
            border-top:1px solid rgba(255,255,255,.08);
        }
        #message-el {
            flex:1 1 100%; font-size:11.5px;
            color:#aaa; margin-top:2px;
        }

        #menu button {
            padding:6px 14px; border:none; border-radius:4px;
            font-size:12px; font-weight:600; letter-spacing:.06em;
            cursor:pointer; color:#fff; transition:filter .15s;
        }
        #menu button:hover  { filter:brightness(1.18); }
        #menu button:disabled { opacity:.4; cursor:default; }

        #isStop    { background:rgb(164,26,26); }
        #isLinear  { background:#1a4e8f; }
    </style>
</head>
<body>

<div id="introTitle">Ferrari SF90 Stradale &nbsp;&middot;&nbsp; Loading Lab&hellip;</div>

<!-- ═══════════════  LAB UI  ═══════════════ -->
<div id="labUI">

    <div id="topmenu">Mechanics &mdash; Angular Momentum</div>

    <div id="menu">
        <button id="isStop">STOP</button>
        <button id="isLinear">CIRCULAR MOTION</button>
        <div id="message-el">
            Car moving in a straight path with constant velocity experiences no (Linear) Momentum
        </div>
    </div>

</div>
<!-- ══════════════════════════════════════════ -->

<script type="importmap">
{
    "imports": {
        "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "tween":         "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js"
    }
}
</script>

<script type="module">

import * as THREE        from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader }    from 'three/addons/loaders/RGBELoader.js';
import TWEEN             from 'tween';

/* ════════════════════════════════════════
   GLOBALS
════════════════════════════════════════ */

let renderer, camera, scene, controls;

/* ── Ferrari intro ── */
let ferrariGroup = new THREE.Group();
let car, grid;
const wheels     = [];
const lookTarget = new THREE.Vector3(0, 0.5, 0);
const smoothLook = new THREE.Vector3(0, 0.5, 0);

let introFinished      = false;
let motionBlurStrength = 0;
let currentExposure    = 1.1;

/* ── Angular Momentum lab ── */
let angularMomentumGroup = new THREE.Group();

let amModel, amMixer, amModelReady = false;
let distToCar; // the 'vectorC' object in the model

/* Animation clip buckets  (mirrors original constActions / actions) */
const constActions = {};   // wheelBAction, wheelFAction, vtrackAction
const actions      = {};   // circularMotion, stopAction, linearAction, vectorCAction

/* Visible arrow objects inside the model */
const ARROW = [];          // vectorA, vectorB, dist

/* UI state */
let isLinear = true;
let isStop   = true;       // true = playing, false = paused (START shown)

const amClock = new THREE.Clock();

/* Messages */
const messages = [
    'Car moving in a straight path with constant velocity experiences no (Linear) Momentum',
    'Car moving in a circular path with constant velocity experiences Angular Momentum'
];

/* DOM refs – populated after transition */
let stopButton, linearButton, messageEl;

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */

init();

function init() {

    /* ── WebGL renderer ── */
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    /* ── Camera  (FOV 65 matches Angular Momentum scene) ── */
    camera = new THREE.PerspectiveCamera(
        65, window.innerWidth / window.innerHeight, 0.1, 50000
    );

    /* ── Scene ── */
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    /* ── Controls ── */
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled       = false;
    controls.enablePan     = true;
    controls.enableZoom    = true;
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance   = 0.1;
    controls.maxDistance   = 5000;

    createLights();
    createFerrariShowroom();
    createAngularMomentumScene();   // builds scene objects; stays hidden until transition

    animate();

    window.addEventListener('resize', onResize);
}

/* ════════════════════════════════════════
   LIGHTS  (unchanged)
════════════════════════════════════════ */

function createLights() {
    scene.add(new THREE.AmbientLight(0xffffff, 2));

    const dir = new THREE.DirectionalLight(0xffffff, 4);
    dir.position.set(5, 10, 7);
    scene.add(dir);
}

/* ════════════════════════════════════════
   FERRARI SHOWROOM  (unchanged)
════════════════════════════════════════ */

function createFerrariShowroom() {

    scene.add(ferrariGroup);

    grid = new THREE.GridHelper(20, 40, 0xffffff, 0xffffff);
    grid.material.opacity     = 0.15;
    grid.material.transparent = true;
    ferrariGroup.add(grid);

    new RGBELoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
            'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
            function (texture) {
                const pmrem = new THREE.PMREMGenerator(renderer);
                const env   = pmrem.fromEquirectangular(texture).texture;
                scene.environment = env;
                texture.dispose();
                pmrem.dispose();
            }
        );

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.load(
        'https://threejs.org/examples/models/gltf/ferrari.glb',
        function (gltf) {
            car = gltf.scene.children[0];

            car.getObjectByName('body').material =
                new THREE.MeshPhysicalMaterial({
                    color: 0xff0000, metalness: 1,
                    roughness: 0.35, clearcoat: 1
                });

            wheels.push(
                car.getObjectByName('wheel_fl'),
                car.getObjectByName('wheel_fr'),
                car.getObjectByName('wheel_rl'),
                car.getObjectByName('wheel_rr')
            );

            ferrariGroup.add(car);
            startFerrariSequence();
        }
    );
}

/* ════════════════════════════════════════
   CAMERA HELPERS  (unchanged)
════════════════════════════════════════ */

function moveCamera(x, y, z, tx, ty, tz, duration) {
    return new TWEEN.Tween(camera.position)
        .to({ x, y, z }, duration)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onStart(() => {
            new TWEEN.Tween(lookTarget)
                .to({ x: tx, y: ty, z: tz }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        });
}

function bounceCar() {
    return new TWEEN.Tween(car.position)
        .to({ y: 0.15 }, 400)
        .yoyo(true).repeat(1)
        .easing(TWEEN.Easing.Quadratic.Out);
}

/* ════════════════════════════════════════
   FERRARI CINEMATIC  (unchanged)
════════════════════════════════════════ */

function startFerrariSequence() {

    camera.position.set(0, 25, -80);

    const fly = moveCamera(0, 8, -18, 0, 0.5, 0, 2500)
        .onStart(() => { motionBlurStrength = 0.25; });

    const approach = moveCamera(0, 3, -8, 0, 0.5, 0, 2500)
        .onComplete(() => { motionBlurStrength = 0.05; });

    const orbitObj = { angle: 0 };
    const orbit = new TWEEN.Tween(orbitObj)
        .to({ angle: Math.PI * 2 }, 8000)
        .easing(TWEEN.Easing.Sinusoidal.InOut)
        .onUpdate(() => {
            camera.position.x = Math.cos(orbitObj.angle) * 8;
            camera.position.z = Math.sin(orbitObj.angle) * 8;
            camera.position.y = 2.5 + Math.sin(orbitObj.angle * 2) * 0.5;
        });

    const frontInspect = moveCamera( 2,  1.5,  4, 0, 0.5, 0, 2200);
    const sideInspect  = moveCamera(-4,  1.2,  0, 0, 0.5, 0, 2200);
    const rearInspect  = moveCamera( 0,  2,   -5, 0, 0.5, 0, 2200);
    const bounce       = bounceCar();

    const rise = moveCamera(0, 12, -14, 0, 0, 0, 3000)
        .onStart(() => { motionBlurStrength = 0.12; });

    /* ── Transition into Angular Momentum lab ── */
    const transition = moveCamera(-65, 40, 65, 0, 5, 0, 5000)
        .onStart(() => { motionBlurStrength = 0.4; })
        .onComplete(() => {

            ferrariGroup.visible         = false;
            angularMomentumGroup.visible = true;

            scene.background = new THREE.Color(0xbfd1e5);

            document.getElementById('introTitle').style.display = 'none';
            document.getElementById('labUI').style.display      = 'block';

            /* Camera matches Angular Momentum's original position */
            camera.position.set(-65, 40, 65);
            camera.lookAt(8, 3, 0);

            controls.enabled = true;
            controls.target.set(0, 5, 0);
            controls.update();

            motionBlurStrength = 0;
            introFinished      = true;

            setupLabUI();
        });

    fly.chain(approach);
    approach.chain(orbit);
    orbit.chain(frontInspect);
    frontInspect.chain(sideInspect);
    sideInspect.chain(rearInspect);
    rearInspect.chain(bounce);
    bounce.chain(rise);
    rise.chain(transition);

    fly.start();
}

/* ════════════════════════════════════════
   ANGULAR MOMENTUM SCENE
════════════════════════════════════════ */

function createAngularMomentumScene() {

    angularMomentumGroup.visible = false;
    scene.add(angularMomentumGroup);

    /* Ground grid */
    const hGrid = new THREE.GridHelper(150, 10);
    angularMomentumGroup.add(hGrid);

    /* Circular orbit path (inlined circularCurve helper) */
    const orbitLine = makeCircularCurve(51, 0xb00000);
    angularMomentumGroup.add(orbitLine);

    /* Load movingCar.glb */
    const loader = new GLTFLoader();
    loader.setPath('./model/');
    loader.load(
        'movingCar.glb',
        function (gltf) {

            amModel = gltf.scene;
            amModel.scale.set(3, 3, 3);
            scene.add(amModel);
            angularMomentumGroup.add(amModel);

            amModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow    = true;
                    child.receiveShadow = true;
                }
            });

            amMixer = new THREE.AnimationMixer(amModel);

            const fixedStates  = ['wheelBAction', 'wheelFAction', 'vtrackAction'];
            const actionStates = ['circularMotion', 'stopAction', 'linearAction', 'vectorCAction'];

            for (const clip of gltf.animations) {
                const action = amMixer.clipAction(clip);
                if (fixedStates.includes(clip.name))  constActions[clip.name] = action;
                if (actionStates.includes(clip.name)) actions[clip.name]      = action;
            }

            /* Named helper objects inside the model */
            const vectorA  = amModel.getObjectByName('vectorA');
            const vectorB  = amModel.getObjectByName('vectorB');
            const dist     = amModel.getObjectByName('dist');
            distToCar      = amModel.getObjectByName('vectorC');

            ARROW.push(vectorA, vectorB, dist);

            /* Start in linear mode */
            if (actions['linearAction'])  actions['linearAction'].play();
            if (actions['vectorCAction']) actions['vectorCAction'].play();

            for (const key in constActions) constActions[key].play();

            /* Arrows hidden initially */
            ARROW.forEach(a => { if (a) a.visible = false; });

            amModelReady = true;
        },
        undefined,
        (e) => console.warn('movingCar.glb not found – lab works without it.', e)
    );
}

/* ────────────────────────────────────────
   makeCircularCurve
   Inlined version of circularCurve.js
   Returns a THREE.Line representing the orbit
──────────────────────────────────────── */

function makeCircularCurve(radius, color) {

    const points = [];
    const segments = 128;

    for (let i = 0; i <= segments; i++) {
        const theta = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(
            Math.cos(theta) * radius,
            0,
            Math.sin(theta) * radius
        ));
    }

    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ color });
    return new THREE.Line(geometry, material);
}

/* ════════════════════════════════════════
   STATE MACHINE  (mirrors original stop())
════════════════════════════════════════ */

function applyState(stop, linear) {

    /* ── Pause / resume all clips ── */
    const paused = !stop;

    if (actions['linearAction'])  actions['linearAction'].paused  = paused;
    if (actions['vectorCAction']) actions['vectorCAction'].paused = paused;
    if (actions['circularMotion'])actions['circularMotion'].paused= paused;

    for (const key in constActions) constActions[key].paused = paused;

    /* ── Switch between linear and circular clips ── */
    if (linear) {
        if (actions['circularMotion']) actions['circularMotion'].stop().reset();
        if (actions['linearAction'])   actions['linearAction'].play();
        if (actions['vectorCAction'])  actions['vectorCAction'].play();
        ARROW.forEach(a => { if (a) a.visible = false; });
        if (distToCar) distToCar.visible = true;
    } else {
        if (actions['linearAction'])   actions['linearAction'].stop().reset();
        if (actions['vectorCAction'])  actions['vectorCAction'].stop().reset();
        if (actions['circularMotion']) actions['circularMotion'].play();
        ARROW.forEach(a => { if (a) a.visible = false; });
        if (distToCar) distToCar.visible = false;
    }

    /* ── Stopped in circular mode → show arrows ── */
    if (!stop && !linear) {
        ARROW.forEach(a => { if (a) a.visible = true; });
        if (distToCar) distToCar.visible = false;
    }
}

/* ════════════════════════════════════════
   LAB UI  (wired after transition completes)
════════════════════════════════════════ */

function setupLabUI() {

    stopButton   = document.getElementById('isStop');
    linearButton = document.getElementById('isLinear');
    messageEl    = document.getElementById('message-el');

    /* ── STOP / START ── */
    stopButton.addEventListener('click', () => {
        isStop = !isStop;
        stopButton.textContent = isStop ? 'STOP' : 'START';
        applyState(isStop, isLinear);
    });

    /* ── CIRCULAR MOTION / LINEAR MOTION toggle ── */
    linearButton.addEventListener('click', () => {
        isLinear = !isLinear;
        linearButton.textContent = isLinear ? 'CIRCULAR MOTION' : 'LINEAR MOTION';
        messageEl.textContent    = messages[isLinear ? 0 : 1];
        applyState(isStop, isLinear);
    });
}

/* ════════════════════════════════════════
   RESIZE  (unchanged)
════════════════════════════════════════ */

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ════════════════════════════════════════
   ANIMATE
════════════════════════════════════════ */

function animate() {

    requestAnimationFrame(animate);

    TWEEN.update();

    if (!introFinished) {

        smoothLook.lerp(lookTarget, 0.05);
        camera.lookAt(smoothLook);

        const time = -performance.now() / 1000;
        grid.position.z = -(time) % 1;

        for (let i = 0; i < wheels.length; i++) {
            wheels[i].rotation.x = time * Math.PI * 2;
        }
    }

    controls.update();

    currentExposure += ((1.1 - motionBlurStrength) - currentExposure) * 0.03;
    renderer.toneMappingExposure = currentExposure;

    /* ── Angular Momentum mixer ── */
    if (amModelReady && amMixer) {
        amMixer.update(amClock.getDelta());
    }

    renderer.render(scene, camera);
}

</script>
</body>
</html>
