<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Ferrari Intro → Periodic Motion Lab</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#111; overflow:hidden; font-family:'Segoe UI',sans-serif; }
        canvas { display:block; }

        #introTitle {
            position:fixed; bottom:48px; left:50%;
            transform:translateX(-50%);
            color:#fff; font-size:13px; letter-spacing:.25em;
            text-transform:uppercase; opacity:.55;
            pointer-events:none; z-index:10;
        }

        #labUI { display:none; }

        /* ── Top menu ── */
        #topmenu {
            position:fixed; top:0; left:0; right:0; height:38px;
            background:rgba(15,15,20,.93);
            color:#e8e8e8; font-size:13px; letter-spacing:.12em;
            text-transform:uppercase;
            display:flex; align-items:center; padding:0 18px;
            z-index:100;
            border-bottom:1px solid rgba(255,255,255,.08);
        }

        /* ── Bottom menu ── */
        #menu {
            position:fixed; bottom:0; left:0; right:0;
            background:rgba(15,15,20,.93);
            color:#d4d4d4; font-size:12.5px;
            padding:9px 18px;
            display:flex; align-items:center;
            flex-wrap:wrap; gap:8px;
            z-index:100;
            border-top:1px solid rgba(255,255,255,.08);
            line-height:1.9;
        }
        #menu strong { color:#e8e8e8; font-size:11.5px; letter-spacing:.06em; flex:1 1 100%; }
        #menu a  { color:#e07070; font-weight:600; }
        #menu label { color:#aaa; font-size:11.5px; }
        #menu sup { font-size:9px; }

        #menu input[type=range]{
            accent-color:#c0392b;
            vertical-align:middle;
            width:160px;
        }

        #menu button {
            padding:6px 14px; border:none; border-radius:4px;
            font-size:12px; font-weight:600; letter-spacing:.06em;
            cursor:pointer; color:#fff; transition:filter .15s;
        }
        #menu button:hover { filter:brightness(1.18); }
        #stop   { background:rgb(164,26,26); }
        #reset  { background:#555; }
        #pendulum-el { background:#1a4e8f; }
        #spring-el   { background:#2a6e3f; }
        #theory-el   { background:#5a3e8f; }

        .ctrl-row {
            display:flex; align-items:center; gap:6px;
            flex:1 1 100%;
        }
        .readout { color:#e07070; font-weight:600; min-width:28px; }
    </style>
</head>
<body>

<div id="introTitle">Ferrari SF90 Stradale &nbsp;&middot;&nbsp; Loading Lab&hellip;</div>

<!-- ═══════════════  LAB UI  ═══════════════ -->
<div id="labUI">

    <div id="topmenu">Mechanics &mdash; Simple Harmonic Motion</div>

    <div id="menu">
        <strong>CONNECTION BETWEEN SIMPLE HARMONIC MOTION AND UNIFORM CIRCULAR MOTION</strong>

        <div class="ctrl-row">
            <label for="time">Time Period =</label>
            <input type="range" id="time" min="1" max="25" value="5" step="0.2">
            <span class="readout" id="timeDisplay">5</span> s
            &nbsp;&nbsp;
            Frequency = <span class="readout" id="freqDisplay">1.26</span> s<sup>-1</sup>
        </div>

        <div class="ctrl-row">
            <label for="pos">Position =</label>
            <input type="range" id="pos" min="2" max="10" value="5" step="0.5">
            <span class="readout" id="posDisplay">5</span> m
        </div>

        <button id="stop">STOP</button>
        <button id="reset">RESET</button>
        <button id="pendulum-el">The Pendulum</button>
        <button id="spring-el">The Spring</button>
        <button id="theory-el">THEORY</button>
    </div>

</div>

<!-- ═══════════════════════════════════════ -->

<script type="importmap">
{
    "imports": {
        "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "tween":         "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js"
    }
}
</script>

<script type="module">

import * as THREE        from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader }    from 'three/addons/loaders/RGBELoader.js';
import TWEEN             from 'tween';

/* ════════════════════════════════════════
   GLOBALS
════════════════════════════════════════ */

let renderer, camera, scene, controls;

/* ferrari */
let ferrariGroup = new THREE.Group();
let car, grid;
const wheels     = [];
const lookTarget = new THREE.Vector3(0, 0.5, 0);
const smoothLook = new THREE.Vector3(0, 0.5, 0);

let introFinished      = false;
let motionBlurStrength = 0;
let currentExposure    = 1.1;

/* periodic motion lab */
let periodicMotionGroup = new THREE.Group();

let t           = 0;
let line        = new THREE.Group();
let pmGroup     = new THREE.Group();   // the growing line-trace group
let sphere, dirGroup, ring, requestID;
let pmStop      = false;

const pmParams = {
    freq : 1.256,
    pos  : 5,
    time : 0.02,
    T    : 5
};

let presentPoint = new THREE.Vector3(pmParams.pos, 0, 2);
let nextPoint    = new THREE.Vector3(pmParams.pos, 0, 2);

const pmClock = new THREE.Clock();

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */

init();

function init() {

    /* ── WebGL renderer ── */
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled   = true;
    renderer.shadowMap.type      = THREE.VSMShadowMap;
    document.body.appendChild(renderer.domElement);

    /* ── Camera  –  FOV 45 matches periodic motion scene ── */
    camera = new THREE.PerspectiveCamera(
        45, window.innerWidth / window.innerHeight, 0.1, 50000
    );

    /* ── Scene ── */
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    /* ── Controls ── */
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled       = false;
    controls.enablePan     = true;
    controls.enableZoom    = true;
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance   = 0.1;
    controls.maxDistance   = 5000;

    createLights();
    createFerrariShowroom();
    createPeriodicMotionScene();

    animate();

    window.addEventListener('resize', onResize);
}

/* ════════════════════════════════════════
   LIGHTS  (unchanged)
════════════════════════════════════════ */

function createLights() {
    scene.add(new THREE.AmbientLight(0xffffff, 2));
    const dir = new THREE.DirectionalLight(0xffffff, 4);
    dir.position.set(5, 10, 7);
    scene.add(dir);
}

/* ════════════════════════════════════════
   FERRARI SHOWROOM  (unchanged)
════════════════════════════════════════ */

function createFerrariShowroom() {

    scene.add(ferrariGroup);

    grid = new THREE.GridHelper(20, 40, 0xffffff, 0xffffff);
    grid.material.opacity     = 0.15;
    grid.material.transparent = true;
    ferrariGroup.add(grid);

    new RGBELoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
            'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
            function (texture) {
                const pmrem = new THREE.PMREMGenerator(renderer);
                const env   = pmrem.fromEquirectangular(texture).texture;
                scene.environment = env;
                texture.dispose();
                pmrem.dispose();
            }
        );

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.load(
        'https://threejs.org/examples/models/gltf/ferrari.glb',
        function (gltf) {
            car = gltf.scene.children[0];

            car.getObjectByName('body').material =
                new THREE.MeshPhysicalMaterial({
                    color: 0xff0000, metalness: 1,
                    roughness: 0.35, clearcoat: 1
                });

            wheels.push(
                car.getObjectByName('wheel_fl'),
                car.getObjectByName('wheel_fr'),
                car.getObjectByName('wheel_rl'),
                car.getObjectByName('wheel_rr')
            );

            ferrariGroup.add(car);
            startFerrariSequence();
        }
    );
}

/* ════════════════════════════════════════
   CAMERA HELPERS  (unchanged)
════════════════════════════════════════ */

function moveCamera(x, y, z, tx, ty, tz, duration) {
    return new TWEEN.Tween(camera.position)
        .to({ x, y, z }, duration)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onStart(() => {
            new TWEEN.Tween(lookTarget)
                .to({ x: tx, y: ty, z: tz }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        });
}

function bounceCar() {
    return new TWEEN.Tween(car.position)
        .to({ y: 0.15 }, 400)
        .yoyo(true).repeat(1)
        .easing(TWEEN.Easing.Quadratic.Out);
}

/* ════════════════════════════════════════
   FERRARI CINEMATIC  (unchanged)
════════════════════════════════════════ */

function startFerrariSequence() {

    camera.position.set(0, 25, -80);

    const fly = moveCamera(0, 8, -18, 0, 0.5, 0, 2500)
        .onStart(() => { motionBlurStrength = 0.25; });

    const approach = moveCamera(0, 3, -8, 0, 0.5, 0, 2500)
        .onComplete(() => { motionBlurStrength = 0.05; });

    const orbitObj = { angle: 0 };
    const orbit = new TWEEN.Tween(orbitObj)
        .to({ angle: Math.PI * 2 }, 8000)
        .easing(TWEEN.Easing.Sinusoidal.InOut)
        .onUpdate(() => {
            camera.position.x = Math.cos(orbitObj.angle) * 8;
            camera.position.z = Math.sin(orbitObj.angle) * 8;
            camera.position.y = 2.5 + Math.sin(orbitObj.angle * 2) * 0.5;
        });

    const frontInspect = moveCamera( 2,  1.5,  4, 0, 0.5, 0, 2200);
    const sideInspect  = moveCamera(-4,  1.2,  0, 0, 0.5, 0, 2200);
    const rearInspect  = moveCamera( 0,  2,   -5, 0, 0.5, 0, 2200);
    const bounce       = bounceCar();

    const rise = moveCamera(0, 12, -14, 0, 0, 0, 3000)
        .onStart(() => { motionBlurStrength = 0.12; });

    /* ── Transition to Periodic Motion lab ── */
    const transition = moveCamera(0, 32, 37, 0, 2, 0, 5000)
        .onStart(() => { motionBlurStrength = 0.4; })
        .onComplete(() => {

            ferrariGroup.visible        = false;
            periodicMotionGroup.visible = true;

            /* match periodic motion scene background + fog */
            scene.background = new THREE.Color('skyblue');
            scene.fog        = new THREE.Fog(0x222244, 50, 100);

            document.getElementById('introTitle').style.display = 'none';
            document.getElementById('labUI').style.display      = 'block';

            /* camera & controls tuned to periodic motion scene */
            camera.position.set(0, 32, 37);
            controls.enabled = true;
            controls.target.set(0, 2, 0);
            controls.update();

            motionBlurStrength = 0;
            introFinished      = true;

            /* kick off the SHM trace animation */
            periodicProjection();
            setupLabUI();
        });

    fly.chain(approach);
    approach.chain(orbit);
    orbit.chain(frontInspect);
    frontInspect.chain(sideInspect);
    sideInspect.chain(rearInspect);
    rearInspect.chain(bounce);
    bounce.chain(rise);
    rise.chain(transition);

    fly.start();
}

/* ════════════════════════════════════════
   PERIODIC MOTION SCENE
════════════════════════════════════════ */

function createPeriodicMotionScene() {

    periodicMotionGroup.visible = false;
    scene.add(periodicMotionGroup);

    /* ── Scene-specific lights ── */
    const ambientPM = new THREE.AmbientLight(0xffffff, 0.6);
    periodicMotionGroup.add(ambientPM);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(0, 25, 0);
    dirLight.castShadow                  = true;
    dirLight.shadow.camera.near          = 0.1;
    dirLight.shadow.camera.far           = 500;
    dirLight.shadow.camera.right         =  17;
    dirLight.shadow.camera.left          = -17;
    dirLight.shadow.camera.top           =  17;
    dirLight.shadow.camera.bottom        = -17;
    dirLight.shadow.mapSize.width        = 512;
    dirLight.shadow.mapSize.height       = 512;
    dirLight.shadow.radius               = 3;
    dirLight.shadow.bias                 = -0.0005;
    dirGroup = new THREE.Group();
    dirGroup.add(dirLight);
    periodicMotionGroup.add(dirGroup);

    /* ── Spinning disk (ring) ── */
    const cylinderGeo = new THREE.CylinderGeometry(10, 10, 0.5, 32).translate(0, -0.5, 0);
    const diskMat     = new THREE.MeshPhongMaterial({
        color    : 0x0000f3,
        shininess: 0,
        specular : 0x00ee22
    });
    ring = new THREE.Mesh(cylinderGeo, diskMat);
    ring.rotation.set(1.57, 0, 0);
    ring.position.set(0, 10, 0);
    ring.castShadow    = true;
    ring.receiveShadow = true;
    periodicMotionGroup.add(ring);

    /* ── Red sphere on the disk rim ── */
    const sphereGeo = new THREE.SphereGeometry(0.5, 16, 24);
    const sphereMat = new THREE.MeshPhongMaterial({
        color    : 0xff0000,
        shininess: 0,
        specular : 0x222222
    });
    sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.position.x  = pmParams.pos;
    sphere.castShadow    = true;
    sphere.receiveShadow = true;
    ring.add(sphere);

    /* ── Central pivot marker ── */
    const pivotGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.5, 3);
    const pivot    = new THREE.Mesh(pivotGeo, sphereMat);
    pivot.rotation.set(1.57, 0, 0);
    pivot.position.y   = 10;
    pivot.castShadow    = true;
    pivot.receiveShadow = true;
    periodicMotionGroup.add(pivot);

    /* ── Ground plane ── */
    const planeGeo = new THREE.PlaneGeometry(50, 50).translate(0, 0, -2);
    const planeMat = new THREE.MeshPhongMaterial({
        color    : 'grey',
        shininess: 0,
        specular : 0x111111
    });
    const ground = new THREE.Mesh(planeGeo, planeMat);
    ground.rotation.x    = -Math.PI / 2;
    ground.castShadow    = true;
    ground.receiveShadow = true;
    periodicMotionGroup.add(ground);

    /* pmGroup (sine-trace lines) lives in the scene directly so it is
       always reachable for add/remove even before the group is visible */
    scene.add(pmGroup);
}

/* ════════════════════════════════════════
   PERIODIC PROJECTION  (SHM trace loop)
════════════════════════════════════════ */

function periodicProjection() {

    ring.rotation.y += pmParams.freq * pmParams.time;

    if (t < 18) {
        nextPoint = new THREE.Vector3(
            pmParams.pos * Math.cos(ring.rotation.y),
            0,
            t + 2
        );

        line = initLine({
            points      : [presentPoint, nextPoint],
            lineMaterial: new THREE.LineBasicMaterial({ color: 'rgb(100%,0%,0%)' }),
            yRotation   : 0,
            x: 0, y: 0, z: 0
        });

        presentPoint = nextPoint;
        pmGroup.add(line);
    }

    t += pmParams.time;
    requestID = requestAnimationFrame(periodicProjection);
}

/* ════════════════════════════════════════
   initLine helper
════════════════════════════════════════ */

function initLine(data) {
    const geo  = new THREE.BufferGeometry().setFromPoints(data.points);
    const mesh = new THREE.Line(geo, data.lineMaterial);
    mesh.rotation.y  = data.yRotation;
    mesh.position.set(data.x, data.y, data.z);
    return mesh;
}

/* ════════════════════════════════════════
   RESET helper
════════════════════════════════════════ */

function pmReset() {
    t            = 0;
    presentPoint = new THREE.Vector3(pmParams.pos, 0, 2);
    nextPoint    = new THREE.Vector3(pmParams.pos, 0, 0);
    scene.remove(pmGroup);
    line    = new THREE.Group();
    pmGroup = new THREE.Group();
    pmParams.time = 0.02;
    scene.add(pmGroup);
}

/* ════════════════════════════════════════
   LAB UI
════════════════════════════════════════ */

function setupLabUI() {

    const stopBtn   = document.getElementById('stop');
    const resetBtn  = document.getElementById('reset');
    const timeSel   = document.getElementById('time');
    const posSel    = document.getElementById('pos');
    const timeDisp  = document.getElementById('timeDisplay');
    const freqDisp  = document.getElementById('freqDisplay');
    const posDisp   = document.getElementById('posDisplay');

    /* seed displays */
    timeDisp.textContent = pmParams.T;
    freqDisp.textContent = pmParams.freq;
    posDisp.textContent  = pmParams.pos;

    /* STOP / START */
    stopBtn.addEventListener('click', () => {
        pmStop = !pmStop;
        if (!pmStop) {
            periodicProjection();
            stopBtn.textContent = 'STOP';
        } else {
            cancelAnimationFrame(requestID);
            stopBtn.textContent = 'START';
        }
    });

    /* RESET */
    resetBtn.addEventListener('click', () => {
        cancelAnimationFrame(requestID);
        pmStop = false;
        stopBtn.textContent = 'STOP';
        pmReset();
        periodicProjection();
    });

    /* Time period slider */
    timeSel.addEventListener('change', () => {
        t            = 0;
        presentPoint = new THREE.Vector3(pmParams.pos, 0, 2);
        nextPoint    = new THREE.Vector3(pmParams.pos, 0, 0);
        scene.remove(pmGroup);
        line    = new THREE.Group();
        pmGroup = new THREE.Group();
        pmParams.T    = timeSel.valueAsNumber;
        pmParams.freq = parseFloat((6.28 * (1 / pmParams.T)).toFixed(2));
        timeDisp.textContent = pmParams.T;
        freqDisp.textContent = pmParams.freq;
        scene.add(pmGroup);
    });

    /* Position slider */
    posSel.addEventListener('change', () => {
        t            = 0;
        ring.rotation.y = 0;
        presentPoint = new THREE.Vector3(pmParams.pos, 0, 2);
        nextPoint    = new THREE.Vector3(pmParams.pos, 0, 0);
        scene.remove(pmGroup);
        line    = new THREE.Group();
        pmGroup = new THREE.Group();
        pmParams.pos  = posSel.valueAsNumber;
        posDisp.textContent  = pmParams.pos;
        sphere.position.x    = pmParams.pos;
        scene.add(pmGroup);
    });

    /* Navigation buttons */
    document.getElementById('pendulum-el').addEventListener('click', () =>
        window.open('Mechanics_Simple_Pendulum.html', '_self'));
    document.getElementById('spring-el').addEventListener('click', () =>
        window.open('Mechanics_Spring_Force.html', '_self'));
    document.getElementById('theory-el').addEventListener('click', () =>
        window.open('Mechanics_Periodic_Motion.html', '_self'));
}

/* ════════════════════════════════════════
   RESIZE  (unchanged)
════════════════════════════════════════ */

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ════════════════════════════════════════
   ANIMATE
════════════════════════════════════════ */

function animate() {

    requestAnimationFrame(animate);

    TWEEN.update();

    if (!introFinished) {

        smoothLook.lerp(lookTarget, 0.05);
        camera.lookAt(smoothLook);

        const time = -performance.now() / 1000;
        grid.position.z = -(time) % 1;

        for (let i = 0; i < wheels.length; i++) {
            wheels[i].rotation.x = time * Math.PI * 2;
        }
    }

    controls.update();

    currentExposure += ((1.1 - motionBlurStrength) - currentExposure) * 0.03;
    renderer.toneMappingExposure = currentExposure;

    renderer.render(scene, camera);
}

</script>
</body>
</html>
