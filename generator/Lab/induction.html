<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Ferrari Intro → Electromagnetic Induction</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#111; overflow:hidden; font-family:'Segoe UI',sans-serif; }
        canvas { display:block; }

        /* ── intro overlay ── */
        #introTitle {
            position:fixed; bottom:48px; left:50%;
            transform:translateX(-50%);
            color:#fff; font-size:13px; letter-spacing:.25em;
            text-transform:uppercase; opacity:.55;
            pointer-events:none; z-index:10;
        }

        /* ── lab UI hidden until transition ── */
        #labUI { display:none; }

        /* top bar */
        #topmenu {
            position:fixed; top:0; left:0; right:0; height:38px;
            background:rgba(3,30,50,.95);
            color:#e8e8e8; font-size:13px; letter-spacing:.14em;
            text-transform:uppercase;
            display:flex; align-items:center; padding:0 18px;
            z-index:100;
            border-bottom:1px solid rgba(255,255,255,.08);
        }

        /* left rule viewer panel */
        #sidemenu {
            position:fixed; top:38px; left:0; width:290px;
            background:rgba(3,30,50,.88);
            color:#d4d4d4; font-size:12px;
            padding:16px 14px; z-index:100;
            border-right:1px solid rgba(255,255,255,.07);
            line-height:1.8;
        }

        #ruleviewer { width:270px; }
        #message-el { color:rgb(2,59,66); font-weight:bold; font-size:12px; }

        #fRule {
            font-weight:bold; font-size:12px;
            margin-top:8px; line-height:1.7;
        }
        #fRule a { font-weight:bolder; }

        /* bottom bar */
        #menu {
            position:fixed; bottom:0; left:0; right:0;
            background:rgba(3,30,50,.95);
            color:#d4d4d4; font-size:12.5px;
            padding:9px 18px;
            display:flex; align-items:center;
            flex-wrap:wrap; gap:8px;
            z-index:100;
            border-top:1px solid rgba(255,255,255,.08);
        }

        #element-el {
            flex:1 1 100%; font-size:11.5px;
            color:#aaa; margin-top:2px; font-weight:bold;
        }

        /* buttons */
        #menu button {
            padding:6px 14px; border:none; border-radius:4px;
            font-size:12px; font-weight:600; letter-spacing:.06em;
            cursor:pointer; color:#fff; transition:filter .15s;
            background:rgb(3,108,156);
        }
        #menu button:hover { filter:brightness(1.18); }
        #menu button:disabled { opacity:.4; cursor:default; }

        #magnet-el  { background:rgb(3,67,97); }
        #rule-el    { background:rgb(2,80,60); }
    </style>
</head>
<body>

<!-- ── intro overlay ── -->
<div id="introTitle">Ferrari SF90 Stradale &nbsp;&middot;&nbsp; Loading Lab&hellip;</div>

<!-- ── lab UI shown after transition ── -->

    <div id="sidemenu">

                    <a style="color:blue; font-weight:bolder;">F</a>ore Finger :- Magnetic <a style="color:blue; font-weight:bolder;">F</a>ield;<br>

</div><!-- /labUI -->


<script type="importmap">
{
    "imports": {
        "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "tween":         "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js"
    }
}
</script>

<script type="module">

import * as THREE        from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader }    from 'three/addons/loaders/RGBELoader.js';
import TWEEN             from 'tween';

/* ════════════════════════════════════════
   GLOBALS — SHARED
════════════════════════════════════════ */

let renderer, camera, scene, controls;

/* groups */
let ferrariGroup  = new THREE.Group();
let inductionGroup = new THREE.Group();

/* ferrari */
let car, grid;
const wheels     = [];
const lookTarget = new THREE.Vector3(0, 0.5, 0);
const smoothLook = new THREE.Vector3(0, 0.5, 0);

/* transition state */
let introFinished      = false;
let motionBlurStrength = 0;
let currentExposure    = 1.1;

/* ════════════════════════════════════════
   GLOBALS — INDUCTION SCENE
════════════════════════════════════════ */

let clock;
let scene1    = [];
let scene2    = [];
let generator = [];

let solenoidModel, barMagnet, galvNeedle, inducedSolenoid, galvanometer, mixer;
let powerSupply, knob, powerKnob, connector, arrow, solenoid, rightHand;
let coilModel, coilStand, coil, commutator, rings, insulator, magnetwire, currentwire;
let electromagnet, mixer1, arrow1, arrow2, direction1, direction2;
let line;

let presentPoint = new THREE.Vector3(0, 0, 0);
let nextPoint    = new THREE.Vector3(0, 0, -1.3);

const actions = {};
let requestID, requestCurrent, requestInduced, requestInducedSlow;

let fieldLines = new THREE.Group();
let lineGroup  = new THREE.Group();
let pointGroup = new THREE.Group();

let moveL     = false,
    stop      = false,
    relative  = false,
    mRotate   = false,
    element   = 0,
    magZ      = -5,
    ind_i     = 0,
    fov,
    galvRot   = 0,
    galvL     = 0.6,
    galvR     = -0.6,
    changeFlux = false,
    ruleClue  = false,
    flip      = false;

const speed = 0.003, magdz = 0.02, needleY = speed / magdz;
let a = 0;

const modelPath = './model/';
const elements = {
    '1': 'inducedcurrent.glb',
    '2': 'righthandrule.glb',
    '3': 'ForceonCoil.glb'
};

/* DOM refs — filled by setupLabUI */
let messageEl, elementEl, ruleviewer, flemingRule;
let buttonMagnetEl, buttonSolenoidEl, buttonCoilEl;
let buttonAction, buttonStop, buttonFlip, buttonRelative, buttonRule;

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */

init();

function init() {

    /* renderer */
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    /* camera — Ferrari intro FOV */
    camera = new THREE.PerspectiveCamera(
        40, window.innerWidth / window.innerHeight, 0.1, 50000
    );

    /* clock for animation mixers */
    clock = new THREE.Clock();

    /* scene */
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    /* orbit controls — disabled during intro */
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled       = false;
    controls.enablePan     = true;
    controls.enableZoom    = true;
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed   = 0.1;

    createLights();
    createFerrariShowroom();
    createInductionScene();

    animate();

    window.addEventListener('resize', onResize);
}

/* ════════════════════════════════════════
   LIGHTS
════════════════════════════════════════ */

function createLights() {

    const hemi = new THREE.AmbientLight(0xffffff, 0.3);
    hemi.position.set(0, 20, 0);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 1);
    dir.position.set(-30, 50, -30);
    dir.castShadow = true;
    scene.add(dir);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
}

/* ════════════════════════════════════════
   FERRARI SHOWROOM  (unchanged)
════════════════════════════════════════ */

function createFerrariShowroom() {

    scene.add(ferrariGroup);

    grid = new THREE.GridHelper(20, 40, 0xffffff, 0xffffff);
    grid.material.opacity     = 0.15;
    grid.material.transparent = true;
    ferrariGroup.add(grid);

    new RGBELoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
            'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
            function (texture) {
                const pmrem = new THREE.PMREMGenerator(renderer);
                const env   = pmrem.fromEquirectangular(texture).texture;
                scene.environment = env;
                texture.dispose();
                pmrem.dispose();
            }
        );

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.load(
        'https://threejs.org/examples/models/gltf/ferrari.glb',
        function (gltf) {
            car = gltf.scene.children[0];

            car.getObjectByName('body').material =
                new THREE.MeshPhysicalMaterial({
                    color: 0xff0000, metalness: 1,
                    roughness: 0.35, clearcoat: 1
                });

            wheels.push(
                car.getObjectByName('wheel_fl'),
                car.getObjectByName('wheel_fr'),
                car.getObjectByName('wheel_rl'),
                car.getObjectByName('wheel_rr')
            );

            ferrariGroup.add(car);
            startFerrariSequence();
        }
    );
}

/* ════════════════════════════════════════
   CAMERA HELPERS  (unchanged)
════════════════════════════════════════ */

function moveCamera(x, y, z, tx, ty, tz, duration) {
    return new TWEEN.Tween(camera.position)
        .to({ x, y, z }, duration)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onStart(() => {
            new TWEEN.Tween(lookTarget)
                .to({ x: tx, y: ty, z: tz }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        });
}

function bounceCar() {
    return new TWEEN.Tween(car.position)
        .to({ y: 0.15 }, 400)
        .yoyo(true).repeat(1)
        .easing(TWEEN.Easing.Quadratic.Out);
}

/* ════════════════════════════════════════
   FERRARI CINEMATIC  (unchanged except transition target)
════════════════════════════════════════ */

function startFerrariSequence() {

    camera.position.set(0, 25, -80);

    const fly = moveCamera(0, 8, -18, 0, 0.5, 0, 2500)
        .onStart(() => { motionBlurStrength = 0.25; });

    const approach = moveCamera(0, 3, -8, 0, 0.5, 0, 2500)
        .onComplete(() => { motionBlurStrength = 0.05; });

    const orbitObj = { angle: 0 };
    const orbit = new TWEEN.Tween(orbitObj)
        .to({ angle: Math.PI * 2 }, 8000)
        .easing(TWEEN.Easing.Sinusoidal.InOut)
        .onUpdate(() => {
            camera.position.x = Math.cos(orbitObj.angle) * 8;
            camera.position.z = Math.sin(orbitObj.angle) * 8;
            camera.position.y = 2.5 + Math.sin(orbitObj.angle * 2) * 0.5;
        });

    const frontInspect = moveCamera( 2,  1.5,  4, 0, 0.5, 0, 2200);
    const sideInspect  = moveCamera(-4,  1.2,  0, 0, 0.5, 0, 2200);
    const rearInspect  = moveCamera( 0,  2,   -5, 0, 0.5, 0, 2200);
    const bounce       = bounceCar();

    const rise = moveCamera(0, 12, -14, 0, 0, 0, 3000)
        .onStart(() => { motionBlurStrength = 0.12; });

    /* ── transition lands at induction lab camera ── */
    const transition = moveCamera(5, 5, 5, -1.2, 0, -2, 5000)
        .onStart(() => { motionBlurStrength = 0.4; })
        .onComplete(() => {

            ferrariGroup.visible   = false;
            inductionGroup.visible = true;

            /* match induction scene background */
            scene.background = new THREE.Color(0xbfd1e5);

            document.getElementById('introTitle').style.display = 'none';
            document.getElementById('labUI').style.display      = 'block';

            /* hand orbit controls to induction camera target */
            controls.enabled = true;
            controls.target.set(-1.2, 0, -2);
            controls.update();

            /* restore normal FOV for induction lab */
            camera.fov = 50;
            camera.updateProjectionMatrix();

            motionBlurStrength = 0;
            introFinished      = true;
        });

    fly.chain(approach);
    approach.chain(orbit);
    orbit.chain(frontInspect);
    frontInspect.chain(sideInspect);
    sideInspect.chain(rearInspect);
    rearInspect.chain(bounce);
    bounce.chain(rise);
    rise.chain(transition);

    fly.start();
}

/* ════════════════════════════════════════
   INDUCTION LAB
════════════════════════════════════════ */

function createInductionScene() {

    inductionGroup.visible = false;
    scene.add(inductionGroup);

    const grid2 = new THREE.GridHelper(10, 10);
    inductionGroup.add(grid2);

    scene.add(fieldLines);
    scene.add(lineGroup);
    scene.add(pointGroup);

    createModel();
    addLines();
    solenoidLines();
    setupLabUI();
}

/* ------------------------------------------------
   inducedCurrent
------------------------------------------------ */

function inducedCurrent() {

    const color = flip ? 'blue' : 'black';
    a += -0.1;
    visualClues();
    commutator.rotation.x += -0.1;

    const X = Math.sin(a);
    galvNeedle.rotation.y                      = X;
    arrow1.scale.z                             = X;
    arrow2.scale.x                             = X;
    currentwire.morphTargetInfluences[0]       = X > 0 ? 1 : 0;

    presentPoint = new THREE.Vector3(0.5 * X, 0, a * 0.1 - 1.3);
    pointGroup.add(initLine({
        points      : [presentPoint, nextPoint],
        lineMaterial: new THREE.LineBasicMaterial({ color }),
        yRotation:0, x:0, y:0, z:0
    }));
    scene.add(pointGroup);
    nextPoint = presentPoint;

    renderer.render(scene, camera);
    requestInduced = requestAnimationFrame(inducedCurrent);
}

/* ------------------------------------------------
   inducedCurrentSlow
------------------------------------------------ */

function inducedCurrentSlow() {

    const color = flip ? 'blue' : 'black';
    a += -0.01;
    commutator.rotation.x += -0.01;

    const X = Math.sin(a);
    galvNeedle.rotation.y                = X;
    arrow1.scale.z                       = X;
    arrow2.scale.x                       = X;
    currentwire.morphTargetInfluences[0] = X > 0 ? 1 : 0;
    visualClues();

    presentPoint = new THREE.Vector3(0.5 * X, 0, a * 0.1 - 1.3);
    pointGroup.add(initLine({
        points      : [presentPoint, nextPoint],
        lineMaterial: new THREE.LineBasicMaterial({ color }),
        yRotation:0, x:0, y:0, z:0
    }));
    scene.add(pointGroup);
    nextPoint = presentPoint;

    renderer.render(scene, camera);
    requestInducedSlow = requestAnimationFrame(inducedCurrentSlow);
}

/* ------------------------------------------------
   supplyCurrent
------------------------------------------------ */

function supplyCurrent() {

    arrow.visible = true;
    actions['needleL'].setDuration(6).play();
    arrow.morphTargetInfluences[0] = 0;
    arrow.morphTargetInfluences[1] = 0;
    arrow.morphTargetInfluences[2] = 1;
    arrow.morphTargetInfluences[3] = 0;
    changeFlux = true;

    const dir = flip ? -galvL : galvL;
    const rot = flip ? [0, 1.57, -1.57] : [0, 1.57, 1.57];

    new TWEEN.Tween(galvNeedle.rotation)
        .to({ y: dir }, 5000)
        .easing(TWEEN.Easing.Bounce.InOut)
        .start();

    fieldLines.visible = true;
    fieldLines.rotation.set(...rot);

    new TWEEN.Tween(fieldLines.scale)
        .to({ x: 1.2, y: 1.5, z: 1 }, 2000)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

    setTimeout(() => {
        changeFlux = false;
        galvRotStop();
        new TWEEN.Tween(galvNeedle.rotation)
            .to({ y: 0 }, 5000)
            .easing(TWEEN.Easing.Bounce.InOut)
            .start();
        new TWEEN.Tween(fieldLines.scale)
            .to({ x: 0, y: 0, z: 1 }, 3000)
            .easing(TWEEN.Easing.Cubic.Out)
            .start();
    }, 5000);

    animate();
}

/* ------------------------------------------------
   steadyCurrent
------------------------------------------------ */

function steadyCurrent() {

    arrow.visible = true;
    arrow.morphTargetInfluences[0] = 0;
    arrow.morphTargetInfluences[1] = 0;
    arrow.morphTargetInfluences[2] = 1;
    arrow.morphTargetInfluences[3] = 0;

    knob.rotation.set(1.57, 0, 0);
    new TWEEN.Tween(knob.rotation)
        .to({ y: -2 }, 3000)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

    const dir = flip ? -galvL : galvL;
    const rot = flip ? [0, 1.57, -1.57] : [0, 1.57, 1.57];

    new TWEEN.Tween(galvNeedle.rotation)
        .to({ y: dir }, 3000)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

    fieldLines.visible = true;
    fieldLines.rotation.set(...rot);

    new TWEEN.Tween(fieldLines.scale)
        .to({ x: 1.2, y: 1.5, z: 1 }, 3000)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

    setTimeout(() => {
        new TWEEN.Tween(galvNeedle.rotation)
            .to({ y: 0 }, 1500)
            .easing(TWEEN.Easing.Cubic.In)
            .start();
    }, 5000);

    animate();
}

/* ------------------------------------------------
   magmodelLoad
------------------------------------------------ */

function magmodelLoad() {

    relative  = false;
    stop      = false;
    changeFlux = false;
    flip      = false;

    cancelAnimationFrame(requestInduced);
    cancelAnimationFrame(requestInducedSlow);
    cancelAnimationFrame(requestID);

    scene.remove(pointGroup);
    pointGroup   = new THREE.Group();
    presentPoint = new THREE.Vector3(0, 0, 0);
    nextPoint    = new THREE.Vector3(0, 0, -1.3);
    presentPoint = nextPoint;
    a = 0;

    buttonAction.disabled   = false; buttonAction.style.cursor   = 'pointer';
    buttonFlip.disabled     = false; buttonFlip.style.cursor     = 'pointer';
    buttonStop.disabled     = false; buttonStop.style.cursor     = 'pointer';
    buttonRelative.disabled = false; buttonRelative.style.cursor = 'pointer';

    if (element === 0) {

        cancelAnimationFrame(requestInduced);
        cancelAnimationFrame(requestInducedSlow);
        inducedSolenoid.visible          = true;
        galvNeedle.rotation.y            = 0;
        barMagnet.visible                = true;
        rightHand.visible                = false;
        lineGroup.visible                = false;
        fieldLines.visible               = false;
        galvanometer.morphTargetInfluences[0] = 0;
        scene1.forEach(o => o.visible = true);
        scene2.forEach(o => o.visible = false);
        generator.forEach(o => o.visible = false);

    } else if (element === 1) {

        cancelAnimationFrame(requestInduced);
        cancelAnimationFrame(requestInducedSlow);
        inducedSolenoid.visible          = true;
        rightHand.visible                = false;
        galvNeedle.rotation.y            = 0;
        galvanometer.morphTargetInfluences[0] = 0;
        barMagnet.visible                = false;
        scene1.forEach(o => o.visible = true);
        scene2.forEach(o => o.visible = true);
        generator.forEach(o => o.visible = false);

    } else if (element === 2) {

        cancelAnimationFrame(requestInduced);
        cancelAnimationFrame(requestInducedSlow);
        barMagnet.visible                = false;
        lineGroup.visible                = false;
        fieldLines.visible               = false;
        inducedSolenoid.visible          = false;
        rightHand.visible                = true;
        scene1.forEach(o => o.visible = true);
        scene2.forEach(o => o.visible = false);
        generator.forEach(o => o.visible = true);

        currentwire.morphTargetInfluences[1] = 1;
        coilStand.morphTargetInfluences[0]   = 1;
        commutator.morphTargetInfluences[0]  = 1;
        rings.morphTargetInfluences[0]       = 0;
        coil.morphTargetInfluences[0]        = 1;
        galvanometer.morphTargetInfluences[0]= 1;
        insulator.morphTargetInfluences[0]   = 1;
        magnetwire.scale.set(1, 1, 1);
        stop = false;
        visualClues();
        inducedCurrent();
    }

    renderer.render(scene, camera);
}

/* ------------------------------------------------
   helper: visualClues
------------------------------------------------ */

function visualClues() {
    const v = !stop;
    arrow1.visible       = v;
    arrow2.visible       = v;
    direction1.visible   = v;
    direction2.visible   = v;
    currentwire.visible  = v;
    rightHand.visible    = v;
}

/* ------------------------------------------------
   helper: initLine
------------------------------------------------ */

function initLine(data) {
    const geo = new THREE.BufferGeometry().setFromPoints(data.points);
    const l   = new THREE.Line(geo, data.lineMaterial);
    l.rotation.y = data.yRotation;
    l.position.set(data.x, data.y, data.z);
    return l;
}

/* ------------------------------------------------
   helper: polarity
------------------------------------------------ */

function polarity() {
    if (!flip) {
        actions['polarity'].fadeOut();
        actions['needleL'].fadeOut();
        actions['needleL'].reset().stop();
        actions['polarity1'].setDuration(0.5).play();
        flip = true;
    } else {
        actions['polarity1'].fadeOut();
        actions['needleL'].fadeOut();
        actions['needleL'].reset().stop();
        actions['polarity'].setDuration(0.5).play();
        flip = false;
    }
    animate();
}

/* ------------------------------------------------
   helper: galvRotStop
------------------------------------------------ */

function galvRotStop() {
    if (!changeFlux) {
        arrow.morphTargetInfluences[0] = 1;
        arrow.morphTargetInfluences[1] = 0;
        arrow.morphTargetInfluences[2] = 0;
        arrow.morphTargetInfluences[3] = 0;
        actions['needleL'].reset().stop();
        buttonAction.disabled   = false; buttonAction.style.cursor   = 'pointer';
        buttonFlip.disabled     = false; buttonFlip.style.cursor     = 'pointer';
        buttonStop.disabled     = false; buttonStop.style.cursor     = 'pointer';
    }
}

/* ------------------------------------------------
   helper: relativeMove
------------------------------------------------ */

function relativeMove() {
    if (magZ >= -5 && magZ <= -2) {
        requestID = requestAnimationFrame(relativeMove);
        inducedSolenoid.position.z += magdz;
        galvanometer.position.z    += magdz;
        galvNeedle.position.z      += magdz;
        barMagnet.position.z       += magdz;
        magZ += magdz;
        renderer.render(scene, camera);
    } else if (inducedSolenoid.position.z > 0) {
        requestID = requestAnimationFrame(relativeMove);
        inducedSolenoid.position.z += -magdz;
        galvanometer.position.z    += -magdz;
        galvNeedle.position.z      += -magdz;
        barMagnet.position.z       += -magdz;
        renderer.render(scene, camera);
    }
}

/* ------------------------------------------------
   helper: magnetMove
------------------------------------------------ */

function magnetMove() {

    if (magZ >= -5 && magZ <= 0 && moveL && !mRotate && !stop) {
        buttonAction.innerHTML = '&#x2190;';
        requestID = requestAnimationFrame(magnetMove);
        ind_i++;
        barMagnet.position.z += magdz;
        magZ += magdz;
        galvNeedle.rotation.set(0, needleY + speed * ind_i, 0);

    } else if (magZ >= -5 && magZ <= 0 && moveL && mRotate && !stop) {
        buttonAction.innerHTML = '&#x2190;';
        requestID = requestAnimationFrame(magnetMove);
        ind_i++;
        barMagnet.position.z += magdz;
        magZ += magdz;
        galvNeedle.rotation.set(0, -(needleY + speed * ind_i), 0);

    } else if (magZ > 0 && moveL && !stop) {
        requestID = requestAnimationFrame(magnetMove);
        magZ  += -magdz;
        moveL  = false;
        buttonAction.innerHTML = '&#x2192;';

    } else if (magZ >= -5 && magZ <= 0 && !moveL && !mRotate && !stop) {
        buttonAction.innerHTML = '&#x2192;';
        requestID = requestAnimationFrame(magnetMove);
        ind_i--;
        barMagnet.position.z += -magdz;
        magZ += -magdz;
        galvNeedle.rotation.set(0, needleY + speed * ind_i, 0);

    } else if (magZ >= -5 && magZ <= 0 && !moveL && mRotate && !stop) {
        buttonAction.innerHTML = '&#x2192;';
        requestID = requestAnimationFrame(magnetMove);
        ind_i--;
        barMagnet.position.z += -magdz;
        magZ += -magdz;
        galvNeedle.rotation.set(0, -(needleY + speed * ind_i), 0);

    } else if (magZ < -5 && !moveL && !stop) {
        cancelAnimationFrame(requestID);
        buttonAction.innerHTML          = 'MOVE';
        buttonAction.style.backgroundColor = 'rgb(3,108,156)';
        buttonAction.disabled           = false; buttonAction.style.cursor   = 'pointer';
        buttonFlip.disabled             = false; buttonFlip.style.cursor     = 'pointer';
        barMagnet.position.set(-0.5, 1.3, -4);
        galvNeedle.rotation.set(0, 0, 0);
        ind_i = 0;
    }

    renderer.render(scene, camera);
}

/* ------------------------------------------------
   helper: magnetRotate
------------------------------------------------ */

function magnetRotate() {
    if (!mRotate) {
        barMagnet.rotation.y = -3.14;
        mRotate = true;
    } else {
        barMagnet.rotation.set(0, 0, 0);
        mRotate = false;
    }
    magZ += magdz;
    renderer.render(scene, camera);
}

/* ------------------------------------------------
   helper: magnetPolarity
------------------------------------------------ */

function magnetPolarity() {
    if (!flip) {
        electromagnet.rotation.set(1.57, 0, 0);
        flip = true;
        rightHand.rotation.set(-1.57, 1.57, 3.14);
        direction1.morphTargetInfluences[0] = 1;
        direction2.morphTargetInfluences[0] = 0;
        direction1.morphTargetInfluences[1] = 1;
        direction2.morphTargetInfluences[1] = 1;
        rightHand.position.set(-1.5, 1.2, -0.5);
    } else {
        electromagnet.rotation.set(4.71, 0, 0);
        flip = false;
        rightHand.rotation.set(0, 1.57, -1.57);
        direction1.morphTargetInfluences[0] = 0;
        direction2.morphTargetInfluences[0] = 1;
        direction1.morphTargetInfluences[1] = 0;
        direction2.morphTargetInfluences[1] = 0;
        rightHand.position.set(-1.2, 0.8, 0.5);
    }
    animate();
}

/* ------------------------------------------------
   helper: resetSolenoid
------------------------------------------------ */

function resetSolenoid() {
    arrow.visible = false;
    actions['needleL'].reset().stop();
    knob.rotation.set(1.57, 0, 0);
    fieldLines.scale.set(0, 0, 1);
    changeFlux = false;
    stop       = false;
    buttonAction.disabled = false; buttonAction.style.cursor = 'pointer';
    buttonFlip.disabled   = false; buttonFlip.style.cursor   = 'pointer';
    buttonStop.disabled   = false; buttonStop.style.cursor   = 'pointer';
    renderer.render(scene, camera);
}

/* ------------------------------------------------
   helper: setCamera  (called after scene switch)
------------------------------------------------ */

function setCamera() {
    const configs = [
        { fov:50, pos:[5,5,5],   target:[-1.2, 0,  -2] },
        { fov:50, pos:[5,5.5,5], target:[0.2,  0.5,-2] },
        { fov:35, pos:[5,5,5],   target:[0,    0,   0] }
    ];
    const c = configs[element];
    camera.fov = c.fov;
    camera.updateProjectionMatrix();
    camera.position.set(...c.pos);
    controls.target.set(...c.target);
    controls.update();
    renderer.render(scene, camera);
}

/* ------------------------------------------------
   createModel
------------------------------------------------ */

function createModel() {

    const loader = new GLTFLoader();
    loader.setPath(modelPath);

    /* main solenoid model */
    loader.load(elements['1'], function (gltf) {

        solenoidModel = gltf.scene;
        scene.add(solenoidModel);

        mixer       = new THREE.AnimationMixer(solenoidModel);
        powerKnob   = solenoidModel.children[0];
        powerSupply = solenoidModel.getObjectByName('Supply');
        knob        = solenoidModel.getObjectByName('knob');
        arrow       = solenoidModel.getObjectByName('arrow');
        solenoid    = solenoidModel.getObjectByName('solenoid');
        connector   = solenoidModel.getObjectByName('connector');
        barMagnet   = solenoidModel.getObjectByName('barMagnet');
        galvNeedle  = solenoidModel.getObjectByName('galvNeedle');
        galvanometer      = solenoidModel.getObjectByName('Galvanometer');
        inducedSolenoid   = solenoidModel.getObjectByName('induceSolenoid');

        inducedSolenoid.position.z = 0;
        barMagnet.add(lineGroup);
        solenoid.add(fieldLines);

        scene1.push(galvNeedle, galvanometer);
        scene2.push(connector, solenoid, fieldLines, arrow, powerKnob, powerSupply);

        scene1.forEach(o => o.visible = true);
        scene2.forEach(o => o.visible = false);
        generator.forEach(o => o.visible = false);

        lineGroup.visible  = false;
        fieldLines.visible = false;

        for (const clip of gltf.animations) {
            const action = mixer.clipAction(clip);
            actions[clip.name]       = action;
            action.clampWhenFinished = true;
            action.loop              = THREE.LoopOnce;
        }

        renderer.render(scene, camera);
    });

    /* right-hand gesture */
    loader.load(elements['2'], function (gltf) {
        rightHand = gltf.scene;
        scene.add(rightHand);
        rightHand.visible = false;
    });

    /* armature coil */
    loader.load(elements['3'], function (gltf) {

        coilModel   = gltf.scene;
        scene.add(coilModel);

        mixer1       = new THREE.AnimationMixer(coilModel);
        electromagnet= gltf.scene.getObjectByName('Magnet');
        arrow1       = gltf.scene.getObjectByName('arrow1');
        arrow2       = gltf.scene.getObjectByName('arrow2');
        direction1   = gltf.scene.getObjectByName('direction1');
        direction2   = gltf.scene.getObjectByName('direction2');
        magnetwire   = gltf.scene.getObjectByName('MagnetWire');
        currentwire  = gltf.scene.getObjectByName('currentwire');
        coilStand    = gltf.scene.getObjectByName('coil');
        coil         = gltf.scene.getObjectByName('CoilStand');
        commutator   = gltf.scene.getObjectByName('Commutator');
        rings        = gltf.scene.getObjectByName('Rings');
        insulator    = gltf.scene.getObjectByName('Insulator');

        coilModel.children.forEach(c => generator.push(c));
        generator.forEach(o => o.visible = false);

        direction1.morphTargetInfluences[0] = 0;
        direction2.morphTargetInfluences[0] = 1;
        direction1.morphTargetInfluences[1] = 0;
        direction2.morphTargetInfluences[1] = 0;

        const fixedStates = ['direction1','direction2'];

        for (const clip of gltf.animations) {
            const action = mixer1.clipAction(clip);
            actions[clip.name] = action;
            if (fixedStates.includes(clip.name)) {
                action.clampWhenFinished = true;
                action.loop = THREE.LoopOnce;
            }
        }
    });
}

/* ------------------------------------------------
   ruleClues
------------------------------------------------ */

function ruleClues() {
    if (ruleClue && element === 0) {
        lineGroup.visible         = true;
        ruleviewer.style.visibility = 'visible';
        flemingRule.style.visibility = 'hidden';
        messageEl.innerHTML = 'Change in Magnetic flux linked with the solenoid, induces a current in it';
    } else if (ruleClue && element === 1) {
        ruleviewer.style.visibility  = 'visible';
        flemingRule.style.visibility = 'hidden';
        messageEl.innerHTML = 'Induced current opposes the change, of the magnetic flux, that induces it';
    } else if (ruleClue && element === 2) {
        ruleviewer.style.visibility  = 'visible';
        flemingRule.style.visibility = 'visible';
        messageEl.innerHTML = "FLEMING'S RIGHT HAND RULE:";
    } else {
        ruleviewer.style.visibility  = 'hidden';
        flemingRule.style.visibility = 'hidden';
        lineGroup.visible  = false;
        fieldLines.visible = false;
    }
    renderer.render(scene, camera);
}

/* ------------------------------------------------
   field line helpers
------------------------------------------------ */

function barField() {
    const geo     = new THREE.PlaneGeometry(2.5, 1);
    const texture = new THREE.TextureLoader().load('./assets/img/barfieldLines.png');
    const mesh    = new THREE.Mesh(
        geo,
        new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, map: texture, transparent: true })
    );
    mesh.scale.set(2, 2, 2);
    return mesh;
}

function addLine(a, b, c) {
    const l = barField();
    l.rotation.set(a, b, c);
    return l;
}

function addLines() {
    scene.add(lineGroup);
    lineGroup.add(addLine(1.57, 0.57,  1.57));
    lineGroup.add(addLine(1.57, 1.57,  1.57));
    lineGroup.add(addLine(1.57, 2.57,  1.57));
}

function solenoidLines() {
    scene.add(fieldLines);
    fieldLines.scale.set(0, 0, 1);
    fieldLines.add(barField());
}

/* ------------------------------------------------
   setupLabUI
------------------------------------------------ */

function setupLabUI() {

    messageEl      = document.getElementById('message-el');
    elementEl      = document.getElementById('element-el');
    ruleviewer     = document.getElementById('ruleviewer');
    flemingRule    = document.getElementById('fRule');
    buttonMagnetEl = document.getElementById('magnet-el');
    buttonSolenoidEl = document.getElementById('solenoid-el');
    buttonCoilEl   = document.getElementById('coil-el');
    buttonAction   = document.getElementById('action-el');
    buttonStop     = document.getElementById('stop-el');
    buttonFlip     = document.getElementById('flip-el');
    buttonRelative = document.getElementById('relative-el');
    buttonRule     = document.getElementById('rule-el');

    /* SOLENOID + MAGNET */
    buttonMagnetEl.addEventListener('click', () => {
        buttonCoilEl.style.backgroundColor    = 'rgb(3,108,156)';
        buttonSolenoidEl.style.backgroundColor = 'rgb(3,108,156)';
        buttonMagnetEl.style.backgroundColor  = 'rgb(3,67,97)';
        elementEl.textContent = 'Effect of change in magnetic field (flux) in a solenoid coil - Using a bar magnet';
        buttonAction.innerHTML   = 'MOVE';
        buttonStop.innerHTML     = 'STOP';
        buttonRelative.innerHTML = 'RELATIVE';
        buttonRule.innerHTML     = "FARADAY'S LAW OF INDUCTION";
        element = 0;
        ruleClues();
        magmodelLoad();
        setCamera();
    });

    /* SOLENOID + SOLENOID */
    buttonSolenoidEl.addEventListener('click', () => {
        buttonCoilEl.style.backgroundColor    = 'rgb(3,108,156)';
        buttonMagnetEl.style.backgroundColor  = 'rgb(3,108,156)';
        buttonSolenoidEl.style.backgroundColor = 'rgb(3,67,97)';
        elementEl.textContent = 'Effect of change in magnetic field (flux) in a solenoid coil - Using an electromagnet';
        buttonAction.innerHTML   = 'VARY CURRENT';
        buttonStop.innerHTML     = 'STEADY CURRENT';
        buttonRelative.innerHTML = 'RESET';
        buttonRule.innerHTML     = "LENZ'S LAW";
        element = 1;
        ruleClues();
        magmodelLoad();
        setCamera();
    });

    /* ARMATURE COIL */
    buttonCoilEl.addEventListener('click', () => {
        buttonMagnetEl.style.backgroundColor   = 'rgb(3,108,156)';
        buttonSolenoidEl.style.backgroundColor = 'rgb(3,108,156)';
        buttonCoilEl.style.backgroundColor     = 'rgb(3,67,97)';
        elementEl.textContent = 'AC Generator - An armature coil rotates clockwise in a magnetic field';
        buttonAction.innerHTML   = 'ROTATE';
        buttonStop.innerHTML     = 'STOP';
        buttonRule.innerHTML     = "FLEMING'S RIGHT HAND RULE";
        buttonRelative.innerHTML = 'SLOW MOTION';
        element = 2;
        ruleClues();
        electromagnet.material = new THREE.MeshPhongMaterial({ color: 0x36454F });
        setCamera();
        magmodelLoad();
        magnetPolarity();
    });

    /* ACTION */
    buttonAction.addEventListener('click', () => {
        if (element === 0) {
            buttonAction.disabled = true; buttonAction.style.cursor = 'default';
            buttonFlip.disabled   = true; buttonFlip.style.cursor   = 'default';
            magZ  = -5;
            moveL = true;
            stop  = false;
            ind_i = 0;
            magnetMove();
        } else if (element === 1) {
            arrow.visible = true;
            buttonAction.disabled = true; buttonAction.style.cursor = 'default';
            buttonFlip.disabled   = true; buttonFlip.style.cursor   = 'default';
            buttonStop.disabled   = true; buttonStop.style.cursor   = 'default';
            supplyCurrent();
        } else if (element === 2) {
            cancelAnimationFrame(requestInduced);
            cancelAnimationFrame(requestInducedSlow);
            stop = false;
            scene.remove(pointGroup);
            pointGroup   = new THREE.Group();
            presentPoint = new THREE.Vector3(0, 0, 0);
            nextPoint    = new THREE.Vector3(0, 0, -1.3);
            presentPoint = nextPoint;
            a = 0;
            buttonAction.disabled = true; buttonAction.style.cursor = 'default';
            insulator.morphTargetInfluences[0]   = 1;
            currentwire.morphTargetInfluences[1] = 1;
            inducedCurrent();
        }
    });

    /* RELATIVE / RESET / SLOW MOTION */
    buttonRelative.addEventListener('click', () => {
        if (element === 0) {
            relative = true;
            magZ = -5;
            barMagnet.position.z = -4;
            relativeMove();
        } else if (element === 1) {
            resetSolenoid();
        } else if (element === 2) {
            stop = false;
            buttonAction.disabled = false; buttonAction.style.cursor = 'pointer';
            cancelAnimationFrame(requestInduced);
            cancelAnimationFrame(requestInducedSlow);
            insulator.morphTargetInfluences[0]   = 0;
            arrow1.visible = true;
            arrow2.visible = true;
            currentwire.morphTargetInfluences[1] = 1;
            buttonFlip.disabled = false; buttonFlip.style.cursor = 'pointer';
            scene.remove(pointGroup);
            pointGroup   = new THREE.Group();
            presentPoint = new THREE.Vector3(0, 0, 0);
            nextPoint    = new THREE.Vector3(0, 0, -1.3);
            presentPoint = nextPoint;
            a = 0;
            inducedCurrentSlow();
        }
    });

    /* FLIP */
    buttonFlip.addEventListener('click', () => {
        if (element === 0) {
            magnetRotate();
        } else if (element === 1) {
            actions['polarity1'].reset();
            actions['polarity'].reset();
            arrow.visible = false;
            polarity();
        } else if (element === 2) {
            scene.remove(pointGroup);
            pointGroup   = new THREE.Group();
            presentPoint = new THREE.Vector3(0, 0, 0);
            nextPoint    = new THREE.Vector3(0, 0, -1.3);
            presentPoint = nextPoint;
            a = 0;
            magnetPolarity();
        }
    });

    /* STOP / STEADY CURRENT */
    buttonStop.addEventListener('click', () => {
        stop = true;

        if (element === 0 && relative) {
            cancelAnimationFrame(requestID);
            inducedSolenoid.position.z = 0;
            galvanometer.position.z    = 0;
            galvNeedle.position.z      = 0;
            barMagnet.position.z       = -4;
            galvNeedle.rotation.y      = 0;
            buttonAction.disabled = false; buttonAction.style.cursor = 'pointer';
            buttonFlip.disabled   = false; buttonFlip.style.cursor   = 'pointer';

        } else if (element === 0 && !relative) {
            buttonAction.innerHTML   = 'MOVE';
            buttonAction.disabled    = false; buttonAction.style.cursor = 'pointer';
            buttonFlip.disabled      = false; buttonFlip.style.cursor   = 'pointer';
            inducedSolenoid.position.z = 0;
            barMagnet.position.z       = -4;
            galvNeedle.rotation.y      = 0;

        } else if (element === 1) {
            arrow.visible = true;
            buttonAction.disabled = true; buttonAction.style.cursor = 'default';
            buttonFlip.disabled   = true; buttonFlip.style.cursor   = 'default';
            buttonStop.disabled   = true; buttonStop.style.cursor   = 'default';
            steadyCurrent();

        } else if (element === 2) {
            buttonAction.disabled = false; buttonAction.style.cursor = 'pointer';
            buttonFlip.disabled   = false; buttonFlip.style.cursor   = 'pointer';
            currentwire.visible   = false;
            arrow1.visible        = false;
            arrow2.visible        = false;
            galvNeedle.rotation.y = 0;
            cancelAnimationFrame(requestInduced);
            cancelAnimationFrame(requestInducedSlow);
        }

        renderer.render(scene, camera);
    });

    /* RULE */
    buttonRule.addEventListener('click', () => {
        ruleClue = !ruleClue;
        ruleClues();
    });
}

/* ════════════════════════════════════════
   RESIZE
════════════════════════════════════════ */

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ════════════════════════════════════════
   ANIMATE
════════════════════════════════════════ */

function animate() {

    requestAnimationFrame(animate);

    TWEEN.update();

    /* ── intro camera steering ── */
    if (!introFinished) {
        smoothLook.lerp(lookTarget, 0.05);
        camera.lookAt(smoothLook);

        const time = -performance.now() / 1000;
        grid.position.z = -(time) % 1;
        wheels.forEach(w => { w.rotation.x = time * Math.PI * 2; });
    }

    controls.update();

    /* motion-blur exposure */
    currentExposure += ((1.1 - motionBlurStrength) - currentExposure) * 0.03;
    renderer.toneMappingExposure = currentExposure;

    /* animation mixers — guard until models load */
    const delta = clock.getDelta();
    if (mixer)  mixer.update(delta);
    if (mixer1) mixer1.update(delta);

    renderer.render(scene, camera);
}
