<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Ferrari Intro → Simple Pendulum</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#111; overflow:hidden; font-family:'Segoe UI',sans-serif; }
        canvas { display:block; }

        /* ── intro overlay ── */
        #introTitle {
            position:fixed; bottom:48px; left:50%;
            transform:translateX(-50%);
            color:#fff; font-size:13px; letter-spacing:.25em;
            text-transform:uppercase; opacity:.55;
            pointer-events:none; z-index:10;
        }

        /* ── lab UI hidden until transition ── */
        #labUI { display:none; }

        /* top bar */
        #topmenu {
            position:fixed; top:0; left:0; right:0; height:38px;
            background:rgba(10,10,18,.93);
            color:#e8e8e8; font-size:13px; letter-spacing:.12em;
            text-transform:uppercase;
            display:flex; align-items:center; padding:0 18px;
            z-index:100;
            border-bottom:1px solid rgba(255,255,255,.08);
        }

        /* left panel */
        #sidemenu {
            position:fixed; top:38px; left:0; width:260px;
            background:rgba(10,10,18,.9);
            color:#d4d4d4; font-size:14px; font-weight:bold;
            padding:16px 14px; z-index:100;
            border-right:1px solid rgba(255,255,255,.07);
            line-height:2;
        }
        #sidemenu p { margin-bottom:6px; }
        #sidemenu a { color:#7ecfff; font-weight:700; }

        /* bottom bar */
        #menu {
            position:fixed; bottom:0; left:0; right:0;
            background:rgba(10,10,18,.93);
            color:#d4d4d4; font-size:12.5px;
            padding:9px 18px;
            display:flex; align-items:center;
            flex-wrap:wrap; gap:8px;
            z-index:100;
            border-top:1px solid rgba(255,255,255,.08);
        }
        #message-el {
            flex:1 1 100%; font-size:11.5px;
            color:#aaa; margin-top:2px;
        }

        /* buttons */
        #menu button {
            padding:6px 14px; border:none; border-radius:4px;
            font-size:12px; font-weight:600; letter-spacing:.06em;
            cursor:pointer; color:#fff; transition:filter .15s;
        }
        #menu button:hover { filter:brightness(1.18); }
        #stop     { background:#8b1a1a; }
        #double   { background:#1a4e8f; }
        #periodic { background:#2a6e3f; }
        #theorybutton { background:#5a3a7a; }

        /* CSS2D labels */
        .label {
            font-weight:bold;
            font-size:12px;
        }
    </style>
</head>
<body>

<!-- ── intro overlay ── -->
<div id="introTitle">Ferrari SF90 Stradale &nbsp;&middot;&nbsp; Loading Lab&hellip;</div>

<!-- ── pendulum lab UI (shown after transition) ── -->
<div id="labUI">

    <div id="topmenu">PENDULUM MOTION</div>

    <div id="sidemenu">
        <p>T = 2&pi; &radic;(L/g)</p>
        <p id="cal-el">
            L = <a id="len">10</a> cm;
            T = <a id="val">0.635</a> s<br>
            <a id="details-el"></a>
        </p>
    </div>

    <div id="menu">
        <a id="message-el">
            Change the length of the pendulum in the parameters and study
            the effect on the time period of oscillation
        </a><br>
        <button id="stop">STOP</button>
        <button id="double">Compare Pendulums</button>
        <button id="periodic">Periodic Motion</button>
        <button id="theorybutton">THEORY</button>
    </div>

</div><!-- /labUI -->


<script type="importmap">
{
    "imports": {
        "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "tween":         "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js"
    }
}
</script>

<script type="module">

import * as THREE        from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader }    from 'three/addons/loaders/RGBELoader.js';
import { CSS2DRenderer, CSS2DObject }
                         from 'three/addons/renderers/CSS2DRenderer.js';
import TWEEN             from 'tween';

/* ════════════════════════════════════════
   GLOBALS
════════════════════════════════════════ */

let renderer, labelRenderer, camera, scene, controls;

/* ── groups ── */
let ferrariGroup  = new THREE.Group();
let pendulumGroup = new THREE.Group();

/* ── ferrari ── */
let car, grid;
const wheels     = [];
const lookTarget = new THREE.Vector3(0, 0.5, 0);
const smoothLook = new THREE.Vector3(0, 0.5, 0);

let introFinished      = false;
let motionBlurStrength = 0;
let currentExposure    = 1.1;

/* ── pendulum objects ── */
let mass, point, string, massPoint, wall;
let angleGeometry, angleMeasure, marker1, marker2;
let point1, point2;
let velocity, PEarrow, tension, weight;
let vLabel, wLabel, tLabel;
let extraPendulum = new THREE.Group();
let dataGroup     = new THREE.Group();
let vector        = new THREE.Group();
let line;

/* ── pendulum state ── */
let t = 0, x = 0, idx = 0, period = 0;
let pointData = [], point1Data = [], point2Data = [];
let presentPoint = new THREE.Vector3(0,  0, 0);
let nextPoint    = new THREE.Vector3(0, -10, 0);
let data = [], dataX = [], dataY = [], dataV = [];
let points = [];
let motion = true, double = false, stop = false;

/* ── pendulum params ── */
const pParams = {
    amp   : 0.15,
    len   : 10,
    g     : 9.8,
    radius: 5
};

/* ── pendulum DOM refs (filled in setupPendulumUI) ── */
let messageEl, detailsEl, calEl, lenEl, valEl;
let buttonStop, buttonDouble, buttonPeriodic, buttonTheory;

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */

init();

function init() {

    /* ── renderer ── */
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled   = true;
    renderer.shadowMap.type      = THREE.VSMShadowMap;
    document.body.appendChild(renderer.domElement);

    /* ── CSS2D label renderer ── */
    labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position    = 'absolute';
    labelRenderer.domElement.style.top         = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    /* ── camera  (Ferrari FOV 40, pendulum FOV 50 — stays 40 for intro,
          we don't need to change FOV mid-run because the pendulum scene
          is fully visible at FOV 40 from its camera position) ── */
    camera = new THREE.PerspectiveCamera(
        40,
        window.innerWidth / window.innerHeight,
        0.1,
        50000
    );

    /* ── scene ── */
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    /* ── orbit controls (disabled during intro) ── */
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled       = false;
    controls.enablePan     = true;
    controls.enableZoom    = true;
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed   = 0.1;
    controls.minDistance   = 0.1;
    controls.maxDistance   = 5000;

    createLights();
    createFerrariShowroom();
    createPendulumScene();

    animate();

    window.addEventListener('resize', onResize);
}

/* ════════════════════════════════════════
   LIGHTS  — identical to working file
════════════════════════════════════════ */

function createLights() {

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    const dir = new THREE.DirectionalLight(0xffffff, 4);
    dir.position.set(5, 10, 7);
    scene.add(dir);
}

/* ════════════════════════════════════════
   FERRARI SHOWROOM  — identical to working file
════════════════════════════════════════ */

function createFerrariShowroom() {

    scene.add(ferrariGroup);

    grid = new THREE.GridHelper(20, 40, 0xffffff, 0xffffff);
    grid.material.opacity     = 0.15;
    grid.material.transparent = true;
    ferrariGroup.add(grid);

    new RGBELoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
            'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
            function (texture) {
                const pmrem = new THREE.PMREMGenerator(renderer);
                const env   = pmrem.fromEquirectangular(texture).texture;
                scene.environment = env;
                texture.dispose();
                pmrem.dispose();
            }
        );

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.load(
        'https://threejs.org/examples/models/gltf/ferrari.glb',
        function (gltf) {
            car = gltf.scene.children[0];

            car.getObjectByName('body').material =
                new THREE.MeshPhysicalMaterial({
                    color: 0xff0000, metalness: 1,
                    roughness: 0.35, clearcoat: 1
                });

            wheels.push(
                car.getObjectByName('wheel_fl'),
                car.getObjectByName('wheel_fr'),
                car.getObjectByName('wheel_rl'),
                car.getObjectByName('wheel_rr')
            );

            ferrariGroup.add(car);
            startFerrariSequence();
        }
    );
}

/* ════════════════════════════════════════
   CAMERA HELPERS  — identical to working file
════════════════════════════════════════ */

function moveCamera(x, y, z, tx, ty, tz, duration) {
    return new TWEEN.Tween(camera.position)
        .to({ x, y, z }, duration)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onStart(() => {
            new TWEEN.Tween(lookTarget)
                .to({ x: tx, y: ty, z: tz }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        });
}

function bounceCar() {
    return new TWEEN.Tween(car.position)
        .to({ y: 0.15 }, 400)
        .yoyo(true).repeat(1)
        .easing(TWEEN.Easing.Quadratic.Out);
}

/* ════════════════════════════════════════
   FERRARI CINEMATIC  — identical to working file
════════════════════════════════════════ */

function startFerrariSequence() {

    camera.position.set(0, 25, -80);

    const fly = moveCamera(0, 8, -18, 0, 0.5, 0, 2500)
        .onStart(() => { motionBlurStrength = 0.25; });

    const approach = moveCamera(0, 3, -8, 0, 0.5, 0, 2500)
        .onComplete(() => { motionBlurStrength = 0.05; });

    const orbitObj = { angle: 0 };
    const orbit = new TWEEN.Tween(orbitObj)
        .to({ angle: Math.PI * 2 }, 8000)
        .easing(TWEEN.Easing.Sinusoidal.InOut)
        .onUpdate(() => {
            camera.position.x = Math.cos(orbitObj.angle) * 8;
            camera.position.z = Math.sin(orbitObj.angle) * 8;
            camera.position.y = 2.5 + Math.sin(orbitObj.angle * 2) * 0.5;
        });

    const frontInspect = moveCamera( 2,  1.5,  4, 0, 0.5, 0, 2200);
    const sideInspect  = moveCamera(-4,  1.2,  0, 0, 0.5, 0, 2200);
    const rearInspect  = moveCamera( 0,  2,   -5, 0, 0.5, 0, 2200);
    const bounce       = bounceCar();

    const rise = moveCamera(0, 12, -14, 0, 0, 0, 3000)
        .onStart(() => { motionBlurStrength = 0.12; });

    /* ── transition — swap to pendulum scene values ── */
    const transition = moveCamera(10, 18, 18, -8, -8.6, -16, 5000)
        .onStart(() => { motionBlurStrength = 0.4; })
        .onComplete(() => {

            ferrariGroup.visible  = false;
            pendulumGroup.visible = true;

            /* pendulum scene background */
            scene.background = new THREE.Color('skyblue');

            /* show lab UI */
            document.getElementById('introTitle').style.display = 'none';
            document.getElementById('labUI').style.display      = 'block';

            /* pendulum orbit controls target */
            controls.enabled = true;
            controls.target.set(-8, -8.6, -16);
            controls.update();

            motionBlurStrength = 0;
            introFinished      = true;

            /* kick off pendulum motion now that scene is visible */
            pendulumAction();
        });

    fly.chain(approach);
    approach.chain(orbit);
    orbit.chain(frontInspect);
    frontInspect.chain(sideInspect);
    sideInspect.chain(rearInspect);
    rearInspect.chain(bounce);
    bounce.chain(rise);
    rise.chain(transition);

    fly.start();
}

/* ════════════════════════════════════════
   PENDULUM SCENE
════════════════════════════════════════ */

function createPendulumScene() {

    pendulumGroup.visible = false;
    scene.add(pendulumGroup);

    /* ground grid */
    const pendulumGrid = new THREE.GridHelper(150, 150);
    pendulumGrid.position.y = -10;
    pendulumGroup.add(pendulumGrid);

    /* ceiling wall bar */
    const wallGeo = new THREE.BoxGeometry(25, 0.2, 1);
    const wallMat = new THREE.MeshStandardMaterial({ color: 'rgb(60%,15%,5%)' });
    wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.y = 14.9;
    pendulumGroup.add(wall);

    /* pivot point */
    const ptGeo = new THREE.BufferGeometry().setAttribute(
        'position', new THREE.BufferAttribute(new Float32Array([0,0,0]), 3)
    );
    point = new THREE.Points(ptGeo, new THREE.PointsMaterial({ color: 0x888888, size: 0.2 }));
    point.position.y = 15 - 0.2;
    pendulumGroup.add(point);

    /* mass point helper */
    const mp2Geo = new THREE.BufferGeometry().setAttribute(
        'position', new THREE.BufferAttribute(new Float32Array([0,0,0]), 3)
    );
    massPoint = new THREE.Points(mp2Geo, new THREE.PointsMaterial({ color: 0x888888, size: 0.2 }));

    /* string (rod) */
    const rodGeo = new THREE.CylinderGeometry(0.02, 0.02, 10, 4).translate(0, -5, 0);
    string = new THREE.Mesh(rodGeo, new THREE.MeshStandardMaterial({ color: 'black' }));
    point.add(string);

    /* protractor angle display */
    angleGeometry = new THREE.PlaneGeometry(4, 2).translate(0, 1, 0);
    const texture  = new THREE.TextureLoader().load('./assets/img/protractor.png');
    angleMeasure   = new THREE.Mesh(
        angleGeometry,
        new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, map: texture, transparent: true })
    );
    angleMeasure.rotation.z = 3.14;
    angleMeasure.position.y = 15.0;
    angleMeasure.scale.set(2, 2, 2);
    pendulumGroup.add(angleMeasure);

    /* angle markers */
    const markerGeo = new THREE.PlaneGeometry(0.1, 0.8).translate(0, 3.2, 0.01);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
    marker1 = new THREE.Mesh(markerGeo, markerMat);
    marker2 = marker1.clone();
    wall.add(marker1, marker2);
    marker1.rotation.z = 3.14 + pParams.amp;
    marker2.rotation.z = 3.14 - pParams.amp;

    /* bob (sphere mass) */
    const sphereGeo = new THREE.SphereGeometry(pParams.radius / 15, 8, 16);
    const sphereMat = new THREE.MeshStandardMaterial({ color: 0xFF008C });
    mass = new THREE.Mesh(sphereGeo, sphereMat);
    mass.position.y = -pParams.len;
    massPoint.position.z = 0.1;
    point.add(mass);
    mass.add(massPoint);
    massPoint.add(vector);

    /* pre-calculate motion data */
    valueCal(pParams.len, pParams.amp);

    /* force arrows */
    addArrows();

    /* comparison pendulums (built but hidden until Compare button) */
    comparePendulums();

    /* DOM wiring */
    setupPendulumUI();
}

/* ------------------------------------------------ */
/* valueCal                                          */
/* ------------------------------------------------ */

function valueCal(len, amp) {

    data = []; dataX = []; dataY = []; dataV = []; points = [];
    period = pendulumEquation().w;

    for (let i = 0; i < 10; i += 0.002) {
        const wt = i * period;
        const a  = amp * Math.cos(wt);
        const b  = parseFloat((len * Math.sin(a)).toFixed(2));
        const c  = parseFloat((len * Math.cos(a)).toFixed(2));
        const v  = -amp * period * Math.sin(wt);
        points.push(new THREE.Vector3(b, -10, -i * 5));
        data.push(a);
        dataX.push(c);
        dataY.push(b);
        dataV.push(v);
    }
}

/* ------------------------------------------------ */
/* pendulumEquation                                  */
/* ------------------------------------------------ */

function pendulumEquation() {
    const w = Math.sqrt(pParams.g / (pParams.len * 0.01));
    const T = 2 * Math.PI / w;
    return { T, w };
}

/* ------------------------------------------------ */
/* addArrows                                         */
/* ------------------------------------------------ */

function addArrows() {

    weight   = addArrow(2, 0xffff00, -Math.PI);
    wLabel   = addLabel('W = mg', 'yellow');
    scene.add(weight);

    velocity = addArrow(1, 0x0000ff, -Math.PI / 2);
    vLabel   = addLabel('F', 'blue');

    tension  = addArrow(2, 0xffffff, 0);
    velocity.scale.set(1, dataV[0], 1);
    tLabel   = addLabel('T', 'white');

    vector.add(velocity, tension);
    velocity.add(vLabel);
    tension.add(tLabel);

    weight.position.z = 0.1;
    weight.position.y = 15 - pParams.len;
    wLabel.position.x = 1;
    wLabel.position.y = 2.5;
    vLabel.position.y = 1;
    tLabel.position.y = 2.3;
    tLabel.position.x = -0.5;

    weight.add(wLabel);
}

function addArrow(len, hex, rot) {
    const shaft = new THREE.Mesh(
        new THREE.PlaneGeometry(0.1, len).translate(0, len / 2, 0),
        new THREE.MeshPhongMaterial({ color: hex, side: THREE.DoubleSide })
    );
    const head = new THREE.Mesh(
        new THREE.ConeGeometry(0.1, 0.4, 6).translate(0, len, 0),
        new THREE.MeshStandardMaterial({ color: hex })
    );
    head.add(shaft);
    head.rotateZ(rot);
    return head;
}

function addLabel(name, col) {
    const div = document.createElement('div');
    div.className    = 'label';
    div.textContent  = name;
    div.style.color  = col;
    return new CSS2DObject(div);
}

/* ------------------------------------------------ */
/* changeLength                                      */
/* ------------------------------------------------ */

function changeLength(value) {
    const a = value / 10;
    string.scale.set(1, a, 1);
    mass.position.y = -a * 10;
}

/* ------------------------------------------------ */
/* comparePendulums                                  */
/* ------------------------------------------------ */

function comparePendulums() {

    hideArrows();
    pointData = calValues(10, 0.2);
    marker1.rotation.z = 3.14 + 0.2;
    marker2.rotation.z = 3.14 - 0.2;

    point1 = point.clone();
    point1.children[0].scale.y = 1.3;
    point1.children[1].position.y -= 3;
    point1.children[1].material = new THREE.MeshPhongMaterial({ color: 'rgb(0,255,255)' });
    point1.position.x = -5;
    point1Data = calValues(13, 0.2);

    point2 = point.clone();
    point2.children[0].scale.y = 1.5;
    point2.children[1].position.y -= 5;
    point2.children[1].material = new THREE.MeshStandardMaterial({ color: 'rgb(0,255,0)' });
    point2.position.x = 5;
    point2Data = calValues(15, 0.2);

    extraPendulum.add(point, point1, point2);
    pendulumGroup.add(extraPendulum);
    pendulumGroup.add(dataGroup);

    /* hide comparison pendulums until button pressed */
    point1.visible = false;
    point2.visible = false;
}

function calValues(len, amp) {
    const DATA = [];
    const w    = Math.sqrt(pParams.g / (len * 0.01));
    for (let i = 0; i < 10; i += 0.002) {
        const wt = i * w;
        const a  = amp * Math.cos(wt);
        DATA.push(a);
        DATA.push(parseFloat((len * Math.cos(a)).toFixed(2)));
        DATA.push(parseFloat((len * Math.sin(a)).toFixed(2)));
    }
    return DATA;
}

/* ------------------------------------------------ */
/* pendulumAction  — single vs compare dispatch     */
/* ------------------------------------------------ */

function pendulumAction() {

    if (double) {
        point1.visible = true;
        point2.visible = true;
        marker1.rotation.z = 3.14 + 0.2;
        marker2.rotation.z = 3.14 - 0.2;
        hideArrows();
        pendulumsMotion();
    } else {
        resetPara();
        marker1.rotation.z = 3.14 + pParams.amp;
        marker2.rotation.z = 3.14 - pParams.amp;
        point1.visible = false;
        point2.visible = false;
        showArrows();
        pendulumMovement();
    }
}

/* ------------------------------------------------ */
/* pendulumMovement  — single pendulum loop         */
/* ------------------------------------------------ */

function pendulumMovement() {

    if (motion && idx < data.length) {

        point.rotation.z     = data[idx];
        weight.position.x    = dataY[idx];
        weight.position.y    = 15 - dataX[idx];
        velocity.scale.set(1, dataV[idx], 1);
        presentPoint = points[idx];

        line = initLine({
            points     : [presentPoint, nextPoint],
            lineMaterial: new THREE.LineBasicMaterial({ color: 'black' }),
            yRotation  : 0, x: 0, y: 0, z: 0
        });
        dataGroup.add(line);

        idx++;
        nextPoint = presentPoint;
        stop = !stop;
        buttonStop.innerHTML = 'STOP';
        requestAnimationFrame(pendulumMovement);

    } else if (idx >= data.length && motion) {
        resetPara();
        requestAnimationFrame(pendulumMovement);
    } else {
        t = 0; x = 0;
        velocity.scale.set(0, 0, 0);
        point.rotation.set(0, 0, 0);
        weight.position.x = 0;
        weight.position.y = 15 - pParams.len;
        stop = !stop;
        buttonStop.innerHTML = 'START';
        cancelAnimationFrame(pendulumMovement);
    }
}

/* ------------------------------------------------ */
/* pendulumsMotion  — three-pendulum compare loop   */
/* ------------------------------------------------ */

function pendulumsMotion() {

    const A = point1Data.length;

    if (motion && idx < A) {
        point.rotation.z  = pointData[idx];
        point1.rotation.z = point1Data[idx];
        point2.rotation.z = point2Data[idx];
        idx += 3;
        requestAnimationFrame(pendulumsMotion);
    } else if (idx >= A && motion) {
        idx = 0;
        requestAnimationFrame(pendulumsMotion);
    } else {
        t = 0; x = 0;
        point.rotation.set(0, 0, 0);
        point1.rotation.set(0, 0, 0);
        point2.rotation.set(0, 0, 0);
        cancelAnimationFrame(pendulumsMotion);
    }
}

/* ------------------------------------------------ */
/* stopAction                                        */
/* ------------------------------------------------ */

function stopAction() {
    buttonStop.innerHTML = stop ? 'START' : 'STOP';
}

/* ------------------------------------------------ */
/* hideArrows / showArrows                           */
/* ------------------------------------------------ */

function hideArrows() {
    velocity.visible = false;
    weight.visible   = false;
    tension.visible  = false;
    vLabel.visible   = false;
    wLabel.visible   = false;
    tLabel.visible   = false;
}

function showArrows() {
    velocity.visible = true;
    weight.visible   = true;
    tension.visible  = true;
    vLabel.visible   = true;
    wLabel.visible   = true;
    tLabel.visible   = true;
}

/* ------------------------------------------------ */
/* visualClues                                       */
/* ------------------------------------------------ */

function visualClues() {
    if (double) {
        detailsEl.style.display = 'block';
        detailsEl.innerHTML =
            'L = 13.00 cm; T = 0.72 s<br>L = 15.00 cm; T = 0.78 s';
    } else {
        detailsEl.style.display = 'none';
    }
}

/* ------------------------------------------------ */
/* resetPara                                         */
/* ------------------------------------------------ */

function resetPara() {
    removeData();
    idx       = 0;
    nextPoint = new THREE.Vector3(0, -10, 0);
}

/* ------------------------------------------------ */
/* removeData                                        */
/* ------------------------------------------------ */

function removeData() {
    pendulumGroup.remove(dataGroup);
    dataGroup = new THREE.Group();
    pendulumGroup.add(dataGroup);
    if (messageEl) messageEl.innerHTML = '';
}

/* ------------------------------------------------ */
/* initLine                                          */
/* ------------------------------------------------ */

function initLine(d) {
    const geo = new THREE.BufferGeometry().setFromPoints(d.points);
    const ln  = new THREE.Line(geo, d.lineMaterial);
    ln.rotation.y = d.yRotation;
    ln.position.set(d.x, d.y, d.z);
    return ln;
}

/* ------------------------------------------------ */
/* periodicSite / theorySite                         */
/* ------------------------------------------------ */

function periodicSite() {
    window.open('Mechanics_Periodic_Motion.html', '_self');
}

function theorySite() {
    window.open('../Theory/Mechanics/Mechanics_Simple_Pendulum.html', '_self');
}

/* ------------------------------------------------ */
/* guiControls  — lil-gui parameter panel           */
/* ------------------------------------------------ */

function guiControls() {

    /* dynamic import so lil-gui is only loaded after transition */
    import('https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js')
    .then(({ GUI }) => {

        const gui = new GUI();
        gui.close();
        gui.title('Parameters');

        gui.add(pParams, 'amp', 0, 0.3, 0.01).name('Amplitude, A')
            .onChange(value => {
                pParams.amp = value;
                point.rotation.z   = value;
                marker1.rotation.z = 3.14 + value;
                marker2.rotation.z = 3.14 - value;
                valueCal(pParams.len, pParams.amp);
                idx       = 0;
                nextPoint = new THREE.Vector3(0, -10, 0);
                weight.position.x = dataY[0];
                weight.position.y = 15 - dataX[0];
                velocity.scale.set(0, dataV[0], 0);
                messageEl.innerHTML = 'Amplitude of the oscillation only changes';
            });

        gui.add(pParams, 'len', 4, 25, 1).name('Length, l (cm)')
            .onChange(value => {
                motion     = false;
                pParams.len = value;
                changeLength(value);
                valueCal(pParams.len, pParams.amp);
                weight.position.y = 15 - pParams.len;
                valEl.innerText   = pendulumEquation().T.toFixed(2);
                lenEl.innerText   = pParams.len.toFixed(2);
            });

        gui.add(pParams, 'radius', 5, 10, 0.05).name('Mass, m (gm)')
            .onChange(value => {
                mass.geometry.dispose();
                mass.geometry = new THREE.SphereGeometry(value / 15, 8, 16);
            });

        gui.add({ clear: () => { removeData(); resetPara(); } }, 'clear')
            .name('Clear Data Points');
    });
}

/* ------------------------------------------------ */
/* setupPendulumUI  — DOM event wiring              */
/* ------------------------------------------------ */

function setupPendulumUI() {

    messageEl    = document.getElementById('message-el');
    detailsEl    = document.getElementById('details-el');
    calEl        = document.getElementById('cal-el');
    lenEl        = document.getElementById('len');
    valEl        = document.getElementById('val');
    buttonStop   = document.getElementById('stop');
    buttonDouble = document.getElementById('double');

    buttonPeriodic = document.getElementById('periodic');
    buttonTheory   = document.getElementById('theorybutton');

    /* set initial readout values */
    lenEl.innerHTML = pParams.len.toFixed(2);
    valEl.innerHTML = pendulumEquation().T.toFixed(2);

    /* STOP / START */
    buttonStop.addEventListener('click', () => {
        stop   = !stop;
        motion = !motion;
        pendulumAction();
        stopAction();
    });

    /* COMPARE / SINGLE */
    buttonDouble.addEventListener('click', () => {
        stop   = true;
        stopAction();
        double = !double;
        motion = false;
        removeData();
        pendulumAction();
        visualClues();
        buttonDouble.innerHTML = double ? 'Single Pendulum' : 'Compare Pendulums';
        if (double) pendulumsMotion();
        else        pendulumMovement();
    });

    /* NAV buttons */
    buttonPeriodic.addEventListener('click', periodicSite);
    buttonTheory.addEventListener('click', theorySite);
}

/* ════════════════════════════════════════
   RESIZE  — identical to working file
════════════════════════════════════════ */

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
}

/* ════════════════════════════════════════
   ANIMATE
════════════════════════════════════════ */

function animate() {

    requestAnimationFrame(animate);

    TWEEN.update();

    /* ── intro camera steering ── */
    if (!introFinished) {
        smoothLook.lerp(lookTarget, 0.05);
        camera.lookAt(smoothLook);

        const time = -performance.now() / 1000;
        grid.position.z = -(time) % 1;

        for (let i = 0; i < wheels.length; i++) {
            wheels[i].rotation.x = time * Math.PI * 2;
        }
    }

    controls.update();

    /* fake motion-blur via tone-mapping exposure */
    currentExposure +=
        ((1.1 - motionBlurStrength) - currentExposure) * 0.03;
    renderer.toneMappingExposure = currentExposure;

    /* render both WebGL and CSS2D */
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
}
