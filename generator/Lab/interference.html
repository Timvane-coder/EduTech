<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Ferrari Intro → Wave Interference</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#111; overflow:hidden; font-family:'Segoe UI',sans-serif; }
        canvas { display:block; }

        /* ── intro overlay ── */
        #introTitle {
            position:fixed; bottom:48px; left:50%;
            transform:translateX(-50%);
            color:#fff; font-size:13px; letter-spacing:.25em;
            text-transform:uppercase; opacity:.55;
            pointer-events:none; z-index:10;
        }

        /* ── lab UI hidden until transition ── */
        #labUI { display:none; }

        /* top bar */
        #topmenu {
            position:fixed; top:0; left:0; right:0; height:38px;
            background:rgba(15,15,20,.93);
            color:#e8e8e8; font-size:13px; letter-spacing:.12em;
            text-transform:uppercase;
            display:flex; align-items:center; padding:0 18px;
            z-index:100;
            border-bottom:1px solid rgba(255,255,255,.08);
        }

        /* left control panel */
        #sidemenu {
            position:fixed; top:38px; left:0; width:290px;
            background:rgba(15,15,20,.9);
            color:#d4d4d4; font-size:12px;
            padding:16px 14px; z-index:100;
            border-right:1px solid rgba(255,255,255,.07);
            line-height:1.9;
        }
        #sidemenu label {
            color:#aaa; font-size:11px;
            display:block; margin-top:10px;
        }
        #sidemenu input[type=range]{
            width:100%; accent-color:#036c9c;
            margin-top:3px; margin-bottom:2px;
        }
        #sidemenu a { color:#7ecfef; font-weight:600; }

        /* bottom button bar */
        #menu {
            position:fixed; bottom:0; left:0; right:0;
            background:rgba(15,15,20,.93);
            color:#d4d4d4; font-size:12.5px;
            padding:9px 18px;
            display:flex; align-items:center;
            flex-wrap:wrap; gap:8px;
            z-index:100;
            border-top:1px solid rgba(255,255,255,.08);
        }
        #menu button{
            padding:6px 16px; border:none; border-radius:4px;
            font-size:12px; font-weight:600; letter-spacing:.06em;
            cursor:pointer; color:#fff; transition:filter .15s;
        }
        #menu button:hover { filter:brightness(1.18); }
        #action { background:rgb(3,108,156); }
        #reset  { background:rgb(80,80,80); }
    </style>
</head>
<body>

<!-- ── intro overlay ── -->
<div id="introTitle">Ferrari SF90 Stradale &nbsp;&middot;&nbsp; Loading Lab&hellip;</div>

<!-- ── optics lab UI (shown after transition) ── -->
<div id="labUI">

    <div id="topmenu">Interactive 3D Wave Interference</div>

    <div id="sidemenu">
        <label for="damp">Damping Factor</label>
        <input type="range" id="damp" min="0" max="0.5" value="0.1" step="0.01">

        <label for="wave">Wave Number = <a id="waveDisplay">2</a> cm<sup>-1</sup></label>
        <input type="range" id="wave" min="1" max="8" value="2" step="1">

        <label for="dist">Distance between the two sources = <a id="distDisplay">2</a> cm</label>
        <input type="range" id="dist" min="1" max="8" value="2" step="1">
    </div>

    <div id="menu">
        <button id="action">INTERFERENCE</button>
        <button id="reset">RESET</button>
    </div>

</div><!-- /labUI -->


<script type="importmap">
{
    "imports": {
        "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "tween":         "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js"
    }
}
</script>

<script type="module">

import * as THREE        from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader }    from 'three/addons/loaders/RGBELoader.js';
import TWEEN             from 'tween';

/* ════════════════════════════════════════
   GLOBALS
════════════════════════════════════════ */

let renderer, camera, scene, controls;

/* ── groups ── */
let ferrariGroup = new THREE.Group();
let opticsGroup  = new THREE.Group();

/* ── ferrari ── */
let car, grid;
const wheels     = [];
const lookTarget = new THREE.Vector3(0, 0.5, 0);
const smoothLook = new THREE.Vector3(0, 0.5, 0);

let introFinished      = false;
let motionBlurStrength = 0;
let currentExposure    = 1.1;

/* ── optics ── */
let plane;
let stop       = false;
let LINES      = new THREE.Group();
let requestID;                          // wave rAF handle
const optClock = new THREE.Clock();

const optParams = {
    pos  : -12,   // source point x
    d    :  2,    // half-distance between the two sources
    L    : 15,    // half-width of scene / screen distance
    size :  2,    // wave number   (slider: 1–8)
    mag  :  0.3,  // amplitude
    freq :  1,    // temporal frequency
    damp : 0.01   // spatial damping
};

/* DOM refs – wired in setupOpticsUI() */
let actionButton, resetButton, waveInput, waveEl, distInput, distEl, dampInput;

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */

init();

function init() {

    /* renderer — identical to Ferrari version */
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    /* camera — FOV 40 for Ferrari intro; optics scene uses FOV 50
       We start with the Ferrari FOV and update it in the transition */
    camera = new THREE.PerspectiveCamera(
        40,
        window.innerWidth / window.innerHeight,
        0.1,
        50000
    );

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled    = false;
    controls.enablePan  = true;
    controls.enableZoom = true;

    createLights();
    createFerrariShowroom();
    createOpticsScene();     /* ← replaces createCapacitorScene() */

    animate();

    window.addEventListener('resize', onResize);
}

/* ════════════════════════════════════════
   LIGHTS  (unchanged)
════════════════════════════════════════ */

function createLights() {

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    const dir = new THREE.DirectionalLight(0xffffff, 4);
    dir.position.set(5, 10, 7);
    scene.add(dir);
}

/* ════════════════════════════════════════
   FERRARI SHOWROOM  (unchanged)
════════════════════════════════════════ */

function createFerrariShowroom() {

    scene.add(ferrariGroup);

    grid = new THREE.GridHelper(20, 40, 0xffffff, 0xffffff);
    grid.material.opacity     = 0.15;
    grid.material.transparent = true;
    ferrariGroup.add(grid);

    new RGBELoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
            'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
            function (texture) {
                const pmrem = new THREE.PMREMGenerator(renderer);
                const env   = pmrem.fromEquirectangular(texture).texture;
                scene.environment = env;
                texture.dispose();
                pmrem.dispose();
            }
        );

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.load(
        'https://threejs.org/examples/models/gltf/ferrari.glb',
        function (gltf) {
            car = gltf.scene.children[0];

            car.getObjectByName('body').material =
                new THREE.MeshPhysicalMaterial({
                    color: 0xff0000, metalness: 1,
                    roughness: 0.35, clearcoat: 1
                });

            wheels.push(
                car.getObjectByName('wheel_fl'),
                car.getObjectByName('wheel_fr'),
                car.getObjectByName('wheel_rl'),
                car.getObjectByName('wheel_rr')
            );

            ferrariGroup.add(car);
            startFerrariSequence();
        }
    );
}

/* ════════════════════════════════════════
   CAMERA HELPERS  (unchanged)
════════════════════════════════════════ */

function moveCamera(x, y, z, tx, ty, tz, duration) {
    return new TWEEN.Tween(camera.position)
        .to({ x, y, z }, duration)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onStart(() => {
            new TWEEN.Tween(lookTarget)
                .to({ x: tx, y: ty, z: tz }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        });
}

function bounceCar() {
    return new TWEEN.Tween(car.position)
        .to({ y: 0.15 }, 400)
        .yoyo(true).repeat(1)
        .easing(TWEEN.Easing.Quadratic.Out);
}

/* ════════════════════════════════════════
   FERRARI CINEMATIC  (unchanged except transition.onComplete)
════════════════════════════════════════ */

function startFerrariSequence() {

    camera.position.set(0, 25, -80);

    const fly = moveCamera(0, 8, -18, 0, 0.5, 0, 2500)
        .onStart(() => { motionBlurStrength = 0.25; });

    const approach = moveCamera(0, 3, -8, 0, 0.5, 0, 2500)
        .onComplete(() => { motionBlurStrength = 0.05; });

    const orbitObj = { angle: 0 };
    const orbit = new TWEEN.Tween(orbitObj)
        .to({ angle: Math.PI * 2 }, 8000)
        .easing(TWEEN.Easing.Sinusoidal.InOut)
        .onUpdate(() => {
            camera.position.x = Math.cos(orbitObj.angle) * 8;
            camera.position.z = Math.sin(orbitObj.angle) * 8;
            camera.position.y = 2.5 + Math.sin(orbitObj.angle * 2) * 0.5;
        });

    const frontInspect = moveCamera( 2,  1.5,  4, 0, 0.5, 0, 2200);
    const sideInspect  = moveCamera(-4,  1.2,  0, 0, 0.5, 0, 2200);
    const rearInspect  = moveCamera( 0,  2,   -5, 0, 0.5, 0, 2200);
    const bounce       = bounceCar();

    const rise = moveCamera(0, 12, -14, 0, 0, 0, 3000)
        .onStart(() => { motionBlurStrength = 0.12; });

    /* ── transition into optics scene ── */
    const transition = moveCamera(50, 0, 0, 0, 0, 0, 5000)
        .onStart(() => { motionBlurStrength = 0.4; })
        .onComplete(() => {

            /* swap groups */
            ferrariGroup.visible = false;
            opticsGroup.visible  = true;

            /* optics background */
            scene.background = new THREE.Color(0xbfd1e5);

            /* remove Ferrari HDR environment so it doesn't tint the wave */
            scene.environment = null;

            /* update camera FOV to match original optics scene */
            camera.fov = 50;
            camera.updateProjectionMatrix();

            /* point camera at origin (optics scene centre) */
            camera.lookAt(0, 0, 0);

            /* show lab UI */
            document.getElementById('introTitle').style.display = 'none';
            document.getElementById('labUI').style.display      = 'block';

            /* hand controls to the optics target */
            controls.enabled = true;
            controls.target.set(0, 0, 0);
            controls.update();

            motionBlurStrength = 0;
            introFinished      = true;

            /* start the wave animation and lazy-load lil-gui */
            wave();
            setupOpticsUI();
        });

    fly.chain(approach);
    approach.chain(orbit);
    orbit.chain(frontInspect);
    frontInspect.chain(sideInspect);
    sideInspect.chain(rearInspect);
    rearInspect.chain(bounce);
    bounce.chain(rise);
    rise.chain(transition);

    fly.start();
}

/* ════════════════════════════════════════
   OPTICS SCENE
════════════════════════════════════════ */

function createOpticsScene() {

    opticsGroup.visible = false;
    scene.add(opticsGroup);

    /* additional optics lights (hemisphere + extra directional)
       matching the original optics file */
    const hemi = new THREE.HemisphereLight(0xddeeff, 0x202020, 1);
    opticsGroup.add(hemi);

    const mainLight = new THREE.DirectionalLight(0xffffff, 0.25);
    mainLight.position.set(1, 1, 10);
    opticsGroup.add(mainLight);

    const backLight = mainLight.clone();
    backLight.position.set(1, -10, 10);
    opticsGroup.add(backLight);

    /* wave plane — 30 × 20, 600 × 400 segments */
    const planeGeo = new THREE.PlaneGeometry(30, 20, 600, 400);
    const planeMat = new THREE.MeshPhongMaterial({
        color: 0xEF3523,
        side : THREE.DoubleSide
    });
    plane = new THREE.Mesh(planeGeo, planeMat);
    opticsGroup.add(plane);

    /* LINES group for ray arrows */
    opticsGroup.add(LINES);

    /* horizontal centre line */
    const linePts = [
        new THREE.Vector3(-optParams.L, 0, 0),
        new THREE.Vector3( optParams.L, 0, 0)
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
    const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
    opticsGroup.add(new THREE.Line(lineGeo, lineMat));

    /* initial reference rays */
    addRef((1.6 + optParams.d) / optParams.size);
}

/* ------------------------------------------------ */
/* wave  — main ripple animation loop               */
/* ------------------------------------------------ */

function wave() {

    const center1 = new THREE.Vector3(optParams.pos,  optParams.d, 0);
    const center2 = new THREE.Vector3(optParams.pos, -optParams.d, 0);
    const vLength = plane.geometry.attributes.position.count;
    const t       = optClock.getElapsedTime();

    for (let i = 0; i < vLength; i++) {
        const vx = plane.geometry.attributes.position.getX(i);
        const vy = plane.geometry.attributes.position.getY(i);
        const vz = plane.geometry.attributes.position.getZ(i);

        const dist1 = new THREE.Vector3(vx, vy, vz).distanceTo(center1);
        const dist2 = new THREE.Vector3(vx, vy, vz).distanceTo(center2);

        const xsin1 = Math.sin(optParams.freq * t - dist1 * optParams.size)
                    * optParams.mag
                    * Math.exp(-dist1 * optParams.damp);

        const xsin2 = Math.sin(optParams.freq * t - dist2 * optParams.size)
                    * optParams.mag
                    * Math.exp(-dist2 * optParams.damp);

        plane.geometry.attributes.position.setZ(i, xsin1 + xsin2);
    }

    plane.geometry.computeVertexNormals();
    plane.geometry.attributes.position.needsUpdate = true;

    requestID = requestAnimationFrame(wave);
}

/* ------------------------------------------------ */
/* stopAction                                        */
/* ------------------------------------------------ */

function stopAction() {
    if (stop) {
        setTimeout(() => {
            actionButton.style.backgroundColor = 'rgb(3,108,156)';
            wave();
        }, 500);
    } else {
        cancelAnimationFrame(requestID);
    }
}

/* ------------------------------------------------ */
/* addRays  — single arrow helper                   */
/* ------------------------------------------------ */

function addRays(length) {

    const rayGeo = new THREE.CylinderGeometry(0.05, 0.05, length, 8, 1)
                       .translate(0, length / 2, 0);
    rayGeo.rotateX(Math.PI / 2);
    const rayLine = new THREE.Mesh(
        rayGeo,
        new THREE.MeshBasicMaterial({ color: 'blue' })
    );

    const coneGeo = new THREE.ConeGeometry(0.3, 0.5, 6)
                        .translate(0, length / 2, 0);
    coneGeo.rotateX(Math.PI / 2);
    const arrowHead = new THREE.Mesh(
        coneGeo,
        new THREE.MeshBasicMaterial({ color: 'black' })
    );

    rayLine.add(arrowHead);
    return rayLine;
}

/* ------------------------------------------------ */
/* addRef  — rebuild reference ray arrows           */
/* ------------------------------------------------ */

function addRef(a) {

    /* clear existing arrows */
    while (LINES.children.length > 0) {
        LINES.children[0].parent.remove(LINES.children[0]);
    }

    const Q  = new THREE.Vector3(optParams.L, 0, 0);
    const S1 = new THREE.Vector3(optParams.pos,  optParams.d, 0);
    const S2 = new THREE.Vector3(optParams.pos, -optParams.d, 0);

    const R1 = addRays(S1.distanceTo(Q));
    const R2 = addRays(S2.distanceTo(Q));

    R1.position.copy(S1);
    R2.position.copy(S2);
    R1.lookAt(Q);
    R2.lookAt(Q);

    LINES.add(R1, R2);
}

/* ------------------------------------------------ */
/* setupOpticsUI  — DOM wiring + lazy lil-gui       */
/* ------------------------------------------------ */

function setupOpticsUI() {

    actionButton = document.getElementById('action');
    resetButton  = document.getElementById('reset');
    waveInput    = document.getElementById('wave');
    waveEl       = document.getElementById('waveDisplay');
    distInput    = document.getElementById('dist');
    distEl       = document.getElementById('distDisplay');
    dampInput    = document.getElementById('damp');

    /* INTERFERENCE toggle */
    actionButton.addEventListener('click', () => {
        stop = !stop;
        actionButton.style.backgroundColor = 'rgb(243,44,87)';
        cancelAnimationFrame(requestID);
        stopAction();
    });

    /* RESET */
    resetButton.addEventListener('click', () => {
        optParams.d    = 2;
        optParams.size = 2;
        optParams.damp = 0.01;

        waveInput.valueAsNumber = optParams.size;
        waveEl.innerText        = optParams.size;
        distInput.valueAsNumber = optParams.d;
        distEl.innerText        = optParams.d;
        dampInput.valueAsNumber = optParams.damp;

        const a = 5 / optParams.d + 20 / optParams.size;
        addRef(a);
    });

    /* wave-number slider */
    waveInput.addEventListener('input', () => {
        optParams.size = waveInput.valueAsNumber;
        optParams.mag  = 1.2 / optParams.size;
        waveEl.innerText = optParams.size;

        let a;
        if      (optParams.d <= 2) { a = 20 / optParams.size; }
        else if (optParams.d >  6) { a = 0.7 * optParams.d / optParams.size; }
        else                       { a = (1.6 + optParams.d) / optParams.size; }

        addRef(a);
    });

    /* source distance slider */
    distInput.addEventListener('input', () => {
        optParams.d    = distInput.valueAsNumber;
        distEl.innerText = optParams.d;

        const a = 5 / optParams.d + 0.015 * optParams.size;
        addRef(a);
    });

    /* damping slider */
    dampInput.addEventListener('input', () => {
        optParams.damp = dampInput.valueAsNumber;
    });

    /* lazy-load lil-gui (only once the lab is actually visible) */
    import('https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js')
        .then(({ GUI }) => {
            guiControls(GUI);
        })
        .catch(e => console.warn('lil-gui failed to load', e));
}

/* ------------------------------------------------ */
/* guiControls  — dev panel                         */
/* ------------------------------------------------ */

function guiControls(GUI) {

    const gui = new GUI();
    gui.close();

    const camFolder = gui.addFolder('Camera');
    camFolder.add(camera.position, 'x', -100, 100);
    camFolder.add(camera.position, 'y', -100, 100);
    camFolder.add(camera.position, 'z', -100, 100);

    const ctrlFolder = gui.addFolder('OrbitTarget');
    ctrlFolder.add(controls.target, 'x', -100, 100);
    ctrlFolder.add(controls.target, 'y', -100, 100);
    ctrlFolder.add(controls.target, 'z', -100, 100);
}

/* ════════════════════════════════════════
   RESIZE  (unchanged)
════════════════════════════════════════ */

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ════════════════════════════════════════
   ANIMATE
════════════════════════════════════════ */

function animate() {

    requestAnimationFrame(animate);

    TWEEN.update();

    /* ── Ferrari intro camera steering ── */
    if (!introFinished) {
        smoothLook.lerp(lookTarget, 0.05);
        camera.lookAt(smoothLook);

        const time = -performance.now() / 1000;
        grid.position.z = -(time) % 1;

        for (let i = 0; i < wheels.length; i++) {
            wheels[i].rotation.x = time * Math.PI * 2;
        }
    }

    controls.update();

    /* fake motion-blur via tone-mapping exposure */
    currentExposure += ((1.1 - motionBlurStrength) - currentExposure) * 0.03;
    renderer.toneMappingExposure = currentExposure;

    renderer.render(scene, camera);
}

</script>
</body>
</html>
