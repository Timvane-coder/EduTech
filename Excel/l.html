<script type="module">
import * as THREE                from 'three';
import TWEEN                     from 'three/addons/libs/tween.module.js';
import { OrbitControls }         from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }            from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }           from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader }            from 'three/addons/loaders/KTX2Loader.js';
import { EffectComposer }        from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }            from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }       from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }            from 'three/addons/postprocessing/ShaderPass.js';
import gsap                      from 'gsap';

const GLTF_SHOP  = './models/ramenShop.gltf';
const GLTF_HOLO  = './models/ramenHologram.gltf';
const DRACO_PATH = 'https://www.gstatic.com/draco/versioned/decoders/1.5.6/';
const BASIS_PATH = 'https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/libs/basis/';

// ── BLOOM LAYER ───────────────────────────────────────────────
// We use the "selective bloom" technique:
//   Layer 1 = BLOOM  — only these meshes glow
//   Layer 0 = NORMAL — everything else renders normally
// The composer runs two render passes:
//   Pass A: render only BLOOM layer → UnrealBloomPass
//   Pass B: render only NORMAL layer → merge on top
// This prevents baked textures from washing out while neons glow.
const BLOOM_LAYER = new THREE.Layers();
BLOOM_LAYER.set(1);   // layer index 1 = bloom

// Mesh names that should bloom
// lampLights removed — those globe lights are pure white and blow out the scene
// whiteButton removed — too bright at this bloom strength
// Only coloured neons bloom; they have hue so they glow without washing out
const BLOOM_MESHES = [
  'neonBlue','neonGreen','neonPink','neonYellow',
  'storageLight','portalLight','blueLights','poleLight',
  'vendingMachineLight','greenLED','redLED','yellowRightLight',
  'greenSignSquare',
];

// ── LOG ──────────────────────────────────────────────────────
const logWrap   = document.getElementById('log-entries');
const barEl     = document.getElementById('progress-bar');
const summaryEl = document.getElementById('summary');
const topStatus = document.getElementById('top-status');
const modeEl    = document.getElementById('mode-indicator');
const backBtn   = document.getElementById('back-btn');
const subnavEl  = document.getElementById('subnav');
const coordEl   = document.getElementById('coord-debug');
const icons     = {pending:'⏳',ok:'✅',err:'❌',info:'📌',head:'──',click:'👆',screen:'🖥'};

function log(msg,type='info'){
  const d=document.createElement('div');
  d.className=`log-entry ${type}`;
  d.innerHTML=`<span>${icons[type]||'·'}</span><span>${msg}</span>`;
  logWrap.appendChild(d); logWrap.scrollTop=logWrap.scrollHeight;
}
function setBar(pct){barEl.style.width=pct+'%';}
function setStatus(msg,col){topStatus.textContent=msg;topStatus.style.color=col||'#888';}

window.addEventListener('error',e=>log('ERROR: '+e.message,'err'));
window.addEventListener('unhandledrejection',e=>log('REJECT: '+(e.reason?.message||e.reason),'err'));

// ── RENDERER ─────────────────────────────────────────────────
const canvas=document.createElement('canvas');
document.body.prepend(canvas);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ReinhardToneMapping;
renderer.toneMappingExposure=0.8;  // reduced from 1.0 — prevents overall washout
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;

// ── SCENE ────────────────────────────────────────────────────
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
scene.add(new THREE.GridHelper(100,40,0x111130,0x0a0a20));

// ── CAMERA ───────────────────────────────────────────────────
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,2000);
camera.position.set(-11,8,22);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2,-2);
controls.enableDamping=true; controls.dampingFactor=0.07;
controls.maxPolarAngle=Math.PI/2; controls.minDistance=1; controls.maxDistance=300;
controls.update();

// ── FLOOR + BOX ──────────────────────────────────────────────
const mshFloor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshPhongMaterial({color:0x444444}));
mshFloor.rotation.x=-Math.PI*0.5; mshFloor.receiveShadow=true; mshFloor.position.set(0,-0.05,0); scene.add(mshFloor);
const mshBox=new THREE.Mesh(new THREE.BoxGeometry(7.5,2.5,5.0),new THREE.MeshPhongMaterial({color:0xaaaaaa}));
mshBox.castShadow=true; mshBox.receiveShadow=true; mshBox.position.set(0,15.5,0); scene.add(mshBox);

// ── LIGHTS ───────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff,0.04));
const shadowLight=new THREE.DirectionalLight(0xffffff,0.4);
shadowLight.position.set(5,30,8); shadowLight.castShadow=true;
shadowLight.shadow.mapSize.set(2048,2048);
shadowLight.shadow.camera.near=1; shadowLight.shadow.camera.far=80;
shadowLight.shadow.camera.left=-30; shadowLight.shadow.camera.right=30;
shadowLight.shadow.camera.top=30; shadowLight.shadow.camera.bottom=-30;
shadowLight.shadow.bias=-0.001;
scene.add(shadowLight,shadowLight.target);
const fillLight=new THREE.DirectionalLight(0xffffff,1.0);
fillLight.position.set(-10,20,-10); scene.add(fillLight);

// ── SPOTLIGHTS ───────────────────────────────────────────────
function createSpotlight(color){
  const l=new THREE.SpotLight(color,800);
  l.castShadow=true; l.angle=0.3; l.penumbra=0.2; l.decay=2; l.distance=60; return l;
}
const spotLight1=createSpotlight(0xFF7F00);
const spotLight2=createSpotlight(0x00FF7F);
const spotLight3=createSpotlight(0x7F00FF);
spotLight1.position.set(5,20,8); spotLight2.position.set(0,20,6); spotLight3.position.set(-5,20,8);
spotLight1.target.position.set(2,0,0); spotLight2.target.position.set(0,0,0); spotLight3.target.position.set(-2,0,0);
scene.add(spotLight1.target,spotLight2.target,spotLight3.target);
const lh1=new THREE.SpotLightHelper(spotLight1);
const lh2=new THREE.SpotLightHelper(spotLight2);
const lh3=new THREE.SpotLightHelper(spotLight3);
scene.add(spotLight1,spotLight2,spotLight3,lh1,lh2,lh3);
setBar(4);

// ─────────────────────────────────────────────────────────────
//  POST-PROCESSING — SELECTIVE BLOOM
//
//  Standard UnrealBloomPass blooms the ENTIRE scene which
//  washes out the carefully baked textures.
//
//  Selective bloom technique (three.js official example):
//  1. Darken all non-bloom meshes (save their materials)
//  2. Render bloom pass → bloom only on bright neon meshes
//  3. Restore all materials
//  4. Render final composite pass on top
//
//  This gives crisp baked textures AND glowing neons.
// ─────────────────────────────────────────────────────────────

// Bloom composer — renders only bloom layer
const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;

const renderPass = new RenderPass(scene, camera);
bloomComposer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.45,   // strength  — was 1.5, now subtle glow only
  0.6,    // radius    — wider spread at lower strength looks more natural
  0.55    // threshold — only very bright pixels bloom (higher = less blooms)
);
bloomComposer.addPass(bloomPass);

// Final composite shader — merges bloom texture + normal render
const finalShader = {
  uniforms: {
    baseTexture:  { value: null },
    bloomTexture: { value: bloomComposer.renderTarget2.texture },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D baseTexture;
    uniform sampler2D bloomTexture;
    varying vec2 vUv;
    void main() {
      // Add bloom on top of the normal scene render
      gl_FragColor = texture2D(baseTexture, vUv) + vec4(texture2D(bloomTexture, vUv).rgb, 0.0);
    }
  `,
};

const finalPass = new ShaderPass(
  new THREE.ShaderMaterial({
    uniforms: finalShader.uniforms,
    vertexShader: finalShader.vertexShader,
    fragmentShader: finalShader.fragmentShader,
    defines: {},
  }),
  'baseTexture'
);
finalPass.needsSwap = true;

// Final composer — renders normal scene + adds bloom on top
const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(renderPass);
finalComposer.addPass(finalPass);

log('Post-processing: selective bloom ready ✓','ok');
log(`Bloom: strength=0.45 radius=0.6 threshold=0.55 (tuned)`,'info');
setBar(6);

// ── Dark material used to hide non-bloom objects during bloom pass
const darkMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
const savedMaterials = new Map();  // mesh → original material

function darkenNonBloomed() {
  // Walk the scene; darken anything NOT on the bloom layer
  scene.traverse(obj => {
    if (obj.isMesh && !obj.layers.test(BLOOM_LAYER)) {
      savedMaterials.set(obj, obj.material);
      obj.material = darkMaterial;
    }
  });
}

function restoreMaterials() {
  savedMaterials.forEach((mat, obj) => { obj.material = mat; });
  savedMaterials.clear();
}

// ── LOADERS ──────────────────────────────────────────────────
const ktx2Loader=new KTX2Loader();
ktx2Loader.setTranscoderPath(BASIS_PATH); ktx2Loader.detectSupport(renderer);
const dracoLoader=new DRACOLoader();
dracoLoader.setDecoderPath(DRACO_PATH); dracoLoader.preload();
const texLoader=new THREE.TextureLoader();
const gltfLoader=new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader); gltfLoader.setKTX2Loader(ktx2Loader);
setBar(8);

// ── TEXTURE HELPERS ──────────────────────────────────────────
const texCache={};
function loadKTX2(path){
  return new Promise(r=>{
    if(texCache[path]){r(texCache[path]);return;}
    ktx2Loader.load(path,t=>{texCache[path]=t;r(t);},undefined,
      ()=>{const p=path.replace('.ktx2','.png');texLoader.load(p,t=>{texCache[path]=t;r(t);},undefined,()=>r(null));});
  });
}
function loadPNG(path){
  return new Promise(r=>{
    if(texCache[path]){r(texCache[path]);return;}
    texLoader.load(path,t=>{texCache[path]=t;r(t);},undefined,()=>r(null));
  });
}
function loadBasis(path){
  return new Promise(r=>{
    if(texCache[path]){r(texCache[path]);return;}
    ktx2Loader.load(path,t=>{texCache[path]=t;r(t);},undefined,()=>r(null));
  });
}
function applyMat(meshMap,name,material){
  const t=meshMap[name];if(!t)return false;
  t.traverse(o=>{if(o.isMesh)o.material=material;});return true;
}
function bakedMat(tex){tex.flipY=false;tex.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:tex});}
function screenMat(tex){tex.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:tex});}
function videoMat(src){
  const v=document.createElement('video');
  v.src=src;v.loop=true;v.muted=true;v.playsInline=true;v.crossOrigin='anonymous';v.play().catch(()=>{});
  const t=new THREE.VideoTexture(v);t.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({map:t});
}
function cycleScreens(target,textures,intervalMs){
  if(!textures.length)return;let idx=0;
  const set=()=>{const m=new THREE.MeshBasicMaterial({map:textures[idx]});target.traverse(o=>{if(o.isMesh)o.material=m;});};
  set();if(textures.length<2)return;
  return setInterval(()=>{idx=(idx+1)%textures.length;set();},intervalMs);
}

// ── MATERIAL DATA ────────────────────────────────────────────
const BAKED=[
  ['ramenShopJoined',    './textures/baked/ramenShopBaked1024.ktx2'],
  ['machinesJoined',     './textures/baked/machinesBaked1024.ktx2' ],
  ['floor',              './textures/baked/floorBaked1024.ktx2'    ],
  ['miscJoined',         './textures/baked/miscBaked1024.ktx2'     ],
  ['graphicsJoined',     './textures/baked/graphicsBaked512.ktx2'  ],
  ['jesseZhouJoined',    './textures/baked/ramenShopBaked1024.ktx2'],
  ['chinese',            './textures/baked/ramenShopBaked1024.ktx2'],
  ['easelFrontGraphic',  './textures/baked/ramenShopBaked1024.ktx2'],
  ['vendingMachineLight','./textures/baked/machinesBaked1024.ktx2' ],
  ['arcadeRim',          './textures/baked/machinesBaked1024.ktx2' ],
  ['arcadeToken',        './textures/baked/machinesBaked1024.ktx2' ],
  ['dishStand',          './textures/baked/ramenShopBaked1024.ktx2'],
];
const COLORS=[
  ['projectsRed',0xe8003c],['projectsWhite',0xffffff],
  ['aboutMeBlue',0x00cfff],['aboutMeBlack',0x111111],
  ['articlesRed',0xff4400],['articlesWhite',0xffffff],
  ['creditsOrange',0xff8800],['creditsBlack',0x111111],
  ['jZhouPink',0xff44aa],['jZhouBlack',0x111111],
  ['greenSignSquare',0x00cc44],['greenLED',0x00ff44],
  ['redLED',0xff2200],['yellowRightLight',0xffee00],['whiteButton',0xffffff],
];
const MATCAPS=[
  [['neonBlue'],                                           './textures/matcaps/neonBlueMatCap.ktx2', null],
  [['neonGreen'],                                          './textures/matcaps/neonGreenMatCap.ktx2',null],
  [['neonPink','neonYellow'],                              './textures/matcaps/neonBlueMatCap.ktx2', null],
  [['fan1','fan2'],                                        './textures/matcaps/fanMatCap.ktx2',       null],
  [['dish'],                                               './textures/matcaps/dishMatCap.ktx2',      null],
  [['lampLights'],                                         null,'./textures/matcaps/lightMatcap.png'      ],
  [['storageLight','portalLight','blueLights','poleLight'],'./textures/matcaps/neonBlueMatCap.ktx2', null],
];
const VIDEO_SCREENS=[
  ['littleTVScreen','./textures/videosTextures/littleTVScreen.mp4'],
  ['tallScreen',    './textures/videosTextures/tallScreen.mp4'    ],
  ['tvScreen',      './textures/videosTextures/tvScreen.mp4'      ],
  ['smallScreen3',  './textures/videosTextures/smallScreen3.mp4'  ],
  ['smallScreen4',  './textures/videosTextures/smallScreen4.mp4'  ],
  ['smallScreen5',  './textures/videosTextures/smallScreen5.mp4'  ],
];
const SIDE_PATHS=['sideScreen1','sideScreen2','sideScreen3'].map(n=>`./textures/screens/sideScreens/${n}.ktx2`);
const SMALL1_PATHS=[1,2,3,4,5].map(i=>`./textures/screens/smallScreen1/${i}.basis`);
const SMALL2_PATHS=[1,2,3,4,5].map(i=>`./textures/screens/smallScreen2/${i}.basis`);

const SCREEN_TEX={};
const SCREEN_LOAD_LIST=[
  ['bigScreenDefault',     './textures/screens/aboutMeScreens/bigScreenDefault.ktx2'           ],
  ['vendingDefault',       './textures/screens/vendingMachineScreens/vendingMachineDefault.ktx2'],
  ['arcadeDefault',        './textures/screens/arcadeScreens/arcadeScreenDefault.ktx2'          ],
  ['easelTouch',           './textures/screens/easel/easelTouch.ktx2'                           ],
  ['bigScreenAbout',       './textures/screens/aboutMeScreens/bigScreenAbout.ktx2'              ],
  ['bigScreenAboutMobile', './textures/screens/aboutMeScreens/bigScreenAboutMobile.ktx2'        ],
  ['bigScreenSkills',      './textures/screens/aboutMeScreens/bigScreenSkills.ktx2'             ],
  ['bigScreenSkillsMobile','./textures/screens/aboutMeScreens/bigScreenSkillsMobile.ktx2'       ],
  ['bigScreenExperience',  './textures/screens/aboutMeScreens/bigScreenExperience.ktx2'         ],
  ['bigScreenExpMobile',   './textures/screens/aboutMeScreens/bigScreenExperienceMobile.ktx2'   ],
  ['vendingMenu',          './textures/screens/vendingMachineScreens/vendingMachineMenu.ktx2'   ],
  ['project1',             './textures/screens/vendingMachineScreens/project1.ktx2'             ],
  ['project2',             './textures/screens/vendingMachineScreens/project2.ktx2'             ],
  ['project3',             './textures/screens/vendingMachineScreens/project3.ktx2'             ],
  ['project4',             './textures/screens/vendingMachineScreens/project4.ktx2'             ],
  ['project5',             './textures/screens/vendingMachineScreens/project5.ktx2'             ],
  ['project6',             './textures/screens/vendingMachineScreens/project6.ktx2'             ],
  ['project7',             './textures/screens/vendingMachineScreens/project7.ktx2'             ],
  ['project8',             './textures/screens/vendingMachineScreens/project8.ktx2'             ],
  ['arcadeCredits',        './textures/screens/arcadeScreens/arcadeScreenCredits.ktx2'          ],
  ['arcadeThanks',         './textures/screens/arcadeScreens/arcadeScreenThanks.ktx2'           ],
];

let meshMap={};
function setScreen(meshName,texKey){
  const tex=SCREEN_TEX[texKey];if(!tex)return;
  applyMat(meshMap,meshName,screenMat(tex));

function buildSubnav(tabs){
  subnavEl.innerHTML='';
  subnavEl.style.setProperty('--sub-color',tabs.color||'#00cfff');
  tabs.buttons.forEach((btn,i)=>{
    const el=document.createElement('button');
    el.textContent=btn.label;
    if(i===0)el.classList.add('active');
    el.addEventListener('click',()=>{
      subnavEl.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      el.classList.add('active'); btn.action();
    });
    subnavEl.appendChild(el);
  });
  subnavEl.classList.add('visible');
  if(tabs.buttons[0])tabs.buttons[0].action();
}
function hideSubnav(){subnavEl.classList.remove('visible');subnavEl.innerHTML='';}

  articles:{camPos:new THREE.Vector3(-0.60,7.94,11.76),target:new THREE.Vector3(-0.00,2.00,-2.00),label:'📰 ARTICLES',color:'#ff4400',minPolar:Math.PI*0.2,   maxPolar:Math.PI*0.6, minAzi:-0.5,     maxAzi:0.5,      minDist:3, maxDist:18, onArrive:activateArticles},

let currentMode='home',isTransitioning=false;
function flyTo(viewKey){
  if(isTransitioning||currentMode===viewKey)return;
  isTransitioning=true; controls.enabled=false;
  const view=VIEWS[viewKey];
  const pp={x:camera.position.x,y:camera.position.y,z:camera.position.z};
  const tp={x:controls.target.x,y:controls.target.y,z:controls.target.z};
  gsap.to(pp,{x:view.camPos.x,y:view.camPos.y,z:view.camPos.z,duration:1.8,ease:'power2.inOut',
    onUpdate(){camera.position.set(pp.x,pp.y,pp.z);}});
  gsap.to(tp,{x:view.target.x,y:view.target.y,z:view.target.z,duration:1.8,ease:'power2.inOut',
    onUpdate(){controls.target.set(tp.x,tp.y,tp.z);controls.update();},
    onComplete(){
      controls.minPolarAngle=view.minPolar; controls.maxPolarAngle=view.maxPolar;
      controls.minAzimuthAngle=view.minAzi; controls.maxAzimuthAngle=view.maxAzi;
      controls.minDistance=view.minDist; controls.maxDistance=view.maxDist;
      controls.enabled=true; isTransitioning=false; currentMode=viewKey;
      modeEl.textContent=view.label; modeEl.style.color=view.color;
      backBtn.style.display=viewKey==='home'?'none':'block';
      if(view.onArrive)view.onArrive();
    }
  });
  modeEl.textContent=view.label; modeEl.style.color=view.color;
}
window.goHome=function(){
  if(isTransitioning)return;
  currentMode='temp'; flyTo('home');
  setTimeout(()=>{
    controls.minPolarAngle=VIEWS.home.minPolar; controls.maxPolarAngle=VIEWS.home.maxPolar;
    controls.minAzimuthAngle=VIEWS.home.minAzi; controls.maxAzimuthAngle=VIEWS.home.maxAzi;
    controls.minDistance=VIEWS.home.minDist; controls.maxDistance=VIEWS.home.maxDist;
    backBtn.style.display='none';
  },2000);
};

// ── RAYCASTER ────────────────────────────────────────────────
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let clickableMeshes=[];
const CLICK_MAP={
  'projectsRed':'projects','projectsWhite':'projects',
  'aboutMeBlue':'aboutMe','aboutMeBlack':'aboutMe',
  'articlesRed':'articles','articlesWhite':'articles',
  'creditsOrange':'credits','creditsBlack':'credits',
  'vendingMachineScreen':'projects','bigScreen':'aboutMe',
  'arcadeScreen':'credits','sideScreen':'articles',
};
function onDown(e){pointer._dx=e.touches?e.touches[0].clientX:e.clientX;pointer._dy=e.touches?e.touches[0].clientY:e.clientY;}
function onUp(e){
  if(isTransitioning)return;
  const cx=e.changedTouches?e.changedTouches[0].clientX:e.clientX;
  const cy=e.changedTouches?e.changedTouches[0].clientY:e.clientY;
  if(Math.abs(cx-(pointer._dx||0))>8||Math.abs(cy-(pointer._dy||0))>8)return;
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((cx-rect.left)/rect.width)*2-1;
  pointer.y=-((cy-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(clickableMeshes,false);
  if(hits.length){
    const name=hits[0].object.userData.clickName||hits[0].object.name;
    const vk=CLICK_MAP[name];
    if(vk){flyTo(vk);}
  }
}
renderer.domElement.addEventListener('pointerdown',onDown);
renderer.domElement.addEventListener('pointerup',onUp);
renderer.domElement.addEventListener('touchstart',onDown,{passive:true});
renderer.domElement.addEventListener('touchend',onUp,{passive:true});

// ── HOLOGRAM SHADER ──────────────────────────────────────────
const holoVertexShader=`
  varying vec3 vPosition;
  varying vec3 vNormal;
  void main(){
    vec4 modelPosition=modelMatrix*vec4(position,1.0);
    vPosition=modelPosition.xyz;
    vNormal=normalize(normalMatrix*normal);
    gl_Position=projectionMatrix*viewMatrix*modelPosition;
  }
`;
const holoFragmentShader=`
  uniform float uTime;
  uniform vec3  uColor;
  uniform float uLineCount;
  uniform float uLineSpeed;
  uniform float uFresnelPow;
  uniform float uOpacityMin;
  uniform float uOpacityMax;
  varying vec3 vPosition;
  varying vec3 vNormal;
  void main(){
    float scanLine=fract(vPosition.y*uLineCount+uTime*uLineSpeed);
    float line=step(0.85,scanLine);
    float fresnel=dot(vNormal,vec3(0.0,0.0,1.0));
    fresnel=clamp(fresnel,0.0,1.0);
    float rim=pow(1.0-fresnel,uFresnelPow);
    float pulse=sin(uTime*1.5)*0.5+0.5;
    float alpha=mix(uOpacityMin,uOpacityMax,pulse);
    float glitch=abs(sin(uTime*40.0));
    glitch=step(0.98,glitch)*0.4;
    float intensity=rim*0.6+line*0.4;
    float finalAlpha=clamp((alpha*intensity)+glitch,0.0,1.0);
    vec3 color=uColor*(rim+line*0.5+0.1);
    gl_FragColor=vec4(color,finalAlpha);
  }
`;
const holoUniforms={
  uTime:{value:0.0},
  uColor:{value:new THREE.Color(0x00eeff)},
  uLineCount:{value:80.0},
  uLineSpeed:{value:1.2},
  uFresnelPow:{value:2.0},
  uOpacityMin:{value:0.15},
  uOpacityMax:{value:0.85},
};
const holoMaterial=new THREE.ShaderMaterial({
  vertexShader:holoVertexShader,
  fragmentShader:holoFragmentShader,
  uniforms:holoUniforms,
  transparent:true,
  depthWrite:false,
  side:THREE.DoubleSide,
  blending:THREE.AdditiveBlending,
});

// ── MAIN LOAD ────────────────────────────────────────────────
log('Fetching ramenShop.gltf …','pending');
fetch(GLTF_SHOP)
  .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text();})
  .then(()=>{log('Shop GLTF reachable ✓','ok');setBar(10);loadShop();})
  .catch(err=>{log('FETCH FAILED: '+err.message,'err');setStatus('Error ❌','#ff5f5f');});

function loadShop(){
  gltfLoader.load(GLTF_SHOP,async(gltf)=>{
    log('Shop GLTF parsed ✓','ok'); setBar(20);
    const model=gltf.scene;
    model.traverse(o=>{if(o.name)meshMap[o.name]=o;});

    const bbox=new THREE.Box3().setFromObject(model);
    const center=bbox.getCenter(new THREE.Vector3());
    const size=bbox.getSize(new THREE.Vector3());
    model.position.x-=center.x; model.position.z-=center.z; model.position.y-=bbox.min.y;
    model.traverse(c=>{if(c.isMesh){c.receiveShadow=true;c.castShadow=false;}});
    scene.add(model);

    const sh=size.y;
    mshBox.position.set(0,sh+3.5,0);
    spotLight1.position.set(5,sh+14,8); spotLight2.position.set(0,sh+14,6); spotLight3.position.set(-5,sh+14,8);
    log(`Shop: ${size.x.toFixed(1)}×${sh.toFixed(1)}×${size.z.toFixed(1)}`,'info');
    setBar(24);

    Object.keys(CLICK_MAP).forEach(name=>{
      const obj=meshMap[name];if(!obj)return;
      obj.traverse(o=>{if(o.isMesh){o.userData.clickName=name;clickableMeshes.push(o);}});
    });

    // Baked
    for(const[name,ktx2]of BAKED){
      const tex=await loadKTX2(ktx2);if(!tex)continue;
      applyMat(meshMap,name,bakedMat(tex));
    }
    fillLight.intensity=0.0; setBar(40);

    // Colours
    for(const[name,hex]of COLORS)applyMat(meshMap,name,new THREE.MeshBasicMaterial({color:hex}));
    setBar(46);

    // Matcaps
    for(const[names,ktx2,png]of MATCAPS){
      const tex=ktx2?await loadKTX2(ktx2):await loadPNG(png);if(!tex)continue;
      const mat=new THREE.MeshMatcapMaterial({matcap:tex});
      names.forEach(n=>applyMat(meshMap,n,mat));
    }
    setBar(54);

    // ── Assign bloom layer to neon/glow meshes ──────────────
    // Must happen AFTER matcap materials are set so the right
    // meshes are already bright before we bloom them
    log('── Assigning bloom layer ──','head');
    let bloomCount=0;
    BLOOM_MESHES.forEach(name=>{
      const obj=meshMap[name];if(!obj)return;
      obj.traverse(o=>{
        if(o.isMesh){
          o.layers.enable(1);  // layer 1 = BLOOM_LAYER
          bloomCount++;
        }
      });
      log(`  ✓ bloom layer → ${name}`,'ok');
    });
    log(`${bloomCount} meshes on bloom layer`,'ok');
    setBar(60);

    // Video + small screens
    for(const[name,src]of VIDEO_SCREENS)applyMat(meshMap,name,videoMat(src));
    const s1=(await Promise.all(SMALL1_PATHS.map(loadBasis))).filter(Boolean);
    s1.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;});
    if(meshMap['smallScreen1']&&s1.length)cycleScreens(meshMap['smallScreen1'],s1,2000);
    const s2=(await Promise.all(SMALL2_PATHS.map(loadBasis))).filter(Boolean);
    s2.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;});
    if(meshMap['smallScreen2']&&s2.length)cycleScreens(meshMap['smallScreen2'],s2,2000);
    setBar(65);

    // Screen textures
    const sideTex=[];
    for(const p of SIDE_PATHS){
      const tex=await loadKTX2(p);
      if(tex){tex.colorSpace=THREE.SRGBColorSpace;SCREEN_TEX[p.split('/').pop().replace('.ktx2','')]=tex;sideTex.push(tex);}
    }
    if(meshMap['sideScreen']&&sideTex.length)sideInterval=cycleScreens(meshMap['sideScreen'],sideTex,3000);

    let loaded=0;
    for(const[key,path]of SCREEN_LOAD_LIST){
      const tex=await loadKTX2(path);
      if(tex){tex.colorSpace=THREE.SRGBColorSpace;SCREEN_TEX[key]=tex;loaded++;}
      setBar(65+Math.round((loaded/SCREEN_LOAD_LIST.length)*15));
    }

    setScreen('bigScreen','bigScreenDefault');
    setScreen('vendingMachineScreen','vendingDefault');
    setScreen('arcadeScreen','arcadeDefault');
    if(SCREEN_TEX['easelTouch'])applyMat(meshMap,'easelFrontGraphic',screenMat(SCREEN_TEX['easelTouch']));
    setBar(82);

    loadHologram(sh);
  },
  (xhr)=>{if(xhr.total)setBar(10+Math.round((xhr.loaded/xhr.total)*10));},
  (err)=>{log('Shop error: '+(err?.message||err),'err');setStatus('Error ❌','#ff5f5f');}
  );
}

function loadHologram(shopHeight){
  log('── Step 7+8: ramenHologram.gltf ──','head');
  gltfLoader.load(GLTF_HOLO,(gltf)=>{
    const holo=gltf.scene;
    const rawBox=new THREE.Box3().setFromObject(holo);
    const rawSize=rawBox.getSize(new THREE.Vector3());
    const scaleFactor=2.5/rawSize.x;
    holo.scale.setScalar(scaleFactor);

    const scaledBox=new THREE.Box3().setFromObject(holo);
    const scaledCenter=scaledBox.getCenter(new THREE.Vector3());
    const scaledSize=scaledBox.getSize(new THREE.Vector3());
    holo.position.x-=scaledCenter.x;
    holo.position.y=7.8-scaledBox.min.y*scaleFactor;
    holo.position.z=-1.0;

    // Apply hologram shader AND put on bloom layer so it glows
    holo.traverse(child=>{
      if(child.isMesh){
        child.material=holoMaterial;
        child.layers.enable(1);   // hologram blooms too
        child.castShadow=false;
        child.receiveShadow=false;
      }
    });

    scene.add(holo);
    window._holoScene=holo;

    log(`Hologram: ${scaledSize.x.toFixed(2)}×${scaledSize.y.toFixed(2)}×${scaledSize.z.toFixed(2)} — blooming ✓`,'ok');
    setBar(100);
    summaryEl.textContent='Steps 1–8 complete · Selective bloom live · Hologram blooming';
    setStatus('✅ Step 8 complete — Bloom live','#4eca8b');
    log('▶ STEP 8 COMPLETE — Selective bloom active','ok');
    log(`Blooming: ${BLOOM_MESHES.length} neon meshes + hologram`,'info');

    setTimeout(()=>{
      hideAll();
      document.getElementById('hint').textContent=
        'Click: Projects · About Me · Articles · Credits  |  Neons + hologram glowing';
    },3000);
  },
  undefined,
  (err)=>{
    log('Hologram error: '+(err?.message||err),'err');
    setBar(100); setStatus('⚠️ Hologram failed — bloom OK','#f0c060');
  });
}

// ── SPOTLIGHT TWEENS ─────────────────────────────────────────
function tweenSpot(l){
  new TWEEN.Tween(l).to({angle:(Math.random()*0.7)+0.1,penumbra:Math.random()+1},Math.random()*3000+2000).easing(TWEEN.Easing.Quadratic.Out).start();
  const bY=l.position.y;
  new TWEEN.Tween(l.position).to({x:(Math.random()*16)-8,y:bY+(Math.random()*4)-2,z:(Math.random()*16)-8},Math.random()*3000+2000).easing(TWEEN.Easing.Quadratic.Out).start();
}
function updateTweens(){tweenSpot(spotLight1);tweenSpot(spotLight2);tweenSpot(spotLight3);setTimeout(updateTweens,5000);}

// ── COORD DEBUG ──────────────────────────────────────────────
let showCoords=true;
coordEl.addEventListener('click',()=>{showCoords=!showCoords;coordEl.style.opacity=showCoords?'1':'0.2';});

// ── RENDER LOOP ───────────────────────────────────────────────
const clock=new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime();
  holoUniforms.uTime.value=t;
  if(window._holoScene){
    window._holoScene.rotation.y=t*0.4;
    window._holoScene.position.y=7.8+Math.sin(t*1.2)*0.08;
  }
  TWEEN.update(); controls.update();
  lh1.update(); lh2.update(); lh3.update();

  // ── SELECTIVE BLOOM RENDER ──────────────────────────────
  // 1. Darken everything not on bloom layer
  darkenNonBloomed();
  // 2. Render bloom pass into off-screen target
  bloomComposer.render();
  // 3. Restore all original materials
  restoreMaterials();
  // 4. Render final scene + add bloom texture on top
  finalComposer.render();

  if(showCoords){
    const p=camera.position,ct=controls.target;
    coordEl.innerHTML=
      `<span style="color:#adf">cam</span> ${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}<br>`+
      `<span style="color:#fa0">tgt</span> ${ct.x.toFixed(2)} ${ct.y.toFixed(2)} ${ct.z.toFixed(2)}<br>`+
      `<span style="color:#555">${currentMode}</span>`;
  }
})();

updateTweens();
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  bloomComposer.setSize(innerWidth,innerHeight);
  finalComposer.setSize(innerWidth,innerHeight);
});
</script>
