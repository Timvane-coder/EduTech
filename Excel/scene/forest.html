<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Solo Mode Viewer</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #14161a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #canvas-wrap { position: absolute; inset: 0; }
  canvas { display: block; }

  #panel {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 250px;
    max-height: calc(100% - 24px);
    background: rgba(20, 22, 26, 0.88);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: #e8e8ea;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  #panel-header {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #status {
    font-size: 11px;
    color: #9aa0a6;
    font-weight: 400;
  }
  #node-list {
    overflow-y: auto;
    padding: 6px;
  }
  .node-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: #cfd2d6;
    user-select: none;
    transition: background 0.12s;
  }
  .node-item:hover {
    background: rgba(255,255,255,0.06);
  }
  .node-item.active {
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-weight: 600;
  }
  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .node-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #clear-btn {
    margin: 8px;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04);
    color: #e8e8ea;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
  }
  #clear-btn:hover { background: rgba(255,255,255,0.1); }

  #tooltip {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(20,22,26,0.88);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 8px 12px;
    color: #e8e8ea;
    font-size: 12px;
    z-index: 10;
    max-width: 260px;
  }
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfd2d6;
    font-size: 14px;
    z-index: 20;
    flex-direction: column;
    gap: 10px;
  }
  #error-box {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
  }
  #error-box .box {
    background: #241417;
    border: 1px solid #5a2a2f;
    color: #ffb4bb;
    padding: 16px 20px;
    border-radius: 8px;
    max-width: 480px;
    font-size: 13px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="panel">
  <div id="panel-header">
    <span>Isolate Mode</span>
    <span id="status">loading…</span>
  </div>
  <div id="node-list"></div>
  <div id="clear-btn">Clear Selection</div>
</div>

<div id="tooltip" style="display:none;"></div>

<div id="loading">
  <div>Loading scene.gltf…</div>
</div>

<div id="error-box">
  <div class="box" id="error-text"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// -----------------------------
// Config: the node names we care about (highlight targets), in order
// -----------------------------
const TARGET_NODE_NAMES = [
"Sketchfab_Scene",
"Sketchfab_model",
"sketchfabTempfbx",
"RootNode",
"Stereo_textured_mesh",
"cluster_00", 
"cluster_01", 
"cluster_02", 
"cluster_03", 
"cluster_04", 
"cluster_05", 
"cluster_06", 
"cluster_07", 
"cluster_08", 
"cluster_09", 
"cluster_10", 
"cluster_11", 
"cluster_12", 
"cluster_13", 
"cluster_14", 
"cluster_15", 
"cluster_16", 
"cluster_17", 
"cluster_18", 
"cluster_19", 
"cluster_20", 
"cluster_21", 
"cluster_22", 
"cluster_23", 
"cluster_24", 
"cluster_25", 
"cluster_26", 
"cluster_27"
];

// -----------------------------
// Renderer / Scene / Camera
// -----------------------------
const wrap = document.getElementById("canvas-wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 5000);
camera.position.set(3, 2, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const hemi = new THREE.HemisphereLight(0xffffff, 0x33353a, 1.1);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(5, 10, 7);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.5);
dir2.position.set(-5, -3, -5);
scene.add(dir2);

// -----------------------------
// Color palette (used only for the UI swatches, not applied to meshes)
// -----------------------------
function colorForIndex(i, total) {
  const hue = (i / Math.max(total, 1)) % 1;
  const c = new THREE.Color();
  c.setHSL(hue, 0.65, 0.55);
  return c;
}

// -----------------------------
// State
// -----------------------------
const meshEntries = [];      // { name, node (Object3D), meshes: [Mesh...] }
let selectedName = null;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// -----------------------------
// UI helpers
// -----------------------------
const nodeListEl = document.getElementById("node-list");
const statusEl = document.getElementById("status");
const tooltipEl = document.getElementById("tooltip");
const loadingEl = document.getElementById("loading");
const errorBoxEl = document.getElementById("error-box");
const errorTextEl = document.getElementById("error-text");
const clearBtn = document.getElementById("clear-btn");

function showError(msg) {
  loadingEl.style.display = "none";
  errorBoxEl.style.display = "flex";
  errorTextEl.textContent = msg;
}

function buildPanel() {
  nodeListEl.innerHTML = "";
  meshEntries.forEach((entry, i) => {
    const item = document.createElement("div");
    item.className = "node-item";
    item.dataset.name = entry.name;

    const sw = document.createElement("div");
    sw.className = "swatch";
    sw.style.background = "#" + entry.color.getHexString();

    const label = document.createElement("div");
    label.className = "node-label";
    label.textContent = entry.name;

    item.appendChild(sw);
    item.appendChild(label);
    item.addEventListener("click", () => selectByName(entry.name));

    nodeListEl.appendChild(item);
  });
}

function refreshActiveUI() {
  document.querySelectorAll(".node-item").forEach(el => {
    el.classList.toggle("active", el.dataset.name === selectedName);
  });
  if (selectedName) {
    tooltipEl.style.display = "block";
    tooltipEl.textContent = selectedName;
  } else {
    tooltipEl.style.display = "none";
  }
}

// -----------------------------
// Apply visual state: original materials/textures are always used.
// If nothing is selected, everything is visible. If something is selected,
// only that node's meshes stay visible; everything else is hidden.
// -----------------------------
function applyVisualState() {
  meshEntries.forEach(entry => {
    const isSelected = entry.name === selectedName;
    const visible = (selectedName === null) || isSelected;
    entry.meshes.forEach(mesh => {
      mesh.visible = visible;
    });
  });
}

function selectByName(name) {
  selectedName = (selectedName === name) ? null : name;
  applyVisualState();
  refreshActiveUI();
}

clearBtn.addEventListener("click", () => {
  selectedName = null;
  applyVisualState();
  refreshActiveUI();
});

// -----------------------------
// Load the GLTF
// -----------------------------
const loader = new GLTFLoader();

loader.load(
  "./test_node2_clustered.glb",
  (gltf) => {
    loadingEl.style.display = "none";
    const root = gltf.scene;
    scene.add(root);

    // Collect, for each target node name, the meshes under it.
    // If a target name doesn't correspond to a node with meshes beneath it
    // (e.g. pure group/transform nodes with no geometry), it will simply
    // have an empty mesh list and won't visually do anything when clicked,
    // but will still appear in the UI for completeness.
    const nameSet = new Set(TARGET_NODE_NAMES);
    const foundNames = new Set();

    root.traverse(obj => {
      if (nameSet.has(obj.name)) {
        foundNames.add(obj.name);
      }
    });

    // Build entries in the requested order, only for names actually found in the scene.
    // For nodes that are containers, gather all descendant meshes not already
    // claimed by a more specific (deeper) named node in our target list.
    const claimedMeshes = new Set();

    // Sort target names so deeper/more specific nodes get first claim on meshes.
    // We approximate specificity by traversal depth.
    const depthOf = new Map();
    root.traverse(obj => {
      let d = 0, p = obj;
      while (p.parent) { d++; p = p.parent; }
      depthOf.set(obj, d);
    });

    const nodesFound = [];
    root.traverse(obj => {
      if (nameSet.has(obj.name)) {
        nodesFound.push(obj);
      }
    });
    nodesFound.sort((a, b) => (depthOf.get(b) || 0) - (depthOf.get(a) || 0));

    const nodeToMeshes = new Map();
    nodesFound.forEach(node => {
      const meshes = [];
      node.traverse(child => {
        if (child.isMesh && !claimedMeshes.has(child)) {
          meshes.push(child);
          claimedMeshes.add(child);
        }
      });
      nodeToMeshes.set(node, meshes);
    });

    // Now build meshEntries in original TARGET_NODE_NAMES order
    let colorIndex = 0;
    const total = TARGET_NODE_NAMES.length;

    TARGET_NODE_NAMES.forEach(name => {
      const node = nodesFound.find(n => n.name === name);
      const meshes = node ? (nodeToMeshes.get(node) || []) : [];
      const color = colorForIndex(colorIndex, total);
      colorIndex++;

      meshes.forEach(mesh => {
        mesh.userData.__soloName = name;
      });

      meshEntries.push({
        name,
        node,
        meshes,
        color
      });
    });

    buildPanel();
    applyVisualState();

    statusEl.textContent = `${meshEntries.filter(e => e.meshes.length).length}/${meshEntries.length} nodes`;

    // Frame camera to fit the whole scene
    const box = new THREE.Box3().setFromObject(root);
    if (!box.isEmpty()) {
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const dist = maxDim * 1.6;
      camera.position.set(center.x + dist * 0.6, center.y + dist * 0.5, center.z + dist * 0.8);
      camera.near = maxDim / 1000;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.update();
    }
  },
  (xhr) => {
    if (xhr.total) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      loadingEl.querySelector("div").textContent = `Loading scene.gltf… ${pct}%`;
    }
  },
  (err) => {
    console.error(err);
    showError(
      "Failed to load scene.gltf.\n\n" +
      "Make sure this HTML file is in the same folder as scene.gltf (and its .bin / textures), " +
      "and that you're viewing it via a local web server (not double-clicked as a file), " +
      "since browsers block GLTF loading over file:// due to CORS restrictions.\n\n" +
      "Try: python3 -m http.server, then open http://localhost:8000/solo-viewer.html\n\n" +
      "Error: " + (err && err.message ? err.message : err)
    );
  }
);

// -----------------------------
// Click-to-select via raycasting
// -----------------------------
function onClick(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const allMeshes = meshEntries.flatMap(e => e.meshes).filter(m => m.visible);
  const hits = raycaster.intersectObjects(allMeshes, false);

  if (hits.length > 0) {
    const hit = hits[0].object;
    const name = hit.userData.__soloName;
    if (name) selectByName(name);
  }
}
renderer.domElement.addEventListener("click", onClick);

// -----------------------------
// Resize
// -----------------------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// -----------------------------
// Render loop
// -----------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
