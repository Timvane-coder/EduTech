<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Three.js Portfolio Capture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070b; }
    canvas { display: block; }
    #start {
      position: fixed; z-index: 10; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 28px; border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px; background: rgba(10,12,18,.75); color: white;
      font: 600 15px system-ui; cursor: pointer; backdrop-filter: blur(8px);
    }
    #hud {
      position: fixed; z-index: 5; left: 20px; bottom: 18px;
      color: rgba(255,255,255,.72); font: 12px system-ui;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <button id="start">START ORBIT</button>
  <div id="hud">Three.js • cinematic orbit • bloom • lights</div>
  <script type="module" src="/default.js"></script>
</body>
</html>
