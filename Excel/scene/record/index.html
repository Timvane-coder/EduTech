<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>three.js webgl - lights - physical lights</title>

    <style>

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #101018;

        }

        canvas {

            display: block;

        }

        button {

            border: none;

            border-radius: 4px;

        }

        #info {

            position: absolute;
            top: 0;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;

            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 13px;
            line-height: 1.5;

            pointer-events: none;
            z-index: 1;

        }

        #info a {

            color: #ffee88;
            pointer-events: auto;

        }

    </style>

</head>

<body>

    <div id="container"></div>
    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Physically accurate incandescent bulb by <a href="http://clara.io" target="_blank" rel="noopener">Ben Houston</a><br />
        Real world scale: Brick cube is 50 cm in size. Globe is 50 cm in diameter.<br />
        Reinhard inline tonemapping with real-world light falloff (decay = 2).
    </div>

    <script
        type="module"
        src="/main.js"
    ></script>

</body>

</html>
