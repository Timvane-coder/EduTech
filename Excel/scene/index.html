<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fragment Inspector</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #14161a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #canvas-wrap { position: absolute; inset: 0; }
  canvas { display: block; }

  #panel {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 300px;
    max-height: calc(100% - 24px);
    background: rgba(20, 22, 26, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: #e8e8ea;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(6px);
    z-index: 10;
    overflow-y: auto;
    padding: 14px;
    gap: 12px;
    font-size: 12px;
  }

  h1 { font-size: 14px; font-weight: 600; margin: 0 0 2px 0; }
  .sub { font-size: 11px; color: #9aa0a6; }

  .field-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #9aa0a6; }

  select {
    background: #0e1013;
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8e8ea;
    padding: 8px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
  }
  select:focus { outline: none; border-color: #4f9cff; }

  .index-row { display: flex; gap: 6px; align-items: center; }
  input[type="number"] {
    background: #0e1013;
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8e8ea;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 16px;
    font-family: 'SF Mono', Consolas, Monaco, monospace;
    width: 90px;
    text-align: center;
  }
  input[type="number"]:focus { outline: none; border-color: #4f9cff; }

  .nav-btn, .action-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8e8ea;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .nav-btn:hover, .action-btn:hover { background: rgba(255,255,255,0.12); }

  #frag-info {
    font-family: 'SF Mono', Consolas, Monaco, monospace;
    font-size: 11px;
    color: #9aa0a6;
    background: #0e1013;
    border-radius: 6px;
    padding: 10px;
    line-height: 1.6;
  }
  #frag-info .row { display: flex; justify-content: space-between; gap: 8px; }
  #frag-info .row span:last-child { color: #e8e8ea; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .label-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .label-btn {
    padding: 10px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: #e8e8ea;
    font-size: 12px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .label-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .label-btn:hover { border-color: rgba(255,255,255,0.3); }
  .label-btn.active { border-color: #4f9cff; background: rgba(79,156,255,0.15); }

  #progress-bar-track { height: 5px; background: #0e1013; border-radius: 3px; overflow: hidden; }
  #progress-bar-fill { height: 100%; background: #3ecf8e; width: 0%; }
  #progress-text { font-size: 11px; color: #9aa0a6; display: flex; justify-content: space-between; }

  #status { font-size: 11px; color: #9aa0a6; min-height: 14px; }
  #status.error { color: #ff6b6b; }
  #status.ok { color: #3ecf8e; }

  .divider { height: 1px; background: rgba(255,255,255,0.08); }

  .toggle-row { display: flex; flex-direction: column; gap: 6px; }
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #e8e8ea;
    cursor: pointer;
  }
  .toggle-label input[type="checkbox"] {
    width: 14px;
    height: 14px;
    accent-color: #4f9cff;
    cursor: pointer;
  }
  #toggle-hint { font-size: 10px; color: #9aa0a6; line-height: 1.4; }

  #jump-unlabeled { background: transparent; border: 1px dashed rgba(255,255,255,0.2); color: #9aa0a6; }

  #hint { font-size: 10px; color: #9aa0a6; line-height: 1.5; }
  kbd { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 3px; padding: 1px 5px; font-family: monospace; font-size: 9px; }

  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #cfd2d6; font-size: 14px; z-index: 20; flex-direction: column; gap: 10px;
  }
  #error-box {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    z-index: 30; padding: 20px;
  }
  #error-box .box {
    background: #241417; border: 1px solid #5a2a2f; color: #ffb4bb;
    padding: 16px 20px; border-radius: 8px; max-width: 480px; font-size: 13px; line-height: 1.5;
    white-space: pre-wrap;
  }

  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="panel">
  <div>
    <h1>Fragment Inspector</h1>
    <div class="sub">Solo-inspection labeling tool</div>
  </div>

  <div class="field-group">
    <label for="cluster-select">Select cluster</label>
    <select id="cluster-select" disabled>
      <option value="">Loading manifest…</option>
    </select>
  </div>

  <div class="divider"></div>

  <div class="field-group">
    <label>Node index within cluster</label>
    <div class="index-row">
      <button class="nav-btn" id="prev-btn">&larr;</button>
      <input type="number" id="index-input" min="0" value="0" />
      <button class="nav-btn" id="next-btn">&rarr;</button>
    </div>
  </div>

  <button class="action-btn" id="jump-unlabeled">Jump to next unlabeled</button>

  <div id="frag-info">
    <div class="row"><span>cluster</span><span id="info-cluster">–</span></div>
    <div class="row"><span>name</span><span id="info-name">–</span></div>
    <div class="row"><span>verts</span><span id="info-verts">–</span></div>
    <div class="row"><span>label</span><span id="info-label">unlabeled</span></div>
  </div>

  <div class="field-group">
    <label>Context — position check</label>
    <div class="toggle-row">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-cluster" />
        Show whole cluster
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-scene" />
        Show whole scene
      </label>
    </div>
    <div id="toggle-hint">Selected fragment stays highlighted; others dim.</div>
  </div>

  <div class="divider"></div>

  <div class="field-group">
    <label>Label this fragment</label>
    <div class="label-grid">
      <button class="label-btn" data-label="terrain"><span class="dot" style="background:#8a7a5c"></span>Terrain</button>
      <button class="label-btn" data-label="rocks"><span class="dot" style="background:#9a9a9a"></span>Rocks</button>
      <button class="label-btn" data-label="vegetation"><span class="dot" style="background:#5cb85c"></span>Vegetation</button>
      <button class="label-btn" data-label="water"><span class="dot" style="background:#4f9cff"></span>Water</button>
      <button class="label-btn" data-label="walls"><span class="dot" style="background:#d97757"></span>Walls</button>
      <button class="label-btn" data-label="discard"><span class="dot" style="background:#ff6b6b"></span>Discard</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="field-group">
    <div id="progress-text">
      <span id="progress-count">0 / 0 labeled</span>
      <span id="progress-pct">0%</span>
    </div>
    <div id="progress-bar-track"><div id="progress-bar-fill"></div></div>
  </div>

  <button class="action-btn" id="export-btn">Export labels JSON</button>
  <button class="action-btn" id="import-btn">Import labels JSON (resume)</button>
  <input type="file" id="import-labels-input" accept=".json" style="display:none" />

  <div id="status"></div>

  <div class="divider"></div>
  <div id="hint">
    <kbd>&larr;</kbd> <kbd>&rarr;</kbd> change index &nbsp;
    <kbd>1</kbd>-<kbd>6</kbd> assign label
  </div>
</div>

<div id="loading">
  <div>Loading fragments…</div>
</div>

<div id="error-box">
  <div class="box" id="error-text"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ── Config ──────────────────────────────────────────────────────────
const GLB_PATH = "./test_node3_fragments_by_cluster.glb";
const MANIFEST_PATH = "./test_node3_fragments_by_cluster_manifest.json";

// ── Renderer / Scene / Camera (same setup as the working viewer) ────
const wrap = document.getElementById("canvas-wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 5000);
camera.position.set(3, 2, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const hemi = new THREE.HemisphereLight(0xffffff, 0x33353a, 1.1);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(5, 10, 7);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.5);
dir2.position.set(-5, -3, -5);
scene.add(dir2);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ── State ───────────────────────────────────────────────────────────
let nameToMesh = {};          // fragment name -> Mesh (every fragment in the GLB)
let manifest = null;          // parsed manifest.json
let labels = {};              // { fragmentName: labelString }
let currentClusterIndex = null;
let currentClusterNames = [];
let currentLocalIndex = 0;

const LABEL_KEYS = { '1': 'terrain', '2': 'rocks', '3': 'vegetation', '4': 'water', '5': 'walls', '6': 'discard' };

const loadingEl = document.getElementById("loading");
const errorBoxEl = document.getElementById("error-box");
const errorTextEl = document.getElementById("error-text");

function showError(msg) {
  loadingEl.style.display = "none";
  errorBoxEl.style.display = "flex";
  errorTextEl.textContent = msg;
}

function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = kind || '';
}

// ── Load GLB (same proven approach as the working viewer) ───────────
const loader = new GLTFLoader();
loader.load(
  GLB_PATH,
  (gltf) => {
    loadingEl.style.display = "none";
    const root = gltf.scene;
    scene.add(root);

    root.traverse(obj => {
      if (obj.isMesh) {
        nameToMesh[obj.name] = obj;
        obj.visible = false; // nothing shown until a cluster+index is picked
      }
    });

    setStatus(`Loaded ${Object.keys(nameToMesh).length} fragments`, 'ok');
    tryPopulateClusterSelect();
  },
  (xhr) => {
    if (xhr.total) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      loadingEl.querySelector("div").textContent = `Loading fragments… ${pct}%`;
    }
  },
  (err) => {
    console.error(err);
    showError(
      "Failed to load " + GLB_PATH + "\n\n" +
      "Make sure this HTML file is served from the same folder as the GLB " +
      "(python3 -m http.server), not opened via file://.\n\n" +
      "Error: " + (err && err.message ? err.message : err)
    );
  }
);

// ── Load manifest ───────────────────────────────────────────────────
fetch(MANIFEST_PATH)
  .then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  })
  .then(data => {
    manifest = data;
    tryPopulateClusterSelect();
  })
  .catch(err => {
    console.error('Manifest load failed:', err);
    setStatus(`Manifest load failed: ${err.message}`, 'error');
  });

function tryPopulateClusterSelect() {
  const sel = document.getElementById('cluster-select');
  if (!manifest || !manifest.clusters) {
    sel.innerHTML = '<option value="">Waiting on manifest…</option>';
    return;
  }
  if (Object.keys(nameToMesh).length === 0) {
    sel.innerHTML = '<option value="">Waiting on GLB…</option>';
    return;
  }
  sel.disabled = false;
  sel.innerHTML = manifest.clusters
    .map(c => `<option value="${c.cluster_index}">Cluster ${String(c.cluster_index).padStart(2, '0')} — ${c.fragment_count} fragments</option>`)
    .join('');
  selectCluster(manifest.clusters[0].cluster_index);
}

function selectCluster(clusterIdx) {
  const entry = manifest.clusters.find(c => c.cluster_index === clusterIdx);
  if (!entry) return;
  currentClusterIndex = clusterIdx;
  currentClusterNames = entry.fragment_names;
  document.getElementById('cluster-select').value = String(clusterIdx);
  document.getElementById('index-input').max = Math.max(0, currentClusterNames.length - 1);
  updateProgressUI();
  showLocalIndex(0);
}

document.getElementById('cluster-select').addEventListener('change', (e) => {
  const idx = parseInt(e.target.value, 10);
  if (!isNaN(idx)) selectCluster(idx);
});

// ── Isolation + camera zoom-to-fragment (+ context toggles) ─────────
const DIM_OPACITY = 0.22;
const dimmedMaterialCache = new WeakMap(); // original material -> dimmed clone
const glowMaterialCache = new WeakMap();   // original material -> emissive-boosted clone

function getDimmedMaterial(mesh) {
  const orig = mesh.material;
  if (dimmedMaterialCache.has(orig)) return dimmedMaterialCache.get(orig);
  const dimmed = orig.clone();
  dimmed.transparent = true;
  dimmed.opacity = DIM_OPACITY;
  dimmed.depthWrite = false;
  dimmedMaterialCache.set(orig, dimmed);
  return dimmed;
}

function getGlowMaterial(mesh) {
  const orig = mesh.material;
  if (glowMaterialCache.has(orig)) return glowMaterialCache.get(orig);
  const glow = orig.clone();
  // Boost emissive so the fragment visually lights up against dimmed
  // neighbors regardless of its original texture/material colors.
  if ('emissive' in glow) {
    glow.emissive = new THREE.Color(0x4f9cff);
    glow.emissiveIntensity = 0.9;
  }
  glowMaterialCache.set(orig, glow);
  return glow;
}

// Bright wireframe outline that tracks the selected fragment -- reads
// clearly even at cluster/scene zoom distances where emissive glow
// alone can still be hard to spot among hundreds of fragments.
const outlineMaterial = new THREE.LineBasicMaterial({
  color: 0x4f9cff,
  linewidth: 2,
  transparent: true,
  opacity: 0.95,
  depthTest: false,
});
let outlineMesh = null;

function updateOutlineForMesh(mesh) {
  if (outlineMesh) {
    scene.remove(outlineMesh);
    outlineMesh.geometry.dispose();
    outlineMesh = null;
  }
  if (!mesh) return;
  const edges = new THREE.EdgesGeometry(mesh.geometry, 20);
  outlineMesh = new THREE.LineSegments(edges, outlineMaterial);
  outlineMesh.renderOrder = 999; // draw on top, ignoring depth, so it's visible through dimmed neighbors
  mesh.updateMatrixWorld(true);
  outlineMesh.applyMatrix4(mesh.matrixWorld);
  scene.add(outlineMesh);
}

function setFragmentAppearance(mesh, mode) {
  // mode: 'selected' | 'selected-glow' | 'dimmed' | 'hidden'
  if (mode === 'hidden') {
    mesh.visible = false;
    return;
  }
  mesh.visible = true;
  if (mode === 'selected') {
    mesh.material = mesh.userData.__origMaterial || mesh.material;
  } else if (mode === 'selected-glow') {
    mesh.userData.__origMaterial = mesh.userData.__origMaterial || mesh.material;
    mesh.material = getGlowMaterial(mesh);
  } else {
    mesh.userData.__origMaterial = mesh.userData.__origMaterial || mesh.material;
    mesh.material = getDimmedMaterial(mesh);
  }
}

function currentContextMode() {
  if (document.getElementById('toggle-scene').checked) return 'scene';
  if (document.getElementById('toggle-cluster').checked) return 'cluster';
  return 'solo';
}

function showLocalIndex(localIdx) {
  if (currentClusterNames.length === 0) return;
  localIdx = Math.max(0, Math.min(currentClusterNames.length - 1, localIdx));
  currentLocalIndex = localIdx;
  document.getElementById('index-input').value = localIdx;

  const targetName = currentClusterNames[localIdx];
  applyVisibilityForContext(targetName);

  const target = nameToMesh[targetName];
  frameCameraForContext(target);
  updateInfoPanel(targetName, target);
  updateLabelButtons(targetName);
}

// Re-applies visibility/appearance for whichever context mode is
// currently toggled, keeping `targetName` highlighted throughout.
function applyVisibilityForContext(targetName) {
  const mode = currentContextMode();
  const clusterNameSet = new Set(currentClusterNames);

  Object.entries(nameToMesh).forEach(([name, mesh]) => {
    if (name === targetName) {
      // Glow only when there's actual competing context to stand out
      // against; solo mode keeps the original untouched material.
      setFragmentAppearance(mesh, mode === 'solo' ? 'selected' : 'selected-glow');
    } else if (mode === 'cluster' && clusterNameSet.has(name)) {
      setFragmentAppearance(mesh, 'dimmed');
    } else if (mode === 'scene') {
      setFragmentAppearance(mesh, 'dimmed');
    } else {
      setFragmentAppearance(mesh, 'hidden');
    }
  });

  // Outline overlay only makes sense when showing context -- in solo
  // mode the fragment already fills the view, no outline needed.
  updateOutlineForMesh(mode === 'solo' ? null : nameToMesh[targetName]);
}

function frameCameraForContext(target) {
  const mode = currentContextMode();

  let box;
  if (mode === 'scene') {
    box = new THREE.Box3();
    Object.values(nameToMesh).forEach(m => { if (m.visible) box.expandByObject(m); });
  } else if (mode === 'cluster') {
    box = new THREE.Box3();
    currentClusterNames.forEach(n => {
      const m = nameToMesh[n];
      if (m && m.visible) box.expandByObject(m);
    });
  } else {
    if (!target) return;
    box = new THREE.Box3().setFromObject(target);
  }

  if (!box || box.isEmpty()) return;

  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);

  const maxDim = Math.max(size.x, size.y, size.z, 0.0001);
  // Wider framing multiplier for cluster/scene context so the whole
  // group fits comfortably, tighter for solo fragment inspection.
  const distance = mode === 'solo' ? maxDim * 2.0 : maxDim * 1.4;

  camera.near = maxDim / 500;
  camera.far = maxDim * 200;
  camera.updateProjectionMatrix();

  camera.position.set(
    center.x + distance * 0.7,
    center.y + distance * 0.6,
    center.z + distance * 0.7
  );
  controls.target.copy(center);
  controls.update();
}

document.getElementById('toggle-cluster').addEventListener('change', (e) => {
  if (e.target.checked) document.getElementById('toggle-scene').checked = false;
  refreshContextView();
});
document.getElementById('toggle-scene').addEventListener('change', (e) => {
  if (e.target.checked) document.getElementById('toggle-cluster').checked = false;
  refreshContextView();
});

function refreshContextView() {
  if (currentClusterNames.length === 0) return;
  const targetName = currentClusterNames[currentLocalIndex];
  applyVisibilityForContext(targetName);
  frameCameraForContext(nameToMesh[targetName]);
}

function updateInfoPanel(name, obj) {
  document.getElementById('info-cluster').textContent =
    currentClusterIndex !== null ? String(currentClusterIndex).padStart(2, '0') : '–';
  document.getElementById('info-name').textContent = name || '–';
  document.getElementById('info-verts').textContent =
    obj && obj.geometry ? (obj.geometry.attributes.position?.count ?? '–') : '–';
  document.getElementById('info-label').textContent = labels[name] || 'unlabeled';
}

function updateLabelButtons(name) {
  const current = labels[name];
  document.querySelectorAll('.label-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.label === current);
  });
}

// ── Labeling ────────────────────────────────────────────────────────
function assignLabel(labelName) {
  if (currentClusterNames.length === 0) return;
  const name = currentClusterNames[currentLocalIndex];
  labels[name] = labelName;
  updateInfoPanel(name, nameToMesh[name]);
  updateLabelButtons(name);
  updateProgressUI();
}

document.querySelectorAll('.label-btn').forEach(btn => {
  btn.addEventListener('click', () => assignLabel(btn.dataset.label));
});

function updateProgressUI() {
  const total = currentClusterNames.length;
  const done = currentClusterNames.filter(n => n in labels).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-count').textContent = `${done} / ${total} labeled (this cluster)`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-bar-fill').style.width = `${pct}%`;
}

// ── Navigation ──────────────────────────────────────────────────────
document.getElementById('index-input').addEventListener('change', (e) => {
  showLocalIndex(parseInt(e.target.value, 10) || 0);
});
document.getElementById('prev-btn').addEventListener('click', () => showLocalIndex(currentLocalIndex - 1));
document.getElementById('next-btn').addEventListener('click', () => showLocalIndex(currentLocalIndex + 1));

document.getElementById('jump-unlabeled').addEventListener('click', () => {
  for (let i = 0; i < currentClusterNames.length; i++) {
    if (!(currentClusterNames[i] in labels)) { showLocalIndex(i); return; }
  }
  setStatus('All fragments in this cluster are labeled!', 'ok');
});

window.addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') showLocalIndex(currentLocalIndex + 1);
  if (e.key === 'ArrowLeft') showLocalIndex(currentLocalIndex - 1);
  if (LABEL_KEYS[e.key]) assignLabel(LABEL_KEYS[e.key]);
});

// ── Export / Import labels ─────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  const out = { source_glb: GLB_PATH, label_count: Object.keys(labels).length, labels };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fragment_labels.json';
  a.click();
  URL.revokeObjectURL(url);
  setStatus('Labels exported', 'ok');
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-labels-input').click();
});
document.getElementById('import-labels-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      labels = data.labels || {};
      updateProgressUI();
      if (currentClusterNames.length > 0) {
        const name = currentClusterNames[currentLocalIndex];
        updateInfoPanel(name, nameToMesh[name]);
        updateLabelButtons(name);
      }
      setStatus(`Resumed ${Object.keys(labels).length} labels`, 'ok');
    } catch (err) {
      setStatus('Failed to parse labels JSON', 'error');
    }
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
