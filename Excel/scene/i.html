<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🖥️ Scene Editor — Desktop PC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; }
  #canvas-container { position: fixed; inset: 0; }

  #ui {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    background: rgba(0,0,0,0.88); backdrop-filter: blur(8px);
    border-bottom: 1px solid #222; z-index: 30; flex-wrap: wrap;
  }
  #title { color: #f97316; font-size: 11px; font-weight: bold; flex: 1; }
  #summary { font-size: 10px; color: #94a3b8; }

  #legend {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.93); border-top: 1px solid #1a1a1a;
    padding: 6px 10px;
    display: flex; flex-wrap: wrap; gap: 4px;
    z-index: 20; max-height: 38vh; overflow-y: auto;
  }
  .legend-section {
    width: 100%; font-size: 8px; color: #333;
    padding: 3px 2px 1px; border-top: 1px solid #1a1a2e;
    margin-top: 2px; letter-spacing: 1px; text-transform: uppercase;
  }
  .legend-section:first-child { border-top: none; margin-top: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 12px; font-size: 9px; border: 1px solid;
    cursor: pointer; user-select: none; transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .pill:hover { transform: scale(1.05); }
  .pill.off { opacity: 0.22; }
  .pill.loading { opacity: 0.5; font-style: italic; }
  .pill.selected { box-shadow: 0 0 0 2px #fff; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .pcnt { font-size: 7px; opacity: 0.55; }

  #replace-panel {
    position: fixed; top: 36px; right: 10px; width: 276px;
    background: rgba(8,8,18,0.97); border: 1px solid #333; border-radius: 8px;
    z-index: 25; max-height: calc(100vh - 46px); overflow-y: auto;
    transition: opacity 0.25s, transform 0.25s;
    opacity: 0; transform: translateX(285px); pointer-events: none;
  }
  #replace-panel.open { opacity: 1; transform: translateX(0); pointer-events: auto; }
  #replace-panel::-webkit-scrollbar { width: 3px; }
  #replace-panel::-webkit-scrollbar-thumb { background: #333; }

  #rp-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px 7px; border-bottom: 1px solid #222;
    position: sticky; top: 0; background: rgba(8,8,18,0.98); z-index: 1;
  }
  #rp-header h3 { font-size: 11px; }
  #rp-close { background: none; border: none; color: #555; font-size: 13px; cursor: pointer; }
  #rp-close:hover { color: #f87171; }

  #rp-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

  .rp-field label {
    color: #94a3b8; font-size: 9px; display: block; margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .rp-field input[type=text] {
    width: 100%; padding: 5px 8px;
    background: #0f0f1e; border: 1px solid #333; border-radius: 4px;
    color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 10px; outline: none;
  }
  .rp-field input:focus { border-color: #f97316; }

  .rp-info {
    background: #060610; border: 1px solid #1a1a2e;
    border-radius: 4px; padding: 7px 9px; font-size: 9px;
    color: #94a3b8; line-height: 1.8;
  }
  .rp-info span { color: #e0e0e0; }
  .rp-info .hi { color: #f97316; font-weight: bold; }

  .slider-section {
    background: #060610; border: 1px solid #1a1a2e; border-radius: 5px; padding: 8px 9px;
  }
  .ss-title {
    font-size: 9px; color: #f97316; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sr { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  .sr:last-child { margin-bottom: 0; }
  .saxis { font-size: 9px; color: #555; width: 12px; flex-shrink: 0; font-weight: bold; }
  .sr input[type=range] { flex: 1; accent-color: #f97316; height: 3px; }
  .snum {
    font-size: 9px; color: #f97316; width: 44px;
    text-align: right; flex-shrink: 0; font-family: 'Courier New', monospace;
  }
  .sfine {
    width: 54px; padding: 2px 4px;
    background: #0f0f1e; border: 1px solid #333; border-radius: 3px;
    color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 9px; outline: none;
  }
  .sfine:focus { border-color: #f97316; }
  .reset-btn {
    background: none; border: 1px solid #333; border-radius: 3px;
    color: #555; font-size: 8px; padding: 1px 5px;
    cursor: pointer; font-family: 'Courier New', monospace;
  }
  .reset-btn:hover { border-color: #f97316; color: #f97316; }
  .divrow { border-top: 1px solid #1a1a2e; padding-top: 5px; margin-top: 4px; }

  /* ── Turn buttons ── */
  .turn-btn {
    background: #0f0f1e; border: 1px solid #334155; border-radius: 4px;
    color: #94a3b8; font-size: 10px;
    width: 24px; height: 24px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.1s; flex-shrink: 0; user-select: none;
  }
  .turn-btn:hover  { border-color: #f97316; color: #f97316; background: #1a0800; }
  .turn-btn:active { background: #f97316; color: #000; transform: scale(0.9); }

  /* ── Step buttons ── */
  .step-btn {
    background: #0f0f1e; border: 1px solid #334155; border-radius: 4px;
    color: #64748b; font-size: 8px; padding: 3px 6px;
    cursor: pointer; font-family: 'Courier New', monospace;
    transition: all 0.1s; user-select: none;
  }
  .step-btn:hover  { border-color: #f97316; color: #f97316; }
  .step-btn.active { border-color: #f97316; color: #f97316; background: rgba(249,115,22,0.12); }

  #rp-copy-box {
    background: #0a0a18; border: 1px solid #1a1a3a; border-radius: 4px;
    padding: 7px 9px; font-size: 9px; color: #4ade80; line-height: 1.8;
    font-family: 'Courier New', monospace; display: none;
  }

  .rp-btn {
    width: 100%; padding: 6px; border-radius: 4px;
    font-family: 'Courier New', monospace; font-size: 10px;
    cursor: pointer; border: 1px solid; transition: all 0.15s;
  }
  .rp-btn.primary   { background: #0f0f1e; border-color: #f97316; color: #f97316; }
  .rp-btn.primary:hover  { background: #f97316; color: #000; }
  .rp-btn.secondary { background: #0f0f1e; border-color: #333; color: #94a3b8; }
  .rp-btn.secondary:hover { border-color: #06b6d4; color: #06b6d4; }
  .rp-btn.green     { background: #0f0f1e; border-color: #4ade80; color: #4ade80; }
  .rp-btn.green:hover { background: #4ade80; color: #000; }
  .rp-btn:disabled  { opacity: 0.35; cursor: not-allowed; }

  #rp-status { font-size: 9px; min-height: 14px; text-align: center; color: #94a3b8; }
  #rp-status.ok  { color: #4ade80; }
  #rp-status.err { color: #f87171; }

  #log-panel {
    position: fixed; top: 36px; left: 10px; width: 210px;
    max-height: calc(100vh - 80px);
    background: rgba(8,8,18,0.95); border: 1px solid #333; border-radius: 8px;
    display: flex; flex-direction: column; z-index: 24;
    transition: opacity 0.3s, transform 0.3s;
  }
  #log-panel.hidden { opacity: 0; transform: translateX(-220px); pointer-events: none; }
  #log-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px 6px; border-bottom: 1px solid #1a1a2e; flex-shrink: 0;
  }
  #log-header h3 { color: #f97316; font-size: 11px; }
  #log-close { background: none; border: none; color: #555; font-size: 13px; cursor: pointer; }
  #log-close:hover { color: #f87171; }
  #log-body { overflow-y: auto; padding: 7px 12px 10px; flex: 1; }
  .ll { padding: 2px 0; border-bottom: 1px solid #0f0f1a; line-height: 1.5; font-size: 9px; }
  .ok  { color: #4ade80; } .err { color: #f87171; }
  .info{ color: #94a3b8; } .warn{ color: #fbbf24; }

  #log-reopen {
    position: fixed; top: 9px; left: 12px;
    background: rgba(8,8,18,0.9); border: 1px solid #444; border-radius: 5px;
    color: #94a3b8; font-family: 'Courier New', monospace; font-size: 10px;
    padding: 4px 9px; cursor: pointer; z-index: 25;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  #log-reopen.visible { opacity: 1; pointer-events: auto; }
  #log-reopen:hover { color: #f97316; border-color: #f97316; }

  #tooltip {
    position: fixed; pointer-events: none;
    background: rgba(0,0,0,0.92); border: 1px solid #444;
    border-radius: 5px; padding: 4px 9px; font-size: 10px; color: #fff;
    z-index: 40; display: none;
  }
  #drop-overlay {
    position: fixed; inset: 0; background: rgba(249,115,22,0.08);
    border: 2px dashed #f97316; z-index: 50; display: none;
    align-items: center; justify-content: center;
    font-size: 16px; color: #f97316; pointer-events: none;
  }
  #drop-overlay.active { display: flex; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui">
  <span id="title">🖥️ SCENE EDITOR — DESKTOP PC</span>
  <span id="summary">Loading…</span>
</div>

<div id="log-panel">
  <div id="log-header"><h3>📋 Log</h3><button id="log-close">✕</button></div>
  <div id="log-body"></div>
</div>
<button id="log-reopen">📋 Log</button>

<div id="replace-panel">
  <div id="rp-header">
    <h3 id="rp-title" style="color:#f97316">🔄 Select a part</h3>
    <button id="rp-close">✕</button>
  </div>
  <div id="rp-body">
    <div class="rp-info" id="rp-info">Click a pill or mesh to select.</div>

    <div class="rp-field">
      <label>Replacement GLB path</label>
      <input type="text" id="rp-path" placeholder="./models/parts/my_part.glb" />
    </div>
    <button class="rp-btn primary" id="rp-load-btn" disabled>🔄 Load &amp; Replace</button>

    <!-- SCALE -->
    <div class="slider-section">
      <div class="ss-title">📐 Scale <button class="reset-btn" id="reset-scale">reset</button></div>
      <div class="sr"><span class="saxis" style="color:#f87171">X</span><input type="range" id="sx" min="0.01" max="8" step="0.01" value="1"><span class="snum" id="sx-v">1.000</span><input class="sfine" type="number" id="sx-f" step="0.001" value="1"></div>
      <div class="sr"><span class="saxis" style="color:#4ade80">Y</span><input type="range" id="sy" min="0.01" max="8" step="0.01" value="1"><span class="snum" id="sy-v">1.000</span><input class="sfine" type="number" id="sy-f" step="0.001" value="1"></div>
      <div class="sr"><span class="saxis" style="color:#38bdf8">Z</span><input type="range" id="sz" min="0.01" max="8" step="0.01" value="1"><span class="snum" id="sz-v">1.000</span><input class="sfine" type="number" id="sz-f" step="0.001" value="1"></div>
      <div class="sr divrow"><span class="saxis" style="color:#fbbf24">∀</span><input type="range" id="su" min="0.01" max="8" step="0.01" value="1"><span class="snum" id="su-v">1.000</span><input class="sfine" type="number" id="su-f" step="0.001" value="1"></div>
    </div>

    <!-- POSITION -->
    <div class="slider-section">
      <div class="ss-title">📍 Position <button class="reset-btn" id="reset-pos">reset</button></div>
      <div class="sr"><span class="saxis" style="color:#f87171">X</span><input type="range" id="px" min="-30" max="30" step="0.05" value="0"><span class="snum" id="px-v">0.000</span><input class="sfine" type="number" id="px-f" step="0.01" value="0"></div>
      <div class="sr"><span class="saxis" style="color:#4ade80">Y</span><input type="range" id="py" min="-30" max="30" step="0.05" value="0"><span class="snum" id="py-v">0.000</span><input class="sfine" type="number" id="py-f" step="0.01" value="0"></div>
      <div class="sr"><span class="saxis" style="color:#38bdf8">Z</span><input type="range" id="pz" min="-30" max="30" step="0.05" value="0"><span class="snum" id="pz-v">0.000</span><input class="sfine" type="number" id="pz-f" step="0.01" value="0"></div>
    </div>

    <!-- ROTATION — click-turn buttons -->
    <div class="slider-section">
      <div class="ss-title">🔄 Rotation (deg) <button class="reset-btn" id="reset-rot">reset</button></div>

      <!-- X -->
      <div class="sr">
        <span class="saxis" style="color:#f87171">X</span>
        <div style="display:flex;gap:3px;flex-shrink:0;">
          <button class="turn-btn" data-axis="rx" data-dir="-1">◀</button>
          <button class="turn-btn" data-axis="rx" data-dir="1">▶</button>
        </div>
        <span class="snum" id="rx-v" style="width:42px">0.0°</span>
        <input class="sfine" type="number" id="rx-f" step="1" value="0">
      </div>

      <!-- Y -->
      <div class="sr">
        <span class="saxis" style="color:#4ade80">Y</span>
        <div style="display:flex;gap:3px;flex-shrink:0;">
          <button class="turn-btn" data-axis="ry" data-dir="-1">◀</button>
          <button class="turn-btn" data-axis="ry" data-dir="1">▶</button>
        </div>
        <span class="snum" id="ry-v" style="width:42px">0.0°</span>
        <input class="sfine" type="number" id="ry-f" step="1" value="0">
      </div>

      <!-- Z -->
      <div class="sr">
        <span class="saxis" style="color:#38bdf8">Z</span>
        <div style="display:flex;gap:3px;flex-shrink:0;">
          <button class="turn-btn" data-axis="rz" data-dir="-1">◀</button>
          <button class="turn-btn" data-axis="rz" data-dir="1">▶</button>
        </div>
        <span class="snum" id="rz-v" style="width:42px">0.0°</span>
        <input class="sfine" type="number" id="rz-f" step="1" value="0">
      </div>

      <!-- Step size -->
      <div class="sr divrow" style="justify-content:space-between;align-items:center;">
        <span style="font-size:9px;color:#475569;">Step</span>
        <div style="display:flex;gap:3px;">
          <button class="step-btn active" data-step="1">1°</button>
          <button class="step-btn" data-step="5">5°</button>
          <button class="step-btn" data-step="15">15°</button>
          <button class="step-btn" data-step="45">45°</button>
          <button class="step-btn" data-step="90">90°</button>
        </div>
      </div>
    </div>

    <button class="rp-btn green" id="rp-copy-btn">📋 Copy transform values</button>
    <div id="rp-copy-box"></div>
    <button class="rp-btn secondary" id="rp-restore-btn" disabled>↩ Restore Original</button>
    <button class="rp-btn secondary" id="rp-cancel-btn">✕ Deselect</button>
    <div id="rp-status"></div>
  </div>
</div>

<div id="legend"></div>
<div id="tooltip"></div>
<div id="drop-overlay">📦 Drop .glb to replace selected part</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';

// ── PARTS ─────────────────────────────────────────────────────────────────────
const PARTS = [
  { file: 'table.glb',      label: 'Table',       color: '#78716c', section: 'Furniture'   },
  { file: 'pc_case.glb',    label: 'PC Case',      color: '#38bdf8', section: 'PC'          },
  { file: 'monitor.glb',    label: 'Monitor',      color: '#facc15', section: 'Peripherals' },
  { file: 'keyboard.glb',   label: 'Keyboard',     color: '#4ade80', section: 'Peripherals' },
  { file: 'mouse.glb',      label: 'Mouse',        color: '#f472b6', section: 'Peripherals' },
  { file: 'mousepad.glb',   label: 'Mouse Pad',    color: '#a855f7', section: 'Peripherals' },
  { file: 'cables.glb',     label: 'Cables',       color: '#94a3b8', section: 'Cables'      },
  { file: 'floor_wall.glb', label: 'Floor / Wall', color: '#6b7280', section: 'Environment' },
  { file: 'fan_left.glb',   label: 'Fan Left',     color: '#34d399', section: 'PC'          },
  { file: 'fan_right.glb',  label: 'Fan Right',    color: '#6ee7b7', section: 'PC'          },
  { file: 'speaker.glb',    label: 'Speaker',      color: '#f87171', section: 'Peripherals' },
  { file: 'misc.glb',       label: 'Misc',         color: '#fbbf24', section: 'Other'       },
];

const PARTS_BASE = './models/parts/';

// ── SCENE ─────────────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer  = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.Fog(0x0a0a14, 40, 100);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 300);
camera.position.set(0, 8, 20);

const orbitCtrl = new OrbitControls(camera, renderer.domElement);
orbitCtrl.enableDamping = true;
orbitCtrl.dampingFactor = 0.07;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirL = new THREE.DirectionalLight(0xffffff, 1.2);
dirL.position.set(5, 10, 7); dirL.castShadow = true; scene.add(dirL);
const fillL = new THREE.DirectionalLight(0x8888ff, 0.4);
fillL.position.set(-5, 3, -5); scene.add(fillL);
scene.add(new THREE.GridHelper(40, 40, 0x1a1a1a, 0x111111));

function makeFlatMat(color) {
  return new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.65, metalness: 0.1 });
}

// ── LOG ───────────────────────────────────────────────────────────────────────
const logBody   = document.getElementById('log-body');
const logPanel  = document.getElementById('log-panel');
const summaryEl = document.getElementById('summary');

function log(msg, type = 'info') {
  const d = document.createElement('div');
  d.className = `ll ${type}`; d.textContent = msg;
  logBody.appendChild(d); logBody.scrollTop = logBody.scrollHeight;
}
document.getElementById('log-close').addEventListener('click', () => {
  logPanel.classList.add('hidden');
  document.getElementById('log-reopen').classList.add('visible');
});
document.getElementById('log-reopen').addEventListener('click', () => {
  logPanel.classList.remove('hidden');
  document.getElementById('log-reopen').classList.remove('visible');
});

// ── LOADERS ───────────────────────────────────────────────────────────────────
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// ── STATE ─────────────────────────────────────────────────────────────────────
const STATE = {};
let selectedPart = null;
const DEG2RAD = Math.PI / 180;
const T = { sx:1, sy:1, sz:1, px:0, py:0, pz:0, rx:0, ry:0, rz:0 };

// ── MATERIAL HELPERS ──────────────────────────────────────────────────────────
function storeOrigMats(group) {
  const map = new Map();
  group.traverse(obj => {
    if (!obj.isMesh) return;
    map.set(obj.uuid, Array.isArray(obj.material) ? [...obj.material] : obj.material);
  });
  return map;
}
function restoreOrigMats(group, map) {
  group.traverse(obj => {
    if (!obj.isMesh || !map.has(obj.uuid)) return;
    obj.material = map.get(obj.uuid);
  });
}
function applyFlatMats(group, color) {
  const mat = makeFlatMat(color);
  group.traverse(obj => { if (obj.isMesh) obj.material = mat; });
}

// ── LEGEND ────────────────────────────────────────────────────────────────────
const legendEl = document.getElementById('legend');

function rebuildLegend() {
  legendEl.innerHTML = '';
  const sections = {};
  PARTS.forEach(p => {
    if (!sections[p.section]) sections[p.section] = [];
    sections[p.section].push(p);
  });
  Object.entries(sections).forEach(([sec, parts]) => {
    const hdr = document.createElement('div');
    hdr.className = 'legend-section'; hdr.textContent = sec;
    legendEl.appendChild(hdr);
    parts.forEach(p => {
      const s    = STATE[p.label];
      const pill = buildPill(p, s);
      if (s) s.pill = pill;
      legendEl.appendChild(pill);
    });
  });
}

function buildPill(part, s) {
  const pill = document.createElement('div');
  pill.className = 'pill'
    + (!s?.group   ? ' loading' : '')
    + (!s?.visible ? ' off'     : '')
    + (selectedPart === part.label ? ' selected' : '');
  pill.style.borderColor = part.color;
  pill.style.color       = part.color;
  pill.innerHTML =
    `<span class="dot" style="background:${part.color}"></span>` +
    `${part.label}` +
    `<span class="pcnt">${s?.group ? ` ×${s.meshCount}` : ' …'}</span>`;

  pill.addEventListener('click', e => {
    const st = STATE[part.label];
    if (!st?.group) return;
    if (e.shiftKey) {
      st.visible = !st.visible;
      st.group.visible = st.visible;
      pill.classList.toggle('off', !st.visible);
    } else {
      selectPart(part.label);
    }
  });
  pill.addEventListener('contextmenu', e => {
    e.preventDefault();
    const st = STATE[part.label];
    if (!st?.group) return;
    st.visible = !st.visible;
    st.group.visible = st.visible;
    pill.classList.toggle('off', !st.visible);
  });
  return pill;
}

// ── SCALE + POSITION SLIDERS ──────────────────────────────────────────────────
function wireSlider(id, key) {
  const sl = document.getElementById(id);
  const vl = document.getElementById(id + '-v');
  const fn = document.getElementById(id + '-f');
  function apply(v) {
    v = parseFloat(v);
    T[key] = v;
    sl.value = v;
    fn.value = v.toFixed(3);
    vl.textContent = v.toFixed(3);
    applyTransform(); updateCopyBox();
  }
  sl.addEventListener('input',  () => apply(sl.value));
  fn.addEventListener('change', () => apply(fn.value));
}
['sx','sy','sz','px','py','pz'].forEach(k => wireSlider(k, k));

// Uniform scale
const suSl = document.getElementById('su');
const suVl = document.getElementById('su-v');
const suFn = document.getElementById('su-f');
function applyUniform(v) {
  v = parseFloat(v);
  T.sx = T.sy = T.sz = v;
  suSl.value = v; suFn.value = v.toFixed(3); suVl.textContent = v.toFixed(3);
  ['sx','sy','sz'].forEach(k => {
    document.getElementById(k).value           = v;
    document.getElementById(k+'-f').value       = v.toFixed(3);
    document.getElementById(k+'-v').textContent = v.toFixed(3);
  });
  applyTransform(); updateCopyBox();
}
suSl.addEventListener('input',  () => applyUniform(suSl.value));
suFn.addEventListener('change', () => applyUniform(suFn.value));

document.getElementById('reset-scale').addEventListener('click', () => applyUniform(1));

document.getElementById('reset-pos').addEventListener('click', () => {
  ['px','py','pz'].forEach(k => {
    T[k] = 0;
    document.getElementById(k).value           = 0;
    document.getElementById(k+'-f').value       = '0.000';
    document.getElementById(k+'-v').textContent = '0.000';
  });
  applyTransform(); updateCopyBox();
});

// ── ROTATION — click-turn buttons ─────────────────────────────────────────────
let rotStep = 1;

document.querySelectorAll('.step-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    rotStep = parseInt(btn.dataset.step);
    document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

function setRotAxis(axis, deg) {
  // Wrap to -180..180
  deg = ((deg + 180) % 360 + 360) % 360 - 180;
  T[axis] = deg;
  document.getElementById(axis + '-v').textContent = deg.toFixed(1) + '°';
  document.getElementById(axis + '-f').value = deg.toFixed(0);
  applyTransform();
  updateCopyBox();
}

document.querySelectorAll('.turn-btn').forEach(btn => {
  const axis = btn.dataset.axis;
  const dir  = parseInt(btn.dataset.dir);

  // Single click
  btn.addEventListener('click', () => setRotAxis(axis, T[axis] + dir * rotStep));

  // Hold to spin
  let holdTimer = null;
  let holdInterval = null;
  const startHold = () => {
    holdTimer = setTimeout(() => {
      holdInterval = setInterval(() => {
        setRotAxis(btn.dataset.axis, T[btn.dataset.axis] + parseInt(btn.dataset.dir) * rotStep);
      }, 80);
    }, 400);
  };
  const stopHold = () => { clearTimeout(holdTimer); clearInterval(holdInterval); };

  btn.addEventListener('mousedown',  startHold);
  btn.addEventListener('mouseup',    stopHold);
  btn.addEventListener('mouseleave', stopHold);
  btn.addEventListener('touchstart', startHold, { passive: true });
  btn.addEventListener('touchend',   stopHold);
});

// Fine input for rotation
['rx','ry','rz'].forEach(axis => {
  document.getElementById(axis + '-f').addEventListener('change', e => {
    setRotAxis(axis, parseFloat(e.target.value) || 0);
  });
});

document.getElementById('reset-rot').addEventListener('click', () => {
  ['rx','ry','rz'].forEach(axis => setRotAxis(axis, 0));
});

// ── APPLY TRANSFORM ───────────────────────────────────────────────────────────
function applyTransform() {
  if (!selectedPart) return;
  const s = STATE[selectedPart];
  if (!s?.group) return;
  s.group.scale.set(T.sx, T.sy, T.sz);
  s.group.position.set(
    (s.basePos?.x ?? 0) + T.px,
    (s.basePos?.y ?? 0) + T.py,
    (s.basePos?.z ?? 0) + T.pz,
  );
  s.group.rotation.set(T.rx * DEG2RAD, T.ry * DEG2RAD, T.rz * DEG2RAD);
}

function resetSliders() {
  T.sx=T.sy=T.sz=1; T.px=T.py=T.pz=0; T.rx=T.ry=T.rz=0;
  ['sx','sy','sz'].forEach(k => {
    document.getElementById(k).value           = 1;
    document.getElementById(k+'-f').value       = '1.000';
    document.getElementById(k+'-v').textContent = '1.000';
  });
  suSl.value=1; suFn.value='1.000'; suVl.textContent='1.000';
  ['px','py','pz'].forEach(k => {
    document.getElementById(k).value           = 0;
    document.getElementById(k+'-f').value       = '0.000';
    document.getElementById(k+'-v').textContent = '0.000';
  });
  ['rx','ry','rz'].forEach(axis => {
    document.getElementById(axis + '-v').textContent = '0.0°';
    document.getElementById(axis + '-f').value = '0';
  });
}

// ── COPY BOX ──────────────────────────────────────────────────────────────────
const copyBox = document.getElementById('rp-copy-box');
function updateCopyBox() {
  if (!selectedPart) return;
  copyBox.style.display = 'block';
  copyBox.textContent =
    `// ${selectedPart}\n` +
    `SCALE_X=${T.sx.toFixed(4)} SCALE_Y=${T.sy.toFixed(4)} SCALE_Z=${T.sz.toFixed(4)}\n` +
    `OFFSET_X=${T.px.toFixed(4)} OFFSET_Y=${T.py.toFixed(4)} OFFSET_Z=${T.pz.toFixed(4)}\n` +
    `ROT_X=${T.rx.toFixed(1)}° ROT_Y=${T.ry.toFixed(1)}° ROT_Z=${T.rz.toFixed(1)}°`;
}
document.getElementById('rp-copy-btn').addEventListener('click', () => {
  navigator.clipboard.writeText(copyBox.textContent).then(() => {
    document.getElementById('rp-copy-btn').textContent = '✅ Copied!';
    setTimeout(() => {
      document.getElementById('rp-copy-btn').textContent = '📋 Copy transform values';
    }, 2000);
  }).catch(() => alert(copyBox.textContent));
});

// ── SELECT PART ───────────────────────────────────────────────────────────────
function selectPart(label) {
  if (selectedPart && STATE[selectedPart]) STATE[selectedPart].pill?.classList.remove('selected');
  selectedPart = label;
  const s = STATE[label];
  if (!s?.group) return;

  s.pill?.classList.add('selected');
  document.getElementById('replace-panel').classList.add('open');

  const rpTitle = document.getElementById('rp-title');
  rpTitle.textContent = `🔄 ${label}`;
  rpTitle.style.color = s.color;

  if (!s.basePos) s.basePos = s.group.position.clone();

  T.sx = s.group.scale.x;
  T.sy = s.group.scale.y;
  T.sz = s.group.scale.z;
  T.px = s.group.position.x - (s.basePos?.x ?? 0);
  T.py = s.group.position.y - (s.basePos?.y ?? 0);
  T.pz = s.group.position.z - (s.basePos?.z ?? 0);
  T.rx = s.group.rotation.x / DEG2RAD;
  T.ry = s.group.rotation.y / DEG2RAD;
  T.rz = s.group.rotation.z / DEG2RAD;

  // Sync scale + position sliders
  ['sx','sy','sz','px','py','pz'].forEach(k => {
    document.getElementById(k).value           = T[k];
    document.getElementById(k+'-f').value       = T[k].toFixed(3);
    document.getElementById(k+'-v').textContent = T[k].toFixed(3);
  });

  // Sync rotation displays
  ['rx','ry','rz'].forEach(axis => {
    document.getElementById(axis + '-v').textContent = T[axis].toFixed(1) + '°';
    document.getElementById(axis + '-f').value = T[axis].toFixed(0);
  });

  const box    = new THREE.Box3().setFromObject(s.group);
  const size   = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  document.getElementById('rp-info').innerHTML =
    `<div>Part: <span>${label}</span>  Replaced: <span class="${s.replaced?'hi':''}">${s.replaced?'YES':'no'}</span></div>` +
    `<div>Meshes: <span>${s.meshCount}</span></div>` +
    `<div>Size: <span>${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)}</span></div>` +
    `<div>Ctr: <span>${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)}</span></div>`;

  document.getElementById('rp-load-btn').disabled    = false;
  document.getElementById('rp-restore-btn').disabled = !s.replaced;
  document.getElementById('rp-status').textContent   = '';
  copyBox.style.display = 'none';
  updateCopyBox();
}

// ── LOAD REPLACEMENT ──────────────────────────────────────────────────────────
function loadReplacement(label, urlOrBlob) {
  const s = STATE[label];
  if (!s) return;
  const rpStatus = document.getElementById('rp-status');
  rpStatus.textContent = '⏳ Loading…'; rpStatus.className = 'info';
  document.getElementById('rp-load-btn').disabled = true;
  const url = urlOrBlob instanceof Blob ? URL.createObjectURL(urlOrBlob) : urlOrBlob;

  loader.load(url, gltf => {
    const ng = gltf.scene;
    ng.name  = label + '_replacement';
    s.origMats = storeOrigMats(ng);
    applyFlatMats(ng, s.color);
    ng.traverse(obj => { if (obj.isMesh) obj.userData.partLabel = label; });

    const origCenter = s.origBox.getCenter(new THREE.Vector3());
    s.basePos = origCenter.clone();
    resetSliders();

    const newBox = new THREE.Box3().setFromObject(ng);
    ng.position.sub(newBox.getCenter(new THREE.Vector3())).add(origCenter);

    scene.remove(s.group);
    scene.add(ng);
    s.group = ng; s.replaced = true;

    let meshCount = 0;
    ng.traverse(o => { if (o.isMesh) meshCount++; });
    s.meshCount = meshCount;

    rpStatus.textContent = '✅ Loaded — adjust transforms';
    rpStatus.className   = 'ok';
    document.getElementById('rp-load-btn').disabled    = false;
    document.getElementById('rp-restore-btn').disabled = false;
    if (urlOrBlob instanceof Blob) URL.revokeObjectURL(url);
    log(`🔄 ${label} replaced (${meshCount} meshes)`, 'ok');
    rebuildLegend();
    selectPart(label);
  }, undefined, err => {
    rpStatus.textContent = `❌ ${err.message}`;
    rpStatus.className   = 'err';
    document.getElementById('rp-load-btn').disabled = false;
    if (urlOrBlob instanceof Blob) URL.revokeObjectURL(url);
    log(`❌ ${err.message}`, 'err');
  });
}

document.getElementById('rp-load-btn').addEventListener('click', () => {
  const url = document.getElementById('rp-path').value.trim();
  if (!url || !selectedPart) return;
  loadReplacement(selectedPart, url);
});

document.getElementById('rp-restore-btn').addEventListener('click', () => {
  if (!selectedPart) return;
  const s = STATE[selectedPart];
  if (!s?.replaced) return;
  scene.remove(s.group);
  scene.add(s.origGroup);
  s.group = s.origGroup; s.replaced = false; s.basePos = null;

  let meshCount = 0;
  s.origGroup.traverse(o => { if (o.isMesh) meshCount++; });
  s.meshCount = meshCount;

  resetSliders(); applyTransform();
  document.getElementById('rp-restore-btn').disabled = true;
  document.getElementById('rp-status').textContent   = '↩ Restored';
  document.getElementById('rp-status').className     = 'ok';
  copyBox.style.display = 'none';
  log(`↩ ${selectedPart} restored`, 'info');
  rebuildLegend();
  selectPart(selectedPart);
});

document.getElementById('rp-cancel-btn').addEventListener('click', () => {
  document.getElementById('replace-panel').classList.remove('open');
  if (selectedPart) STATE[selectedPart]?.pill?.classList.remove('selected');
  selectedPart = null;
});
document.getElementById('rp-close').addEventListener('click', () => {
  document.getElementById('replace-panel').classList.remove('open');
});

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
const dropOverlay = document.getElementById('drop-overlay');
document.addEventListener('dragover', e => {
  e.preventDefault();
  if (selectedPart) dropOverlay.classList.add('active');
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget) dropOverlay.classList.remove('active');
});
document.addEventListener('drop', e => {
  e.preventDefault(); dropOverlay.classList.remove('active');
  if (!selectedPart) return;
  const file = [...e.dataTransfer.files].find(f => f.name.endsWith('.glb'));
  if (file) loadReplacement(selectedPart, file);
});

// ── LOAD PART ─────────────────────────────────────────────────────────────────
function loadPart(part) {
  return new Promise(resolve => {
    loader.load(PARTS_BASE + part.file, gltf => {
      const group = gltf.scene;
      group.name  = part.label;
      let meshCount = 0;
      const origMats = storeOrigMats(group);
      group.traverse(obj => {
        if (!obj.isMesh) return;
        obj.userData.partLabel = part.label;
        meshCount++;
      });
      applyFlatMats(group, part.color);
      const box = new THREE.Box3().setFromObject(group);
      scene.add(group);

      const s = STATE[part.label];
      s.group     = group;
      s.origGroup = group;
      s.origMats  = origMats;
      s.origBox   = box;
      s.basePos   = group.position.clone();
      s.meshCount = meshCount;

      rebuildLegend();
      log(`✅ ${part.label} ×${meshCount}`, 'ok');
      resolve(group);
    }, undefined, err => {
      log(`❌ ${part.label} — ${err.message || err}`, 'err');
      resolve(null);
    });
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
PARTS.forEach(p => {
  STATE[p.label] = {
    group: null, origGroup: null, origMats: null, origBox: null,
    basePos: null, visible: true, replaced: false,
    pill: null, color: p.color, meshCount: 0,
  };
});

rebuildLegend();
log('🚀 Loading parts…', 'info');

Promise.all(PARTS.map(p => loadPart(p))).then(results => {
  const ok = results.filter(Boolean).length;
  log(`🎉 ${ok}/${results.length} parts loaded`, 'ok');
  summaryEl.textContent = `✅ ${ok}/${results.length} parts ready`;
  rebuildLegend();

  const box = new THREE.Box3();
  scene.traverse(o => { if (o.isMesh) box.expandByObject(o); });
  if (!box.isEmpty()) {
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(center.x, center.y + maxDim * 0.6, center.z + maxDim * 1.2);
    orbitCtrl.target.copy(center);
    orbitCtrl.update();
  }

  setTimeout(() => {
    document.getElementById('log-panel').classList.add('hidden');
    document.getElementById('log-reopen').classList.add('visible');
  }, 3000);
});

// ── RAYCASTER ─────────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
const tooltip   = document.getElementById('tooltip');

renderer.domElement.addEventListener('pointermove', ev => {
  mouse.x =  (ev.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = [];
  scene.traverse(obj => { if (obj.isMesh && obj.visible) meshes.push(obj); });
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length) {
    const label = hits[0].object.userData.partLabel ?? '?';
    tooltip.style.display = 'block';
    tooltip.style.left    = (ev.clientX + 14) + 'px';
    tooltip.style.top     = (ev.clientY - 10) + 'px';
    tooltip.textContent   = label + (STATE[label]?.replaced ? ' [R]' : '');
  } else {
    tooltip.style.display = 'none';
  }
});

renderer.domElement.addEventListener('click', ev => {
  mouse.x =  (ev.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = [];
  scene.traverse(obj => { if (obj.isMesh && obj.visible) meshes.push(obj); });
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length) {
    const label = hits[0].object.userData.partLabel;
    if (label && STATE[label]?.group) selectPart(label);
  }
});

renderer.domElement.addEventListener('pointerleave', () => {
  tooltip.style.display = 'none';
});

// ── RENDER LOOP ───────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  orbitCtrl.update();
  renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
