<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Step 05 — Camera + Click | Ramen Shop</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0f; color:#e0e0e0; font-family:'Courier New',monospace; height:100vh; width:100vw; overflow:hidden; }
    canvas { display:block; position:fixed; top:0; left:0; width:100%; height:100%; }

    #topbar {
      position:fixed; top:0; left:0; right:0; height:44px;
      background:rgba(0,0,0,0.82); backdrop-filter:blur(8px);
      border-bottom:1px solid #2a2a3a;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 14px; z-index:200;
    }
    #topbar .title  { font-size:11px; letter-spacing:2px; color:#ff7f00; text-transform:uppercase; }
    #topbar .status { font-size:11px; color:#888; }

    .btn { background:#1a1a2a; border:1px solid #3a3a5a; color:#ccc; border-radius:6px; padding:5px 12px; font-size:11px; font-family:'Courier New',monospace; cursor:pointer; transition:background 0.2s; }
    .btn:hover  { background:#2a2a4a; }
    .btn.active { background:#ff7f0033; border-color:#ff7f00; color:#ff7f00; }

    #btn-row { position:fixed; top:52px; right:10px; display:flex; flex-direction:column; gap:6px; z-index:200; }

    #log-panel {
      position:fixed; top:52px; left:10px; right:10px; max-height:55vh; overflow-y:auto;
      background:rgba(0,0,0,0.93); border:1px solid #2a2a3a; border-radius:10px;
      padding:12px 14px; z-index:100; transition:opacity 0.3s, transform 0.3s;
    }
    #log-panel.hidden { opacity:0; pointer-events:none; transform:translateY(-8px); }

    .log-entry { font-size:11px; line-height:1.85; padding:1px 0; border-bottom:1px solid #111; display:flex; gap:7px; word-break:break-all; }
    .log-entry.ok      { color:#4eca8b; }
    .log-entry.err     { color:#ff5f5f; font-weight:bold; }
    .log-entry.info    { color:#f0c060; }
    .log-entry.pending { color:#888; }
    .log-entry.head    { color:#adf; font-weight:bold; }
    .log-entry.click   { color:#ff7f00; font-weight:bold; }

    #progress-bar-wrap { margin-top:8px; height:4px; background:#1a1a2a; border-radius:3px; overflow:hidden; }
    #progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#ff7f00,#00ff7f); transition:width 0.3s; }
    #summary { margin-top:6px; font-size:10px; color:#666; }

    /* ── MODE INDICATOR ── */
    #mode-indicator {
      position:fixed; bottom:52px; left:50%; transform:translateX(-50%);
      font-size:11px; letter-spacing:1px; text-transform:uppercase;
      background:rgba(0,0,0,0.75); border:1px solid #333;
      padding:5px 16px; border-radius:20px; z-index:100;
      pointer-events:none; transition:all 0.3s;
    }

    /* ── BACK BUTTON ── */
    #back-btn {
      position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
      display:none; z-index:150;
    }
    #back-btn button {
      background:#1a1a2a; border:1px solid #ff7f00; color:#ff7f00;
      border-radius:20px; padding:8px 24px; font-size:12px;
      font-family:'Courier New',monospace; cursor:pointer;
      letter-spacing:1px;
    }
    #back-btn button:hover { background:#2a1a0a; }

    #scene-legend {
      position:fixed; bottom:50px; left:14px;
      font-size:10px; color:#555; z-index:100; line-height:2.0; pointer-events:none;
    }
    #hint {
      position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
      font-size:10px; color:#333; z-index:100; text-align:center;
      background:rgba(0,0,0,0.5); padding:4px 14px; border-radius:20px; pointer-events:none;
    }
  </style>
</head>

<script>
  function toggleLog() {
    const p = document.getElementById('log-panel');
    const b = document.getElementById('btn-log');
    const hidden = p.classList.toggle('hidden');
    b.classList.toggle('active', !hidden);
  }
  function hideAll() {
    document.getElementById('log-panel').classList.add('hidden');
    document.getElementById('btn-log').classList.remove('active');
  }
</script>

<script type="module">
import * as THREE        from 'three';
import TWEEN             from 'three/addons/libs/tween.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader }    from 'three/addons/loaders/KTX2Loader.js';
import gsap              from 'gsap';

const GLTF_PATH  = './models/ramenShop.gltf';
const DRACO_PATH = 'https://www.gstatic.com/draco/versioned/decoders/1.5.6/';
const BASIS_PATH = 'https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/libs/basis/';

// ── LOG ──────────────────────────────────────────────────────
const logWrap   = document.getElementById('log-entries');
const barEl     = document.getElementById('progress-bar');
const summaryEl = document.getElementById('summary');
const topStatus = document.getElementById('top-status');
const modeEl    = document.getElementById('mode-indicator');
const backBtn   = document.getElementById('back-btn');
const icons     = { pending:'⏳', ok:'✅', err:'❌', info:'📌', head:'──', click:'👆' };

function log(msg, type='info') {
  const d = document.createElement('div');
  d.className = `log-entry ${type}`;
  d.innerHTML = `<span>${icons[type]||'·'}</span><span>${msg}</span>`;
  logWrap.appendChild(d);
  logWrap.scrollTop = logWrap.scrollHeight;
  console.log(`[${type}] ${msg}`);
}
function setBar(pct)         { barEl.style.width = pct+'%'; }
function setStatus(msg, col) { topStatus.textContent=msg; topStatus.style.color=col||'#888'; }

window.addEventListener('error', e => log('ERROR: '+e.message,'err'));
window.addEventListener('unhandledrejection', e => log('REJECT: '+(e.reason?.message||e.reason),'err'));

// ── RENDERER ─────────────────────────────────────────────────
const canvas = document.createElement('canvas');
document.body.prepend(canvas);

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFShadowMap;

// ── SCENE ────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.add(new THREE.GridHelper(100, 40, 0x111130, 0x0a0a20));

// ── CAMERA ───────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(-8, 14, 28);

// ── CONTROLS ─────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2, 0, 0);
controls.enableDamping  = true;
controls.dampingFactor  = 0.07;
controls.maxPolarAngle  = Math.PI / 2;
controls.minDistance    = 1;
controls.maxDistance    = 300;
controls.update();

// ── FLOOR ────────────────────────────────────────────────────
const mshFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshPhongMaterial({ color: 0x444444 })
);
mshFloor.rotation.x    = -Math.PI * 0.5;
mshFloor.receiveShadow = true;
mshFloor.position.set(0, -0.05, 0);
scene.add(mshFloor);

// ── REFERENCE BOX ────────────────────────────────────────────
const mshBox = new THREE.Mesh(
  new THREE.BoxGeometry(7.5, 2.5, 5.0),
  new THREE.MeshPhongMaterial({ color: 0xaaaaaa })
);
mshBox.castShadow    = true;
mshBox.receiveShadow = true;
mshBox.position.set(0, 15.5, 0);
scene.add(mshBox);

// ── LIGHTS ───────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.04));

const shadowLight = new THREE.DirectionalLight(0xffffff, 0.4);
shadowLight.position.set(5, 30, 8);
shadowLight.castShadow = true;
shadowLight.shadow.mapSize.set(2048, 2048);
shadowLight.shadow.camera.near   =  1;
shadowLight.shadow.camera.far    = 80;
shadowLight.shadow.camera.left   = -30;
shadowLight.shadow.camera.right  =  30;
shadowLight.shadow.camera.top    =  30;
shadowLight.shadow.camera.bottom = -30;
shadowLight.shadow.bias          = -0.001;
scene.add(shadowLight, shadowLight.target);

const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
fillLight.position.set(-10, 20, -10);
scene.add(fillLight);

// ── SPOTLIGHTS (Step 1 — preserved exactly) ──────────────────
function createSpotlight(color) {
  const l = new THREE.SpotLight(color, 800);
  l.castShadow = true; l.angle = 0.3; l.penumbra = 0.2; l.decay = 2; l.distance = 60;
  return l;
}
const spotLight1 = createSpotlight(0xFF7F00);
const spotLight2 = createSpotlight(0x00FF7F);
const spotLight3 = createSpotlight(0x7F00FF);
spotLight1.position.set( 5, 20, 8);
spotLight2.position.set( 0, 20, 6);
spotLight3.position.set(-5, 20, 8);
spotLight1.target.position.set( 2, 0, 0);
spotLight2.target.position.set( 0, 0, 0);
spotLight3.target.position.set(-2, 0, 0);
scene.add(spotLight1.target, spotLight2.target, spotLight3.target);
const lh1 = new THREE.SpotLightHelper(spotLight1);
const lh2 = new THREE.SpotLightHelper(spotLight2);
const lh3 = new THREE.SpotLightHelper(spotLight3);
scene.add(spotLight1, spotLight2, spotLight3, lh1, lh2, lh3);

log('Renderer · Scene · Lights ready ✓', 'ok');
setBar(4);

// ── LOADERS ──────────────────────────────────────────────────
const ktx2Loader = new KTX2Loader();
ktx2Loader.setTranscoderPath(BASIS_PATH);
ktx2Loader.detectSupport(renderer);

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath(DRACO_PATH);
dracoLoader.preload();

const texLoader  = new THREE.TextureLoader();
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);
gltfLoader.setKTX2Loader(ktx2Loader);

log('Loaders ready ✓', 'ok');
setBar(6);

// ── TEXTURE HELPERS ──────────────────────────────────────────
const texCache = {};
function loadKTX2(path) {
  return new Promise(resolve => {
    if (texCache[path]) { resolve(texCache[path]); return; }
    ktx2Loader.load(path, t=>{texCache[path]=t;resolve(t);}, undefined,
      ()=>{ const p=path.replace('.ktx2','.png');
            texLoader.load(p,t=>{texCache[path]=t;resolve(t);},undefined,()=>resolve(null)); });
  });
}
function loadPNG(path) {
  return new Promise(resolve => {
    if (texCache[path]) { resolve(texCache[path]); return; }
    texLoader.load(path,t=>{texCache[path]=t;resolve(t);},undefined,()=>resolve(null));
  });
}
function loadBasis(path) {
  return new Promise(resolve => {
    if (texCache[path]) { resolve(texCache[path]); return; }
    ktx2Loader.load(path,t=>{texCache[path]=t;resolve(t);},undefined,()=>resolve(null));
  });
}

function applyMat(meshMap, name, material) {
  const t = meshMap[name]; if (!t) return false;
  t.traverse(o=>{ if(o.isMesh) o.material=material; }); return true;
}
function bakedMat(tex) {
  tex.flipY=false; tex.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({map:tex});
}
function screenMat(tex) {
  tex.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({map:tex});
}
function videoMat(src) {
  const vid = document.createElement('video');
  vid.src=src; vid.loop=true; vid.muted=true; vid.playsInline=true; vid.crossOrigin='anonymous';
  vid.play().catch(()=>{});
  const tex = new THREE.VideoTexture(vid);
  tex.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({map:tex});
}
function cycleScreens(target, textures, intervalMs) {
  if (!textures.length) return; let idx=0;
  const set=()=>{const m=new THREE.MeshBasicMaterial({map:textures[idx]});target.traverse(o=>{if(o.isMesh)o.material=m;});};
  set(); if(textures.length<2) return;
  setInterval(()=>{idx=(idx+1)%textures.length;set();},intervalMs);
}

// ── MATERIAL DATA (Steps 2–4) ────────────────────────────────
const BAKED = [
  ['ramenShopJoined',    './textures/baked/ramenShopBaked1024.ktx2'],
  ['machinesJoined',     './textures/baked/machinesBaked1024.ktx2' ],
  ['floor',              './textures/baked/floorBaked1024.ktx2'    ],
  ['miscJoined',         './textures/baked/miscBaked1024.ktx2'     ],
  ['graphicsJoined',     './textures/baked/graphicsBaked512.ktx2'  ],
  ['jesseZhouJoined',    './textures/baked/ramenShopBaked1024.ktx2'],
  ['chinese',            './textures/baked/ramenShopBaked1024.ktx2'],
  ['easelFrontGraphic',  './textures/baked/ramenShopBaked1024.ktx2'],
  ['vendingMachineLight','./textures/baked/machinesBaked1024.ktx2' ],
  ['arcadeRim',          './textures/baked/machinesBaked1024.ktx2' ],
  ['arcadeToken',        './textures/baked/machinesBaked1024.ktx2' ],
  ['dishStand',          './textures/baked/ramenShopBaked1024.ktx2'],
];
const COLORS = [
  ['projectsRed',0xe8003c],['projectsWhite',0xffffff],
  ['aboutMeBlue',0x00cfff],['aboutMeBlack',0x111111],
  ['articlesRed',0xff4400],['articlesWhite',0xffffff],
  ['creditsOrange',0xff8800],['creditsBlack',0x111111],
  ['jZhouPink',0xff44aa],['jZhouBlack',0x111111],
  ['greenSignSquare',0x00cc44],['greenLED',0x00ff44],
  ['redLED',0xff2200],['yellowRightLight',0xffee00],['whiteButton',0xffffff],
];
const MATCAPS = [
  [['neonBlue'],                                           './textures/matcaps/neonBlueMatCap.ktx2',  null],
  [['neonGreen'],                                          './textures/matcaps/neonGreenMatCap.ktx2', null],
  [['neonPink','neonYellow'],                              './textures/matcaps/neonBlueMatCap.ktx2',  null],
  [['fan1','fan2'],                                        './textures/matcaps/fanMatCap.ktx2',        null],
  [['dish'],                                               './textures/matcaps/dishMatCap.ktx2',       null],
  [['lampLights'],                                         null,'./textures/matcaps/lightMatcap.png'       ],
  [['storageLight','portalLight','blueLights','poleLight'],'./textures/matcaps/neonBlueMatCap.ktx2',  null],
];
const SCREEN_SLIDES = [
  ['bigScreen',            './textures/screens/aboutMeScreens/bigScreenDefault.ktx2'           ],
  ['vendingMachineScreen', './textures/screens/vendingMachineScreens/vendingMachineDefault.ktx2'],
  ['arcadeScreen',         './textures/screens/arcadeScreens/arcadeScreenDefault.ktx2'          ],
  ['easelFrontGraphic',    './textures/screens/easel/easelTouch.ktx2'                           ],
];
const SIDE_PATHS  = ['sideScreen1','sideScreen2','sideScreen3'].map(n=>`./textures/screens/sideScreens/${n}.ktx2`);
const SMALL1_PATHS = [1,2,3,4,5].map(i=>`./textures/screens/smallScreen1/${i}.basis`);
const SMALL2_PATHS = [1,2,3,4,5].map(i=>`./textures/screens/smallScreen2/${i}.basis`);
const VIDEO_SCREENS = [
  ['littleTVScreen','./textures/videosTextures/littleTVScreen.mp4'],
  ['tallScreen',    './textures/videosTextures/tallScreen.mp4'    ],
  ['tvScreen',      './textures/videosTextures/tvScreen.mp4'      ],
  ['smallScreen3',  './textures/videosTextures/smallScreen3.mp4'  ],
  ['smallScreen4',  './textures/videosTextures/smallScreen4.mp4'  ],
  ['smallScreen5',  './textures/videosTextures/smallScreen5.mp4'  ],
];

// ─────────────────────────────────────────────────────────────
//  CAMERA POSITIONS
//  All coordinates derived from model size 49.9 × 10.09 × 49.9
//  and the original repo's CameraControls.js logic.
//
//  Each view has:
//    camPos  — where the camera moves to
//    target  — what the camera looks at (controls.target)
//    label   — mode indicator text
//    color   — mode indicator colour
//    orbitMin/Max — clamp orbit so user can't escape the view
// ─────────────────────────────────────────────────────────────
const VIEWS = {
  home: {
    camPos:   new THREE.Vector3(-8,  14,  28),
    target:   new THREE.Vector3( 2,   3,   0),
    label:    '● DEFAULT VIEW',
    color:    '#888',
    minPolar: 0,
    maxPolar: Math.PI / 2,
    minAzi:   -Infinity,
    maxAzi:    Infinity,
    minDist:  5,
    maxDist:  300,
  },
  projects: {
    // Vending machine — on the right side of the shop face
    // Camera comes in close from the front-right
    camPos:   new THREE.Vector3( 6,   3,  18),
    target:   new THREE.Vector3( 4,   3,   6),
    label:    '🛒 PROJECTS',
    color:    '#e8003c',
    minPolar: Math.PI * 0.3,
    maxPolar: Math.PI * 0.6,
    minAzi:   -0.4,
    maxAzi:    0.4,
    minDist:  4,
    maxDist:  20,
  },
  aboutMe: {
    // Big screen — high up on the building face, centred
    // Camera rises and steps back to see the full billboard
    camPos:   new THREE.Vector3( 0,  12,  22),
    target:   new THREE.Vector3( 0,   8,   0),
    label:    '👤 ABOUT ME',
    color:    '#00cfff',
    minPolar: Math.PI * 0.25,
    maxPolar: Math.PI * 0.5,
    minAzi:   -0.3,
    maxAzi:    0.3,
    minDist:  8,
    maxDist:  30,
  },
  articles: {
    // Side screen / sign area — left side of the shop
    camPos:   new THREE.Vector3(-10,  4,  18),
    target:   new THREE.Vector3(-4,   4,   4),
    label:    '📰 ARTICLES',
    color:    '#ff4400',
    minPolar: Math.PI * 0.3,
    maxPolar: Math.PI * 0.6,
    minAzi:   -0.5,
    maxAzi:    0.5,
    minDist:  4,
    maxDist:  20,
  },
  credits: {
    // Arcade cabinet — far left of the machines section
    camPos:   new THREE.Vector3(-6,   2,  14),
    target:   new THREE.Vector3(-3,   2,   4),
    label:    '🎮 CREDITS',
    color:    '#ff8800',
    minPolar: Math.PI * 0.3,
    maxPolar: Math.PI * 0.6,
    minAzi:   -0.5,
    maxAzi:    0.5,
    minDist:  3,
    maxDist:  15,
  },
};

// Current mode state
let currentMode    = 'home';
let isTransitioning = false;   // lock clicks during camera move

// ─────────────────────────────────────────────────────────────
//  CAMERA TWEEN
//  Animates both camera.position and controls.target smoothly.
//  GSAP tweens both simultaneously — controls.target must be
//  updated inside onUpdate so OrbitControls tracks the new pivot.
// ─────────────────────────────────────────────────────────────
function flyTo(viewKey) {
  if (isTransitioning) return;
  if (currentMode === viewKey) return;

  isTransitioning = true;
  controls.enabled = false;   // disable drag during transition

  const view = VIEWS[viewKey];
  const fromPos    = camera.position.clone();
  const fromTarget = controls.target.clone();

  // Proxy objects for GSAP to tween
  const posProxy = { x: fromPos.x,    y: fromPos.y,    z: fromPos.z    };
  const tgtProxy = { x: fromTarget.x, y: fromTarget.y, z: fromTarget.z };

  // Tween camera position
  gsap.to(posProxy, {
    x: view.camPos.x, y: view.camPos.y, z: view.camPos.z,
    duration: 1.8,
    ease: 'power2.inOut',
    onUpdate() {
      camera.position.set(posProxy.x, posProxy.y, posProxy.z);
    }
  });

  // Tween controls target (pivot point)
  gsap.to(tgtProxy, {
    x: view.target.x, y: view.target.y, z: view.target.z,
    duration: 1.8,
    ease: 'power2.inOut',
    onUpdate() {
      controls.target.set(tgtProxy.x, tgtProxy.y, tgtProxy.z);
      controls.update();
    },
    onComplete() {
      // Apply orbit constraints for this view
      controls.minPolarAngle = view.minPolar;
      controls.maxPolarAngle = view.maxPolar;
      controls.minAzimuthAngle = view.minAzi;
      controls.maxAzimuthAngle = view.maxAzi;
      controls.minDistance = view.minDist;
      controls.maxDistance = view.maxDist;
      controls.enabled = true;
      isTransitioning  = false;
      currentMode      = viewKey;

      // Update UI
      modeEl.textContent  = view.label;
      modeEl.style.color  = view.color;
      backBtn.style.display = viewKey === 'home' ? 'none' : 'block';

      log(`📍 Arrived: ${view.label}`, 'click');
    }
  });

  log(`🎬 Flying to: ${view.label}`, 'click');

  // Show mode indicator immediately
  modeEl.textContent = view.label;
  modeEl.style.color = view.color;
}

// Go back to home from any view
window.goHome = function() {
  flyTo('home');
  // Restore home orbit constraints after tween
  setTimeout(() => {
    controls.minPolarAngle   = VIEWS.home.minPolar;
    controls.maxPolarAngle   = VIEWS.home.maxPolar;
    controls.minAzimuthAngle = VIEWS.home.minAzi;
    controls.maxAzimuthAngle = VIEWS.home.maxAzi;
    controls.minDistance     = VIEWS.home.minDist;
    controls.maxDistance     = VIEWS.home.maxDist;
    backBtn.style.display = 'none';
  }, 2000);
};

// ─────────────────────────────────────────────────────────────
//  RAYCASTER
// ─────────────────────────────────────────────────────────────
const raycaster   = new THREE.Raycaster();
const pointer     = new THREE.Vector2();
let clickableMeshes = [];   // populated after GLTF loads

// Map of mesh name → view key (what to navigate to when clicked)
const CLICK_MAP = {
  // Sign post signs
  'projectsRed':    'projects',
  'projectsWhite':  'projects',
  'aboutMeBlue':    'aboutMe',
  'aboutMeBlack':   'aboutMe',
  'articlesRed':    'articles',
  'articlesWhite':  'articles',
  'creditsOrange':  'credits',
  'creditsBlack':   'credits',
  // Screens themselves — also clickable
  'vendingMachineScreen': 'projects',
  'bigScreen':            'aboutMe',
  'arcadeScreen':         'credits',
  'sideScreen':           'articles',
};

function getCanvasXY(event) {
  // Handles both mouse and touch
  const rect = renderer.domElement.getBoundingClientRect();
  const clientX = event.touches ? event.touches[0].clientX : event.clientX;
  const clientY = event.touches ? event.touches[0].clientY : event.clientY;
  return {
    x:  ((clientX - rect.left) / rect.width)  * 2 - 1,
    y: -((clientY - rect.top)  / rect.height) * 2 + 1,
  };
}

function onPointerDown(event) {
  // Record pointer-down position to distinguish tap from drag
  pointer._downX = event.touches ? event.touches[0].clientX : event.clientX;
  pointer._downY = event.touches ? event.touches[0].clientY : event.clientY;
}

function onPointerUp(event) {
  if (isTransitioning) return;

  // Only fire if movement was tiny (tap, not drag)
  const upX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
  const upY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;
  const dx = Math.abs(upX - (pointer._downX||0));
  const dy = Math.abs(upY - (pointer._downY||0));
  if (dx > 8 || dy > 8) return;   // was a drag, not a tap

  // Convert to NDC
  const rect = renderer.domElement.getBoundingClientRect();
  const clientX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
  const clientY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;
  pointer.x =  ((clientX - rect.left) / rect.width)  * 2 - 1;
  pointer.y = -((clientY - rect.top)  / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickableMeshes, false);

  if (hits.length > 0) {
    const hitName = hits[0].object.name;
    const viewKey = CLICK_MAP[hitName];
    if (viewKey) {
      log(`👆 Clicked: ${hitName} → ${viewKey}`, 'click');
      flyTo(viewKey);
    }
  }
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointerup',   onPointerUp);
renderer.domElement.addEventListener('touchstart',  onPointerDown, { passive:true });
renderer.domElement.addEventListener('touchend',    onPointerUp,   { passive:true });

// ─────────────────────────────────────────────────────────────
//  MAIN LOAD
// ─────────────────────────────────────────────────────────────
log('Fetching GLTF …', 'pending');

fetch(GLTF_PATH)
  .then(r=>{ if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
  .then(()=>{ log('GLTF reachable ✓','ok'); setBar(8); loadGLTF(); })
  .catch(err=>{ log('FETCH FAILED: '+err.message,'err'); setStatus('Error ❌','#ff5f5f'); });

function loadGLTF() {
  log('GLTFLoader parsing …','pending');

  gltfLoader.load(GLTF_PATH, async (gltf) => {
    log('GLTF parsed ✓','ok'); setBar(18);

    const model   = gltf.scene;
    const meshMap = {};
    model.traverse(o=>{ if(o.name) meshMap[o.name]=o; });
    log(`${Object.keys(meshMap).length} named objects ✓`,'ok');

    // Centre model
    const bbox   = new THREE.Box3().setFromObject(model);
    const center = bbox.getCenter(new THREE.Vector3());
    const size   = bbox.getSize(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= bbox.min.y;
    model.traverse(c=>{ if(c.isMesh){ c.receiveShadow=true; c.castShadow=false; } });
    scene.add(model);

    const shopH = size.y;
    mshBox.position.set(0, shopH+3.5, 0);
    spotLight1.position.set( 5, shopH+14, 8);
    spotLight2.position.set( 0, shopH+14, 6);
    spotLight3.position.set(-5, shopH+14, 8);
    log(`Model: ${size.x.toFixed(1)}×${shopH.toFixed(1)}×${size.z.toFixed(1)}`,'info');
    setBar(22);

    // ── BUILD CLICKABLE MESH LIST ────────────────────────
    // Collect actual Mesh objects (not Groups) for raycasting
    Object.entries(CLICK_MAP).forEach(([name]) => {
      const obj = meshMap[name];
      if (!obj) return;
      obj.traverse(o => {
        if (o.isMesh) {
          clickableMeshes.push(o);
          o.userData.clickName = name;   // store original name for lookup
        }
      });
    });
    // Override raycaster name lookup to use userData
    // (mesh.name may differ from group name after traverse)
    raycaster._nameMap = CLICK_MAP;
    log(`Raycaster: ${clickableMeshes.length} clickable meshes registered`,'ok');

    // Patch onPointerUp to use userData.clickName
    renderer.domElement.removeEventListener('pointerup', onPointerUp);
    renderer.domElement.removeEventListener('touchend',  onPointerUp);
    const onPointerUpPatched = (event) => {
      if (isTransitioning) return;
      const upX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
      const upY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;
      const dx = Math.abs(upX-(pointer._downX||0));
      const dy = Math.abs(upY-(pointer._downY||0));
      if (dx>8||dy>8) return;
      const rect = renderer.domElement.getBoundingClientRect();
      const cx = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
      const cy = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;
      pointer.x =  ((cx-rect.left)/rect.width)*2-1;
      pointer.y = -((cy-rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(clickableMeshes, false);
      if (hits.length > 0) {
        const hitName = hits[0].object.userData.clickName || hits[0].object.name;
        const viewKey = CLICK_MAP[hitName];
        if (viewKey) { log(`👆 Clicked: ${hitName} → ${viewKey}`,'click'); flyTo(viewKey); }
      }
    };
    renderer.domElement.addEventListener('pointerup', onPointerUpPatched);
    renderer.domElement.addEventListener('touchend',  onPointerUpPatched, {passive:true});

    // ── STEP 2: BAKED ────────────────────────────────────
    log('── Baked textures ──','head');
    for (const [name,ktx2] of BAKED) {
      const tex = await loadKTX2(ktx2);
      if (!tex) { log(`  ✗ baked FAILED: ${name}`,'err'); continue; }
      const hit = applyMat(meshMap, name, bakedMat(tex));
      log(`  ${hit?'✓':'✗'} ${name}`, hit?'ok':'err');
    }
    fillLight.intensity = 0.0;
    setBar(38);

    // ── STEP 2: COLOURS ──────────────────────────────────
    log('── Flat colours ──','head');
    for (const [name,hex] of COLORS) {
      const hit = applyMat(meshMap, name, new THREE.MeshBasicMaterial({color:hex}));
      log(`  ${hit?'✓':'✗'} ${name}`, hit?'ok':'err');
    }
    setBar(44);

    // ── STEP 3: MATCAPS ──────────────────────────────────
    log('── Matcaps ──','head');
    for (const [names,ktx2,png] of MATCAPS) {
      const tex = ktx2 ? await loadKTX2(ktx2) : await loadPNG(png);
      if (!tex) { log(`  ✗ matcap FAILED: ${ktx2||png}`,'err'); continue; }
      const mat = new THREE.MeshMatcapMaterial({matcap:tex});
      for (const n of names) { const h=applyMat(meshMap,n,mat); log(`  ${h?'✓':'✗'} matcap→${n}`,h?'ok':'err'); }
    }
    setBar(54);

    // ── STEP 4: SCREENS ──────────────────────────────────
    log('── Static screens ──','head');
    for (const [name,path] of SCREEN_SLIDES) {
      const tex=await loadKTX2(path); if(!tex){log(`  ✗ slide FAILED:${name}`,'err');continue;}
      const hit=applyMat(meshMap,name,screenMat(tex)); log(`  ${hit?'✓':'✗'} ${name}`,hit?'ok':'err');
    }
    const sideTex=(await Promise.all(SIDE_PATHS.map(loadKTX2))).filter(Boolean);
    sideTex.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;});
    if(meshMap['sideScreen']&&sideTex.length){cycleScreens(meshMap['sideScreen'],sideTex,3000);log('  ✓ sideScreen cycling','ok');}
    const s1=(await Promise.all(SMALL1_PATHS.map(loadBasis))).filter(Boolean);
    s1.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;});
    if(meshMap['smallScreen1']&&s1.length){cycleScreens(meshMap['smallScreen1'],s1,2000);log('  ✓ smallScreen1 cycling','ok');}
    const s2=(await Promise.all(SMALL2_PATHS.map(loadBasis))).filter(Boolean);
    s2.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;});
    if(meshMap['smallScreen2']&&s2.length){cycleScreens(meshMap['smallScreen2'],s2,2000);log('  ✓ smallScreen2 cycling','ok');}
    log('── Video screens ──','head');
    for(const [name,src] of VIDEO_SCREENS){const hit=applyMat(meshMap,name,videoMat(src));log(`  ${hit?'✓':'✗'} video→${name}`,hit?'ok':'err');}
    setBar(90);

    // ── DONE ─────────────────────────────────────────────
    log('── Step 5 ready ──','head');
    log('Click a sign (Projects / About Me / Articles / Credits) to navigate','ok');
    log('Or tap the named screen meshes directly','ok');
    setStatus('✅ Click any sign to navigate','#4eca8b');
    summaryEl.textContent='Steps 1-5 complete · Raycaster active · GSAP camera transitions live';
    setBar(100);

    setTimeout(()=>{
      hideAll();
      document.getElementById('hint').textContent=
        'Click: Projects · About Me · Articles · Credits  |  📋 Log →';
    }, 3000);

  },
  (xhr)=>{ if(xhr.total) setBar(8+Math.round((xhr.loaded/xhr.total)*10)); },
  (err)=>{ log('GLTFLoader ERROR: '+(err?.message||err),'err'); setStatus('Error ❌','#ff5f5f'); });
}

// ── SPOTLIGHT TWEENS (Step 1 — unchanged) ────────────────────
function tweenSpot(light) {
  new TWEEN.Tween(light)
    .to({angle:(Math.random()*0.7)+0.1,penumbra:Math.random()+1},Math.random()*3000+2000)
    .easing(TWEEN.Easing.Quadratic.Out).start();
  const bY=light.position.y;
  new TWEEN.Tween(light.position)
    .to({x:(Math.random()*16)-8,y:bY+(Math.random()*4)-2,z:(Math.random()*16)-8},Math.random()*3000+2000)
    .easing(TWEEN.Easing.Quadratic.Out).start();
}
function updateTweens(){
  tweenSpot(spotLight1);tweenSpot(spotLight2);tweenSpot(spotLight3);
  setTimeout(updateTweens,5000);
}

// ── RENDER LOOP ───────────────────────────────────────────────
(function tick(){
  requestAnimationFrame(tick);
  TWEEN.update();
  controls.update();
  lh1.update(); lh2.update(); lh3.update();
  renderer.render(scene,camera);
})();

updateTweens();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
