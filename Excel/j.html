<script type="module">
import * as THREE        from 'three';
import TWEEN             from 'three/addons/libs/tween.module.js';

const GLTF_SHOP    = './models/ramenShop.gltf';
const GLTF_HOLO    = './models/ramenHologram.gltf';
const DRACO_PATH   = 'https://www.gstatic.com/draco/versioned/decoders/1.5.6/';
const BASIS_PATH   = 'https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/libs/basis/';

// ── LOG ──────────────────────────────────────────────────────
const logWrap=document.getElementById('log-entries'),barEl=document.getElementById('progress-bar');
const summaryEl=document.getElementById('summary'),topStatus=document.getElementById('top-status');
const modeEl=document.getElementById('mode-indicator'),backBtn=document.getElementById('back-btn');
const subnavEl=document.getElementById('subnav'),coordEl=document.getElementById('coord-debug');
const icons={pending:'⏳',ok:'✅',err:'❌',info:'📌',head:'──',click:'👆',screen:'🖥'};
function log(msg,type='info'){const d=document.createElement('div');d.className=`log-entry ${type}`;d.innerHTML=`<span>${icons[type]||'·'}</span><span>${msg}</span>`;logWrap.appendChild(d);logWrap.scrollTop=logWrap.scrollHeight;console.log(`[${type}] ${msg}`);}
function setBar(pct){barEl.style.width=pct+'%';}
function setStatus(msg,col){topStatus.textContent=msg;topStatus.style.color=col||'#888';}
window.addEventListener('error',e=>log('ERROR: '+e.message,'err'));
window.addEventListener('unhandledrejection',e=>log('REJECT: '+(e.reason?.message||e.reason),'err'));

// ── RENDERER ─────────────────────────────────────────────────
const canvas=document.createElement('canvas'); document.body.prepend(canvas);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;

// ── SCENE ────────────────────────────────────────────────────
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
scene.add(new THREE.GridHelper(100,40,0x111130,0x0a0a20));

// ── CAMERA ───────────────────────────────────────────────────
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,2000);
camera.position.set(-11,8,22);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2,-2); controls.enableDamping=true; controls.dampingFactor=0.07;
controls.maxPolarAngle=Math.PI/2; controls.minDistance=1; controls.maxDistance=300; controls.update();

// ── FLOOR ────────────────────────────────────────────────────
const mshFloor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshPhongMaterial({color:0x444444}));
mshFloor.rotation.x=-Math.PI*0.5; mshFloor.receiveShadow=true; mshFloor.position.set(0,-0.05,0); scene.add(mshFloor);

// ── LIGHTS ───────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff,0.04));
const shadowLight=new THREE.DirectionalLight(0xffffff,0.4);
shadowLight.position.set(5,30,8); shadowLight.castShadow=true;
shadowLight.shadow.mapSize.set(2048,2048);
shadowLight.shadow.camera.near=1; shadowLight.shadow.camera.far=80;
shadowLight.shadow.camera.left=-30; shadowLight.shadow.camera.right=30;
shadowLight.shadow.camera.top=30; shadowLight.shadow.camera.bottom=-30;
shadowLight.shadow.bias=-0.001;
scene.add(shadowLight,shadowLight.target);
const fillLight=new THREE.DirectionalLight(0xffffff,1.0);
fillLight.position.set(-10,20,-10); scene.add(fillLight);

// ── SPOTLIGHTS (Step 1 — preserved) ──────────────────────────
function createSpotlight(color){const l=new THREE.SpotLight(color,800);l.castShadow=true;l.angle=0.3;l.penumbra=0.2;l.decay=2;l.distance=60;return l;}
const spotLight1=createSpotlight(0xFF7F00),spotLight2=createSpotlight(0x00FF7F),spotLight3=createSpotlight(0x7F00FF);
spotLight1.position.set(5,20,8); spotLight2.position.set(0,20,6); spotLight3.position.set(-5,20,8);
spotLight1.target.position.set(2,0,0); spotLight2.target.position.set(0,0,0); spotLight3.target.position.set(-2,0,0);
scene.add(spotLight1.target,spotLight2.target,spotLight3.target);
const lh1=new THREE.SpotLightHelper(spotLight1),lh2=new THREE.SpotLightHelper(spotLight2),lh3=new THREE.SpotLightHelper(spotLight3);
scene.add(spotLight1,spotLight2,spotLight3,lh1,lh2,lh3);
setBar(4);

// ── LOADERS ──────────────────────────────────────────────────
const ktx2Loader=new KTX2Loader(); ktx2Loader.setTranscoderPath(BASIS_PATH); ktx2Loader.detectSupport(renderer);
const dracoLoader=new DRACOLoader(); dracoLoader.setDecoderPath(DRACO_PATH); dracoLoader.preload();
const texLoader=new THREE.TextureLoader();
const gltfLoader=new GLTFLoader(); gltfLoader.setDRACOLoader(dracoLoader); gltfLoader.setKTX2Loader(ktx2Loader);
setBar(6);

// ── TEXTURE HELPERS ──────────────────────────────────────────
const texCache={};
function loadKTX2(path){return new Promise(r=>{if(texCache[path]){r(texCache[path]);return;}ktx2Loader.load(path,t=>{texCache[path]=t;r(t);},undefined,()=>{const p=path.replace('.ktx2','.png');texLoader.load(p,t=>{texCache[path]=t;r(t);},undefined,()=>r(null));});});}
function loadPNG(path){return new Promise(r=>{if(texCache[path]){r(texCache[path]);return;}texLoader.load(path,t=>{texCache[path]=t;r(t);},undefined,()=>r(null));});}
function loadBasis(path){return new Promise(r=>{if(texCache[path]){r(texCache[path]);return;}ktx2Loader.load(path,t=>{texCache[path]=t;r(t);},undefined,()=>r(null));});}
function applyMat(meshMap,name,material){const t=meshMap[name];if(!t)return false;t.traverse(o=>{if(o.isMesh)o.material=material;});return true;}
function bakedMat(tex){tex.flipY=false;tex.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:tex});}
function screenMat(tex){tex.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:tex});}
function videoMat(src){const v=document.createElement('video');v.src=src;v.loop=true;v.muted=true;v.playsInline=true;v.crossOrigin='anonymous';v.play().catch(()=>{});const t=new THREE.VideoTexture(v);t.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:t});}
function cycleScreens(target,textures,intervalMs){if(!textures.length)return;let idx=0;const set=()=>{const m=new THREE.MeshBasicMaterial({map:textures[idx]});target.traverse(o=>{if(o.isMesh)o.material=m;});};set();if(textures.length<2)return;return setInterval(()=>{idx=(idx+1)%textures.length;set();},intervalMs);}

// ── MATERIAL DATA (Steps 2–6) ─────────────────────────────────
const BAKED=[['ramenShopJoined','./textures/baked/ramenShopBaked1024.ktx2'],['machinesJoined','./textures/baked/machinesBaked1024.ktx2'],['miscJoined','./textures/baked/miscBaked1024.ktx2'],['graphicsJoined','./textures/baked/graphicsBaked512.ktx2'],['jesseZhouJoined','./textures/baked/ramenShopBaked1024.ktx2'],['chinese','./textures/baked/ramenShopBaked1024.ktx2'],['easelFrontGraphic','./textures/baked/ramenShopBaked1024.ktx2'],['vendingMachineLight','./textures/baked/machinesBaked1024.ktx2'],['arcadeRim','./textures/baked/machinesBaked1024.ktx2'],['arcadeToken','./textures/baked/machinesBaked1024.ktx2'],['dishStand','./textures/baked/ramenShopBaked1024.ktx2']];
const COLORS=[['projectsRed',0xe8003c],['projectsWhite',0xffffff],['aboutMeBlue',0x00cfff],['aboutMeBlack',0x111111],['articlesRed',0xff4400],['articlesWhite',0xffffff],['creditsOrange',0xff8800],['creditsBlack',0x111111],['jZhouPink',0xff44aa],['jZhouBlack',0x111111],['greenSignSquare',0x00cc44],['greenLED',0x00ff44],['redLED',0xff2200],['yellowRightLight',0xffee00],['whiteButton',0xffffff]];
const MATCAPS=[[['neonBlue'],'./textures/matcaps/neonBlueMatCap.ktx2',null],[['neonGreen'],'./textures/matcaps/neonGreenMatCap.ktx2',null],[['neonPink','neonYellow'],'./textures/matcaps/neonBlueMatCap.ktx2',null],[['fan1','fan2'],'./textures/matcaps/fanMatCap.ktx2',null],[['dish'],'./textures/matcaps/dishMatCap.ktx2',null],[['lampLights'],null,'./textures/matcaps/lightMatcap.png'],[['storageLight','portalLight','blueLights','poleLight'],'./textures/matcaps/neonBlueMatCap.ktx2',null]];
const VIDEO_SCREENS=[['littleTVScreen','./textures/videosTextures/littleTVScreen.mp4'],['tallScreen','./textures/videosTextures/tallScreen.mp4'],['tvScreen','./textures/videosTextures/tvScreen.mp4'],['smallScreen3','./textures/videosTextures/smallScreen3.mp4'],['smallScreen4','./textures/videosTextures/smallScreen4.mp4'],['smallScreen5','./textures/videosTextures/smallScreen5.mp4']];
const SIDE_PATHS=['sideScreen1','sideScreen2','sideScreen3'].map(n=>`./textures/screens/sideScreens/${n}.ktx2`);
const SMALL1_PATHS=[1,2,3,4,5].map(i=>`./textures/screens/smallScreen1/${i}.basis`);
const SMALL2_PATHS=[1,2,3,4,5].map(i=>`./textures/screens/smallScreen2/${i}.basis`);
const SCREEN_TEX={};
const SCREEN_LOAD_LIST=[['bigScreenDefault','./textures/screens/aboutMeScreens/bigScreenDefault.ktx2'],['vendingDefault','./textures/screens/vendingMachineScreens/vendingMachineDefault.ktx2'],['arcadeDefault','./textures/screens/arcadeScreens/arcadeScreenDefault.ktx2'],['easelTouch','./textures/screens/easel/easelTouch.ktx2'],['bigScreenAbout','./textures/screens/aboutMeScreens/bigScreenAbout.ktx2'],['bigScreenAboutMobile','./textures/screens/aboutMeScreens/bigScreenAboutMobile.ktx2'],['bigScreenSkills','./textures/screens/aboutMeScreens/bigScreenSkills.ktx2'],['bigScreenSkillsMobile','./textures/screens/aboutMeScreens/bigScreenSkillsMobile.ktx2'],['bigScreenExperience','./textures/screens/aboutMeScreens/bigScreenExperience.ktx2'],['bigScreenExpMobile','./textures/screens/aboutMeScreens/bigScreenExperienceMobile.ktx2'],['vendingMenu','./textures/screens/vendingMachineScreens/vendingMachineMenu.ktx2'],['project1','./textures/screens/vendingMachineScreens/project1.ktx2'],['project2','./textures/screens/vendingMachineScreens/project2.ktx2'],['project3','./textures/screens/vendingMachineScreens/project3.ktx2'],['project4','./textures/screens/vendingMachineScreens/project4.ktx2'],['project5','./textures/screens/vendingMachineScreens/project5.ktx2'],['project6','./textures/screens/vendingMachineScreens/project6.ktx2'],['project7','./textures/screens/vendingMachineScreens/project7.ktx2'],['project8','./textures/screens/vendingMachineScreens/project8.ktx2'],['arcadeCredits','./textures/screens/arcadeScreens/arcadeScreenCredits.ktx2'],['arcadeThanks','./textures/screens/arcadeScreens/arcadeScreenThanks.ktx2']];

let meshMap={};
const isMobile=innerWidth<600;
function setScreen(name,key){const tex=SCREEN_TEX[key];if(!tex){log(`  ✗ tex not loaded: ${key}`,'err');return;}applyMat(meshMap,name,screenMat(tex));log(`  🖥 ${name}→${key}`,'screen');}

// ─────────────────────────────────────────────────────────────
//  HOLOGRAM SHADER
//
//  Vertex shader:
//    - Passes model-space position as vPosition (for scan lines)
//    - Passes view-space normal as vNormal (for fresnel rim)
//    - Passes UV coords
//    - Applies glitchy horizontal vertex displacement on Y axis
//
//  Fragment shader:
//    - Horizontal scan lines: fract(vPosition.y * frequency + time)
//    - Fresnel rim glow: pow(1.0 - dot(vNormal, viewDir), power)
//    - Pulsing opacity: sin(time) drives alpha
//    - Additive blending makes overlapping areas brighter (hologram glow)
//    - Color: teal/cyan (#00ffcc) matching the original app
// ─────────────────────────────────────────────────────────────

const holoVertexShader = /* glsl */`
  uniform float uTime;

  varying vec3  vPosition;   // model-space position for scan lines
  varying vec3  vNormal;     // view-space normal for fresnel
  varying vec2  vUv;

  void main() {
    vec4 modelPosition = modelMatrix * vec4(position, 1.0);

    // Glitch: random horizontal displacement on scan-line bands
    // Only displaces every ~20th unit vertically, creates jitter
    float glitchStrength = 0.08;
    float glitchTime     = uTime * 0.5;
    float band = step(0.98, sin(modelPosition.y * 3.0 + glitchTime * 7.0));
    modelPosition.x += (fract(sin(glitchTime * 13.741) * 1731.7) - 0.5) * glitchStrength * band;

    gl_Position = projectionMatrix * viewMatrix * modelPosition;

    // Pass model-space Y for scan line positioning
    vPosition = modelPosition.xyz;

    // View-space normal for fresnel calculation
    vec4 modelNormal = modelMatrix * vec4(normal, 0.0);
    vNormal = normalize(modelNormal.xyz);

    vUv = uv;
  }
`;

const holoFragmentShader = /* glsl */`
  uniform float uTime;
  uniform vec3  uColor;      // hologram tint color
  uniform float uOpacity;    // master opacity (driven externally by gsap)

  varying vec3 vPosition;
  varying vec3 vNormal;
  varying vec2 vUv;

  void main() {
    // ── 1. SCAN LINES ─────────────────────────────────────────
    // Animated horizontal bands scrolling upward over time
    float scanFreq    = 30.0;           // lines per unit
    float scanSpeed   = 0.4;
    float scanLines   = fract(vPosition.y * scanFreq - uTime * scanSpeed);
    // Make lines thin and bright at peaks, dark in troughs
    float scanStrip   = step(0.85, scanLines);
    float scanAlpha   = scanStrip * 0.6 + 0.2;  // base 0.2 + bright strip

    // ── 2. FRESNEL RIM GLOW ───────────────────────────────────
    // Bright at silhouette edges, transparent in the centre
    vec3  viewDir     = normalize(cameraPosition - vPosition);
    float fresnel     = pow(1.0 - dot(normalize(vNormal), viewDir), 3.5);
    fresnel           = clamp(fresnel, 0.0, 1.0);

    // ── 3. PULSING OPACITY ────────────────────────────────────
    float pulse       = sin(uTime * 1.8) * 0.08 + 0.92;   // 0.84 – 1.0

    // ── 4. COMBINE ────────────────────────────────────────────
    float alpha = (scanAlpha + fresnel * 0.8) * pulse * uOpacity;
    alpha = clamp(alpha, 0.0, 1.0);

    // Colour: uColor tinted scan lines + brighter fresnel rim
    vec3 color = uColor;
    color += uColor * fresnel * 1.2;      // rim is extra bright
    color += vec3(1.0) * scanStrip * 0.3; // scan peaks slightly white

    gl_FragColor = vec4(color, alpha);

    // Required Three.js chunks for tone mapping + colour space
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

// ─────────────────────────────────────────────────────────────
//  HOLOGRAM SETUP
//  ramenHologram.gltf size: 106.97 × 78.01 × 91.56
//  Target display size: ~7 × 5 × 6 units (same footprint as old box)
//  Scale factor: 7 / 106.97 ≈ 0.065
// ─────────────────────────────────────────────────────────────
const HOLO_SCALE   = 0.065;
const HOLO_COLOR   = new THREE.Color(0x00ffcc);  // teal cyan — matches original

let holoMaterial = null;   // shared across all hologram meshes
let holoGroup    = null;   // the loaded gltf group

function buildHologramMaterial() {
  holoMaterial = new THREE.ShaderMaterial({
    vertexShader:   holoVertexShader,
    fragmentShader: holoFragmentShader,
    uniforms: {
      uTime:    { value: 0.0 },
      uColor:   { value: HOLO_COLOR },
      uOpacity: { value: 0.85 },
    },
    transparent:  true,
    side:         THREE.DoubleSide,   // visible from inside and outside
    depthWrite:   false,              // transparent objects shouldn't write depth
    blending:     THREE.AdditiveBlending,  // additive = glowing light effect
  });
  return holoMaterial;
}

function loadHologram(shopHeight) {
  log('Loading ramenHologram.gltf …', 'pending');

  gltfLoader.load(
    GLTF_HOLO,
    (gltf) => {
      log('ramenHologram.gltf parsed ✓', 'ok');

      holoGroup = gltf.scene;

      // ── Centre the hologram on its own bounds ──
      const bbox   = new THREE.Box3().setFromObject(holoGroup);
      const center = bbox.getCenter(new THREE.Vector3());
      const size   = bbox.getSize(new THREE.Vector3());
      log(`Hologram raw size: ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)}`, 'info');

      // Shift geometry centre to origin before scaling
      holoGroup.position.x -= center.x;
      holoGroup.position.z -= center.z;
      holoGroup.position.y -= bbox.min.y;

      // ── Scale to fit above the shop ──
      holoGroup.scale.setScalar(HOLO_SCALE);

      // ── Position: same spot where reference box was ──
      // Shop height = shopHeight, we add a gap + half hologram height
      const scaledH = size.y * HOLO_SCALE;
      holoGroup.position.y = shopHeight + 1.5 + scaledH * 0.5;

      // ── Apply hologram shader to every mesh ──
      const mat = buildHologramMaterial();
      let meshCount = 0;
      holoGroup.traverse(child => {
        if (child.isMesh) {
          child.material    = mat;
          child.castShadow  = true;    // casts coloured additive shadows — multicolour floor glow
          child.receiveShadow = false;
          meshCount++;
        }
      });

      scene.add(holoGroup);
      log(`Hologram: ${meshCount} meshes · scale ${HOLO_SCALE} · y=${holoGroup.position.y.toFixed(2)}`, 'ok');

      // ── Slow rotation animation ──
      // Stored on userData so tick() can access it
      holoGroup.userData.rotateY = true;

      // ── Entrance animation: fade in over 2s ──
      holoMaterial.uniforms.uOpacity.value = 0.0;
      gsap.to(holoMaterial.uniforms.uOpacity, {
        value: 0.85, duration: 2.0, ease: 'power2.out'
      });

      log('Hologram entrance animation started ✓', 'ok');
    },
    (xhr) => { if (xhr.total) log(`  Hologram: ${Math.round(xhr.loaded/xhr.total*100)}%`, 'pending'); },
    (err) => { log('ramenHologram.gltf ERROR: ' + (err?.message || err), 'err'); }
  );
}

// ── SUBNAV + SCREEN HANDLERS (Step 6 — preserved) ────────────
let sideInterval = null, creditsTimer = null;

function buildSubnav(tabs){
  subnavEl.innerHTML=''; subnavEl.style.setProperty('--sub-color',tabs.color||'#00cfff');
  tabs.buttons.forEach((btn,i)=>{
    const el=document.createElement('button');el.textContent=btn.label;
    if(i===0)el.classList.add('active');
    el.addEventListener('click',()=>{subnavEl.querySelectorAll('button').forEach(b=>b.classList.remove('active'));el.classList.add('active');btn.action();});
    subnavEl.appendChild(el);
  });
  subnavEl.classList.add('visible');
  if(tabs.buttons[0])tabs.buttons[0].action();
}
function hideSubnav(){subnavEl.classList.remove('visible');subnavEl.innerHTML='';}

function activateProjects(){setScreen('vendingMachineScreen','vendingMenu');buildSubnav({color:'#e8003c',buttons:[{label:'📋 Menu',action:()=>setScreen('vendingMachineScreen','vendingMenu')},{label:'P1',action:()=>setScreen('vendingMachineScreen','project1')},{label:'P2',action:()=>setScreen('vendingMachineScreen','project2')},{label:'P3',action:()=>setScreen('vendingMachineScreen','project3')},{label:'P4',action:()=>setScreen('vendingMachineScreen','project4')},{label:'P5',action:()=>setScreen('vendingMachineScreen','project5')},{label:'P6',action:()=>setScreen('vendingMachineScreen','project6')},{label:'P7',action:()=>setScreen('vendingMachineScreen','project7')},{label:'P8',action:()=>setScreen('vendingMachineScreen','project8')}]});}
function activateAboutMe(){const ak=isMobile?'bigScreenAboutMobile':'bigScreenAbout',sk=isMobile?'bigScreenSkillsMobile':'bigScreenSkills',ek=isMobile?'bigScreenExpMobile':'bigScreenExperience';buildSubnav({color:'#00cfff',buttons:[{label:'👤 About',action:()=>setScreen('bigScreen',ak)},{label:'🛠 Skills',action:()=>setScreen('bigScreen',sk)},{label:'💼 Experience',action:()=>setScreen('bigScreen',ek)}]});}
function activateArticles(){if(sideInterval){clearInterval(sideInterval);sideInterval=null;}const tex=SCREEN_TEX['sideScreen1'];if(tex)applyMat(meshMap,'sideScreen',new THREE.MeshBasicMaterial({map:tex}));hideSubnav();}
function activateCredits(){setScreen('arcadeScreen','arcadeCredits');if(creditsTimer)clearTimeout(creditsTimer);creditsTimer=setTimeout(()=>setScreen('arcadeScreen','arcadeThanks'),4000);hideSubnav();}
function activateHome(){
  setScreen('bigScreen','bigScreenDefault'); setScreen('vendingMachineScreen','vendingDefault'); setScreen('arcadeScreen','arcadeDefault');
  if(sideInterval)clearInterval(sideInterval);
  const sideTex=['sideScreen1','sideScreen2','sideScreen3'].map(k=>SCREEN_TEX[k]).filter(Boolean);
  if(sideTex.length&&meshMap['sideScreen'])sideInterval=cycleScreens(meshMap['sideScreen'],sideTex,3000);
  if(creditsTimer){clearTimeout(creditsTimer);creditsTimer=null;}
  hideSubnav();
}

// ── VIEWS (tuned Step 5 coordinates) ─────────────────────────
const VIEWS={
  home:     {camPos:new THREE.Vector3(-11,8,22),     target:new THREE.Vector3(0,2,-2),      label:'● DEFAULT VIEW',color:'#888',    minPolar:0,maxPolar:Math.PI/2,minAzi:-Infinity,maxAzi:Infinity,minDist:5,maxDist:300,  onArrive:activateHome},
  projects: {camPos:new THREE.Vector3(1.65,2.91,7.53),target:new THREE.Vector3(0.57,1.05,0.20),label:'🛒 PROJECTS', color:'#e8003c',minPolar:Math.PI*0.25,maxPolar:Math.PI*0.6,minAzi:-0.4,maxAzi:0.4,minDist:2,maxDist:14,onArrive:activateProjects},
  aboutMe:  {camPos:new THREE.Vector3(1.27,7.25,10.47),target:new THREE.Vector3(0.45,7.13,-2.00),label:'👤 ABOUT ME',color:'#00cfff',minPolar:Math.PI*0.2,maxPolar:Math.PI*0.5,minAzi:-0.3,maxAzi:0.3,minDist:4,maxDist:20,onArrive:activateAboutMe},
  articles: {camPos:new THREE.Vector3(-0.60,7.94,11.76),target:new THREE.Vector3(-0.00,2.00,-2.00),label:'📰 ARTICLES',color:'#ff4400',minPolar:Math.PI*0.2,maxPolar:Math.PI*0.6,minAzi:-0.5,maxAzi:0.5,minDist:3,maxDist:18,onArrive:activateArticles},
  credits:  {camPos:new THREE.Vector3(-1.19,2.69,6.13),target:new THREE.Vector3(0.47,0.35,-0.12),label:'🎮 CREDITS', color:'#ff8800',minPolar:Math.PI*0.25,maxPolar:Math.PI*0.6,minAzi:-0.5,maxAzi:0.5,minDist:2,maxDist:12,onArrive:activateCredits},
};

let currentMode='home', isTransitioning=false;

function flyTo(viewKey){
  if(isTransitioning||currentMode===viewKey)return;
  isTransitioning=true; controls.enabled=false;
  const view=VIEWS[viewKey];
  const pp={x:camera.position.x,y:camera.position.y,z:camera.position.z};
  const tp={x:controls.target.x,y:controls.target.y,z:controls.target.z};
  gsap.to(pp,{x:view.camPos.x,y:view.camPos.y,z:view.camPos.z,duration:1.8,ease:'power2.inOut',onUpdate(){camera.position.set(pp.x,pp.y,pp.z);}});
  gsap.to(tp,{x:view.target.x,y:view.target.y,z:view.target.z,duration:1.8,ease:'power2.inOut',
    onUpdate(){controls.target.set(tp.x,tp.y,tp.z);controls.update();},
    onComplete(){
      controls.minPolarAngle=view.minPolar;controls.maxPolarAngle=view.maxPolar;
      controls.minAzimuthAngle=view.minAzi;controls.maxAzimuthAngle=view.maxAzi;
      controls.minDistance=view.minDist;controls.maxDistance=view.maxDist;
      controls.enabled=true;isTransitioning=false;currentMode=viewKey;
      modeEl.textContent=view.label;modeEl.style.color=view.color;
      backBtn.style.display=viewKey==='home'?'none':'block';
      if(view.onArrive)view.onArrive();
      log(`📍 Arrived: ${view.label}`,'click');
    }
  });
  log(`🎬 Flying to: ${view.label}`,'click');
  modeEl.textContent=view.label; modeEl.style.color=view.color;
}

window.goHome=function(){if(isTransitioning)return;currentMode='temp';flyTo('home');setTimeout(()=>{controls.minPolarAngle=VIEWS.home.minPolar;controls.maxPolarAngle=VIEWS.home.maxPolar;controls.minAzimuthAngle=VIEWS.home.minAzi;controls.maxAzimuthAngle=VIEWS.home.maxAzi;controls.minDistance=VIEWS.home.minDist;controls.maxDistance=VIEWS.home.maxDist;backBtn.style.display='none';},2000);};

// ── RAYCASTER ────────────────────────────────────────────────
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
let clickableMeshes=[];
const CLICK_MAP={'projectsRed':'projects','projectsWhite':'projects','aboutMeBlue':'aboutMe','aboutMeBlack':'aboutMe','articlesRed':'articles','articlesWhite':'articles','creditsOrange':'credits','creditsBlack':'credits','vendingMachineScreen':'projects','bigScreen':'aboutMe','arcadeScreen':'credits','sideScreen':'articles'};
function onDown(e){pointer._dx=e.touches?e.touches[0].clientX:e.clientX;pointer._dy=e.touches?e.touches[0].clientY:e.clientY;}
function onUp(e){
  if(isTransitioning)return;
  const cx=e.changedTouches?e.changedTouches[0].clientX:e.clientX,cy=e.changedTouches?e.changedTouches[0].clientY:e.clientY;
  if(Math.abs(cx-(pointer._dx||0))>8||Math.abs(cy-(pointer._dy||0))>8)return;
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((cx-rect.left)/rect.width)*2-1;pointer.y=-((cy-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(clickableMeshes,false);
  if(hits.length){const name=hits[0].object.userData.clickName||hits[0].object.name;const vk=CLICK_MAP[name];if(vk){log(`👆 ${name}→${vk}`,'click');flyTo(vk);}}
}
renderer.domElement.addEventListener('pointerdown',onDown);
renderer.domElement.addEventListener('pointerup',onUp);
renderer.domElement.addEventListener('touchstart',onDown,{passive:true});
renderer.domElement.addEventListener('touchend',onUp,{passive:true});

// ─────────────────────────────────────────────────────────────
//  MAIN LOAD — shop first, then hologram
// ─────────────────────────────────────────────────────────────
log('Fetching shop GLTF …','pending');
fetch(GLTF_SHOP)
  .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text();})
  .then(()=>{log('Shop GLTF reachable ✓','ok');setBar(8);loadShop();})
  .catch(err=>{log('FETCH FAILED: '+err.message,'err');setStatus('Error ❌','#ff5f5f');});

function loadShop(){
  log('Loading ramenShop.gltf …','pending');
  gltfLoader.load(GLTF_SHOP, async(gltf)=>{
    log('ramenShop.gltf parsed ✓','ok'); setBar(18);
    const model=gltf.scene;
    model.traverse(o=>{if(o.name)meshMap[o.name]=o;});
    const bbox=new THREE.Box3().setFromObject(model);
    const center=bbox.getCenter(new THREE.Vector3()),size=bbox.getSize(new THREE.Vector3());
    model.position.x-=center.x;model.position.z-=center.z;model.position.y-=bbox.min.y;
    model.traverse(c=>{if(c.isMesh){c.receiveShadow=true;c.castShadow=false;}});
    scene.add(model);
    const shopH=size.y;
    // Reposition spotlights to shop height
    spotLight1.position.set(5,shopH+14,8);spotLight2.position.set(0,shopH+14,6);spotLight3.position.set(-5,shopH+14,8);
    log(`Shop: ${size.x.toFixed(1)}×${shopH.toFixed(1)}×${size.z.toFixed(1)}`,'info');
    setBar(22);

    // Build clickables
    Object.keys(CLICK_MAP).forEach(name=>{const obj=meshMap[name];if(!obj)return;obj.traverse(o=>{if(o.isMesh){o.userData.clickName=name;clickableMeshes.push(o);}});});

    // ── BAKED ──────────────────────────────────────────────
    log('── Baked ──','head');
    for(const[name,ktx2]of BAKED){const tex=await loadKTX2(ktx2);if(!tex)continue;applyMat(meshMap,name,bakedMat(tex));}
    fillLight.intensity=0.0; setBar(38);
    for(const[name,hex]of COLORS)applyMat(meshMap,name,new THREE.MeshBasicMaterial({color:hex}));
    setBar(44);

    // ── MATCAPS ────────────────────────────────────────────
    log('── Matcaps ──','head');
    for(const[names,ktx2,png]of MATCAPS){const tex=ktx2?await loadKTX2(ktx2):await loadPNG(png);if(!tex)continue;const mat=new THREE.MeshMatcapMaterial({matcap:tex});names.forEach(n=>applyMat(meshMap,n,mat));}
    setBar(54);

    // ── VIDEO + SMALL SCREENS ──────────────────────────────
    log('── Video + small screens ──','head');
    for(const[name,src]of VIDEO_SCREENS)applyMat(meshMap,name,videoMat(src));
    const s1=(await Promise.all(SMALL1_PATHS.map(loadBasis))).filter(Boolean);s1.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;});if(meshMap['smallScreen1']&&s1.length)cycleScreens(meshMap['smallScreen1'],s1,2000);
    const s2=(await Promise.all(SMALL2_PATHS.map(loadBasis))).filter(Boolean);s2.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;});if(meshMap['smallScreen2']&&s2.length)cycleScreens(meshMap['smallScreen2'],s2,2000);
    setBar(65);

    // ── PRELOAD SCREEN TEXTURES ────────────────────────────
    log('── Screen textures ──','head');
    const sideTexLoaded=[];
    for(const p of SIDE_PATHS){const tex=await loadKTX2(p);if(tex){tex.colorSpace=THREE.SRGBColorSpace;SCREEN_TEX[p.split('/').pop().replace('.ktx2','')]=tex;sideTexLoaded.push(tex);}}
    if(meshMap['sideScreen']&&sideTexLoaded.length)sideInterval=cycleScreens(meshMap['sideScreen'],sideTexLoaded,3000);
    let loaded=0;
    for(const[key,path]of SCREEN_LOAD_LIST){const tex=await loadKTX2(path);if(tex){tex.colorSpace=THREE.SRGBColorSpace;SCREEN_TEX[key]=tex;loaded++;}setBar(65+Math.round((loaded/SCREEN_LOAD_LIST.length)*20));}
    log(`  ✓ ${loaded}/${SCREEN_LOAD_LIST.length} screen textures`,'ok');

    // Apply default screens
    setScreen('bigScreen','bigScreenDefault');setScreen('vendingMachineScreen','vendingDefault');setScreen('arcadeScreen','arcadeDefault');
    const et=SCREEN_TEX['easelTouch'];if(et)applyMat(meshMap,'easelFrontGraphic',screenMat(et));
    setBar(88);

    // ── NOW LOAD HOLOGRAM ──────────────────────────────────
    log('── Step 7: Hologram ──','head');
    loadHologram(shopH);

    setStatus('✅ Steps 1–7 loading','#4eca8b');
    summaryEl.textContent='All systems loaded · Hologram shader active · Click any sign';
    setBar(100);

    setTimeout(()=>{hideAll();document.getElementById('hint').textContent='Click a sign  |  Sub-tabs after arriving  |  ← Back';},3000);

  },
  (xhr)=>{if(xhr.total)setBar(8+Math.round((xhr.loaded/xhr.total)*10));},
  (err)=>{log('Shop ERROR: '+(err?.message||err),'err');setStatus('Error ❌','#ff5f5f');}
  );
}

// ── SPOTLIGHT TWEENS ─────────────────────────────────────────
function tweenSpot(l){new TWEEN.Tween(l).to({angle:(Math.random()*0.7)+0.1,penumbra:Math.random()+1},Math.random()*3000+2000).easing(TWEEN.Easing.Quadratic.Out).start();const bY=l.position.y;new TWEEN.Tween(l.position).to({x:(Math.random()*16)-8,y:bY+(Math.random()*4)-2,z:(Math.random()*16)-8},Math.random()*3000+2000).easing(TWEEN.Easing.Quadratic.Out).start();}
function updateTweens(){tweenSpot(spotLight1);tweenSpot(spotLight2);tweenSpot(spotLight3);setTimeout(updateTweens,5000);}

// ── COORD DEBUG ──────────────────────────────────────────────
let showCoords=true;
coordEl.addEventListener('click',()=>{showCoords=!showCoords;coordEl.style.opacity=showCoords?'1':'0.2';});

// ── RENDER LOOP ───────────────────────────────────────────────
const clock = new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const elapsed = clock.getElapsedTime();

  TWEEN.update();
  controls.update();
  lh1.update();lh2.update();lh3.update();

  // ── Hologram updates ────────────────────────────────────
  if(holoMaterial){
    // Drive uTime uniform — powers scan lines, glitch, pulse
    holoMaterial.uniforms.uTime.value = elapsed;
  }
  if(holoGroup && holoGroup.userData.rotateY){
    // Slow continuous rotation — 1 full turn every ~20 seconds
    holoGroup.rotation.y = elapsed * 0.31;
  }

  renderer.render(scene,camera);

  if(showCoords){
    const p=camera.position,t=controls.target;
    coordEl.innerHTML=`<span style="color:#adf">cam</span> ${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}<br><span style="color:#fa0">tgt</span> ${t.x.toFixed(2)} ${t.y.toFixed(2)} ${t.z.toFixed(2)}<br><span style="color:#555">${currentMode}</span>`;
  }
})();

updateTweens();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
