<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍜 Jesse's Ramen — Portfolio</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0f; color:#e0e0e0; font-family:'Courier New',monospace; height:100vh; width:100vw; overflow:hidden; }
    canvas { display:block; position:fixed; top:0; left:0; width:100%; height:100%; }
    #topbar {
      position:fixed; top:0; left:0; right:0; height:44px;
      background:rgba(0,0,0,0.82); backdrop-filter:blur(8px);
      border-bottom:1px solid #2a2a3a;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 14px; z-index:200;
    }
    #topbar .title  { font-size:11px; letter-spacing:2px; color:#ff7f00; text-transform:uppercase; }
    #topbar .status { font-size:11px; color:#888; }
    .btn { background:#1a1a2a; border:1px solid #3a3a5a; color:#ccc; border-radius:6px; padding:5px 12px; font-size:11px; font-family:'Courier New',monospace; cursor:pointer; transition:background 0.2s; }
    .btn:hover  { background:#2a2a4a; }
    .btn.active { background:#ff7f0033; border-color:#ff7f00; color:#ff7f00; }
    #btn-row { position:fixed; top:52px; right:10px; display:flex; flex-direction:column; gap:6px; z-index:200; }
    #log-panel {
      position:fixed; top:52px; left:10px; right:10px; max-height:55vh; overflow-y:auto;
      background:rgba(0,0,0,0.93); border:1px solid #2a2a3a; border-radius:10px;
      padding:12px 14px; z-index:100; transition:opacity 0.3s, transform 0.3s;
    }
    #log-panel.hidden { opacity:0; pointer-events:none; transform:translateY(-8px); }
    .log-entry { font-size:11px; line-height:1.85; padding:1px 0; border-bottom:1px solid #111; display:flex; gap:7px; word-break:break-all; }
    .log-entry.ok      { color:#4eca8b; }
    .log-entry.err     { color:#ff5f5f; font-weight:bold; }
    .log-entry.info    { color:#f0c060; }
    .log-entry.pending { color:#888; }
    .log-entry.head    { color:#adf; font-weight:bold; }
    .log-entry.click   { color:#ff7f00; font-weight:bold; }
    .log-entry.screen  { color:#f4f; }
    #progress-bar-wrap { margin-top:8px; height:4px; background:#1a1a2a; border-radius:3px; overflow:hidden; }
    #progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#ff7f00,#00ff7f); transition:width 0.3s; }
    #summary { margin-top:6px; font-size:10px; color:#666; }
    #mode-indicator {
      position:fixed; bottom:52px; left:50%; transform:translateX(-50%);
      font-size:11px; letter-spacing:1px; text-transform:uppercase;
      background:rgba(0,0,0,0.75); border:1px solid #333;
      padding:5px 16px; border-radius:20px; z-index:100; pointer-events:none;
    }
    #subnav {
      position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
      display:none; gap:8px; z-index:150; flex-wrap:wrap; justify-content:center;
    }
    #subnav.visible { display:flex; }
    #subnav button {
      background:#0a0a1a; border:1px solid #444; color:#aaa;
      border-radius:14px; padding:6px 14px; font-size:11px;
      font-family:'Courier New',monospace; cursor:pointer; transition:all 0.2s;
    }
    #subnav button:hover  { background:#1a1a2a; color:#fff; }
    #subnav button.active { border-color:var(--sub-color,#00cfff); color:var(--sub-color,#00cfff); background:#0a0a2a; }
    #back-btn { position:fixed; bottom:52px; left:14px; display:none; z-index:150; }
    #back-btn button {
      background:#1a1a2a; border:1px solid #ff7f00; color:#ff7f00;
      border-radius:20px; padding:7px 18px; font-size:11px;
      font-family:'Courier New',monospace; cursor:pointer;
    }
    #coord-debug {
      position:fixed; bottom:130px; left:14px; font-size:10px; color:#ff7f00;
      z-index:50; line-height:1.8; pointer-events:auto; cursor:pointer;
      font-family:'Courier New',monospace; background:rgba(0,0,0,0.7);
      padding:5px 9px; border-radius:6px;
    }
    #hint {
      position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
      font-size:10px; color:#333; z-index:100; text-align:center;
      background:rgba(0,0,0,0.5); padding:4px 14px; border-radius:20px; pointer-events:none;
    }

    /* ── LOADING SCREEN ── */
    #loading-screen {
      position:fixed; inset:0; z-index:1000;
      background:#000;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      transition:opacity 0.8s ease;
    }
    #loading-screen.fade-out { opacity:0; pointer-events:none; }

    #loading-logo {
      font-size:52px; margin-bottom:12px;
      animation:float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-8px); }
    }

    #loading-title {
      font-family:'Courier New',monospace;
      font-size:13px; letter-spacing:4px; color:#ff7f00;
      text-transform:uppercase; margin-bottom:4px;
    }
    #loading-sub {
      font-family:'Courier New',monospace;
      font-size:10px; letter-spacing:2px; color:#444;
      text-transform:uppercase; margin-bottom:32px;
    }

    /* Neon bar */
    #loading-bar-wrap {
      width:220px; height:3px;
      background:#111; border-radius:2px;
      margin-bottom:10px; overflow:hidden;
    }
    #loading-bar-fill {
      height:100%; width:0%;
      background:linear-gradient(90deg,#ff7f00,#00eeff);
      border-radius:2px;
      transition:width 0.3s ease;
      box-shadow:0 0 8px #ff7f00, 0 0 16px #00eeff;
    }
    #loading-pct {
      font-family:'Courier New',monospace;
      font-size:10px; color:#555; letter-spacing:2px;
    }
    #loading-status {
      font-family:'Courier New',monospace;
      font-size:10px; color:#333; margin-top:8px;
      letter-spacing:1px; min-height:14px;
    }

    /* Tap-to-start overlay (shown after load, before first gesture) */
    #tap-overlay {
      position:fixed; inset:0; z-index:900;
      display:none;
      align-items:center; justify-content:center;
      flex-direction:column; gap:12px;
      background:rgba(0,0,0,0.72);
      backdrop-filter:blur(4px);
    }
    #tap-overlay.visible { display:flex; }
    #tap-overlay .tap-label {
      font-family:'Courier New',monospace;
      font-size:13px; letter-spacing:3px; color:#ff7f00;
      text-transform:uppercase;
      animation:pulse 1.4s ease-in-out infinite;
    }
    #tap-overlay .tap-sub {
      font-family:'Courier New',monospace;
      font-size:10px; letter-spacing:2px; color:#555;
    }
    @keyframes pulse {
      0%,100% { opacity:1; }
      50%      { opacity:0.3; }
    }

    /* Hide debug elements in final */
    #coord-debug { display:none !important; }
    #topbar       { display:none !important; }
    #btn-row      { display:none !important; }
    #log-panel    { display:none !important; }
    #scene-legend { display:none !important; }
  </style>
</head>

<script>
  function toggleLog() {
    const p=document.getElementById('log-panel');
    const b=document.getElementById('btn-log');
    const h=p.classList.toggle('hidden');
    b.classList.toggle('active',!h);
  }
  function hideAll() {
    document.getElementById('log-panel').classList.add('hidden');
    document.getElementById('btn-log').classList.remove('active');
  }

  // ── Loading screen controller ──
  const loadingScreen  = document.getElementById('loading-screen');
  const loadingBarFill = document.getElementById('loading-bar-fill');
  const loadingPct     = document.getElementById('loading-pct');
  const loadingStatus  = document.getElementById('loading-status');
  const tapOverlay     = document.getElementById('tap-overlay');

  window.setLoadProgress = function(pct, status) {
    loadingBarFill.style.width = pct + '%';
    loadingPct.textContent     = Math.round(pct) + '%';
    if (status) loadingStatus.textContent = status;
  };

  window.showTapOverlay = function() {
    loadingScreen.classList.add('fade-out');
    setTimeout(() => { loadingScreen.style.display = 'none'; }, 900);
    tapOverlay.classList.add('visible');
  };

  window.dismissTapOverlay = function() {
    tapOverlay.classList.remove('visible');
    tapOverlay.style.display = 'none';
  };

  // Tap overlay dismisses on first touch/click
  tapOverlay.addEventListener('pointerdown', () => {
    window.dismissTapOverlay();
  }, { once: true });
</script>

<script type="module">

mshFloor.rotation.x=-Math.PI*0.5; mshFloor.receiveShadow=true; mshFloor.position.set(0,-0.05,0); scene.add(mshFloor);
const mshBox=new THREE.Mesh(new THREE.BoxGeometry(7.5,2.5,5.0),new THREE.MeshPhongMaterial({color:0xaaaaaa}));

shadowLight.shadow.mapSize.set(2048,2048);
shadowLight.shadow.camera.near=1; shadowLight.shadow.camera.far=80;
shadowLight.shadow.camera.left=-30; shadowLight.shadow.camera.right=30;
shadowLight.shadow.camera.top=30; shadowLight.shadow.camera.bottom=-30;
shadowLight.shadow.bias=-0.001;
scene.add(shadowLight,shadowLight.target);
const fillLight=new THREE.DirectionalLight(0xffffff,1.0);
fillLight.position.set(-10,20,-10); scene.add(fillLight);

// ── SPOTLIGHTS ───────────────────────────────────────────────
function createSpotlight(color){
  const l=new THREE.SpotLight(color,800);
  l.castShadow=true;l.angle=0.3;l.penumbra=0.2;l.decay=2;l.distance=60; return l;
}
const spotLight1=createSpotlight(0xFF7F00);
const spotLight2=createSpotlight(0x00FF7F);
const spotLight3=createSpotlight(0x7F00FF);
spotLight1.position.set(5,20,8); spotLight2.position.set(0,20,6); spotLight3.position.set(-5,20,8);
spotLight1.target.position.set(2,0,0); spotLight2.target.position.set(0,0,0); spotLight3.target.position.set(-2,0,0);
scene.add(spotLight1.target,spotLight2.target,spotLight3.target);
const lh1=new THREE.SpotLightHelper(spotLight1);
const lh2=new THREE.SpotLightHelper(spotLight2);
const lh3=new THREE.SpotLightHelper(spotLight3);
scene.add(spotLight1,spotLight2,spotLight3,lh1,lh2,lh3);

// ── LOADERS ──────────────────────────────────────────────────

// ── TEXTURE HELPERS ──────────────────────────────────────────
const texCache={};
function loadKTX2(path){
  return new Promise(r=>{
    if(texCache[path]){r(texCache[path]);return;}
    ktx2Loader.load(path,t=>{texCache[path]=t;r(t);},undefined,
      ()=>{const p=path.replace('.ktx2','.png');texLoader.load(p,t=>{texCache[path]=t;r(t);},undefined,()=>r(null));});
  });
}
function loadPNG(path){
  return new Promise(r=>{
    if(texCache[path]){r(texCache[path]);return;}
    texLoader.load(path,t=>{texCache[path]=t;r(t);},undefined,()=>r(null));
  });
}
function loadBasis(path){
  return new Promise(r=>{
    if(texCache[path]){r(texCache[path]);return;}
    ktx2Loader.load(path,t=>{texCache[path]=t;r(t);},undefined,()=>r(null));
  });
}
function applyMat(meshMap,name,material){
  const t=meshMap[name];if(!t)return false;
  t.traverse(o=>{if(o.isMesh)o.material=material;});return true;
}
function bakedMat(tex){tex.flipY=false;tex.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:tex});}
function screenMat(tex){tex.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:tex});}
function videoMat(src){
  const v=document.createElement('video');
  v.src=src;v.loop=true;v.muted=true;v.playsInline=true;v.crossOrigin='anonymous';v.play().catch(()=>{});
  const t=new THREE.VideoTexture(v);t.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({map:t});
}
function cycleScreens(target,textures,intervalMs){
  if(!textures.length)return;let idx=0;
  const set=()=>{const m=new THREE.MeshBasicMaterial({map:textures[idx]});target.traverse(o=>{if(o.isMesh)o.material=m;});};
  set();if(textures.length<2)return;
  return setInterval(()=>{idx=(idx+1)%textures.length;set();},intervalMs);
}

// ─────────────────────────────────────────────────────────────
//  SELECTIVE BLOOM — Layer Mask Technique
//
//  Layer 0 = full scene (normal render)
//  Layer 1 = bloom-target meshes only
//
//  Pass 1: camera sees ONLY layer 1. UnrealBloomPass processes
//          this into a glow texture. Non-bloom meshes are
//          temporarily replaced with black so they contribute
//          zero light — preventing baked shop colours bleeding.
//  Pass 2: camera sees the full scene. A ShaderPass composites
//          the bloom texture on top additively.
//
//  Hologram meshes are tagged userData.isHologram = true and
//  skipped during the darken step — their custom GLSL shader
//  is never touched.
//
//  Bloom settings kept conservative:
//    strength  0.4  — visible glow, not a nuclear blowout
//    radius    0.5  — medium halo spread
//    threshold 0.0  — all matcap-bright neon pixels qualify
// ─────────────────────────────────────────────────────────────

const BLOOM_LAYER = 1;
const bloomLayer  = new THREE.Layers();
bloomLayer.set(BLOOM_LAYER);

// Only true neon / LED / light meshes — baked meshes excluded
const BLOOM_MESH_NAMES = new Set([
  'neonBlue','neonGreen','neonPink','neonYellow',
  'lampLights','storageLight','portalLight',
  'blueLights','poleLight',
  'greenLED','redLED','yellowRightLight',
  'whiteButton','vendingMachineLight','greenSignSquare',
]);

const darkMaterial  = new THREE.MeshBasicMaterial({ color: 0x000000 });
const materialStore = new Map();

function darkenNonBloom() {
  scene.traverse(obj => {
    if (!obj.isMesh) return;
    if (obj.userData.isHologram) return;      // never touch hologram
    if (obj.layers.test(bloomLayer)) return;  // bloom mesh, keep it
    materialStore.set(obj.uuid, obj.material);
    obj.material = darkMaterial;
  });
}
function restoreMaterials() {
  materialStore.forEach((mat, uuid) => {
    scene.traverse(obj => { if (obj.uuid === uuid) obj.material = mat; });
  });
  materialStore.clear();
}

function assignBloomLayers(meshMap) {
  let count = 0;
  BLOOM_MESH_NAMES.forEach(name => {
    const obj = meshMap[name]; if (!obj) return;
    obj.traverse(child => {
      if (child.isMesh) { child.layers.enable(BLOOM_LAYER); count++; }
    });
  });
  log(`Bloom layers assigned: ${count} mesh(es)`, 'ok');
}

// Composers — populated by buildBloomComposer()
let composer = null, bloomComposer = null;

async function buildBloomComposer() {
  try {
    const [
      { EffectComposer },
      { RenderPass },
      { UnrealBloomPass },
      { ShaderPass },
      { CopyShader },
    ] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/ShaderPass.js'),
      import('three/addons/shaders/CopyShader.js'),
    ]);

    const res = new THREE.Vector2(innerWidth, innerHeight);

    // ── Bloom-only composer ───────────────────────────────
    bloomComposer = new EffectComposer(renderer);
    bloomComposer.renderToScreen = false;
    bloomComposer.addPass(new RenderPass(scene, camera));
    bloomComposer.addPass(new UnrealBloomPass(res, 0.4, 0.5, 0.0));

    // ── Mix shader: composites bloom over base ────────────
    const MixShader = {
      uniforms: {
        baseTexture:  { value: null },
        bloomTexture: { value: bloomComposer.renderTarget2.texture },
      },
      vertexShader: `varying vec2 vUv;
        void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D baseTexture;
        uniform sampler2D bloomTexture;
        varying vec2 vUv;
        void main(){
          vec4 base  = texture2D(baseTexture, vUv);
          vec4 bloom = texture2D(bloomTexture, vUv);
          // Additive screen composite — bloom adds light, never darkens
          gl_FragColor = vec4(base.rgb + bloom.rgb, base.a);
        }`,
    };

    // ── Final composer: full scene + bloom mix ────────────
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const mixPass = new ShaderPass(
      new THREE.ShaderMaterial({
        uniforms:       MixShader.uniforms,
        vertexShader:   MixShader.vertexShader,
        fragmentShader: MixShader.fragmentShader,
      }),
      'baseTexture'
    );
    mixPass.needsSwap = true;
    composer.addPass(mixPass);
    composer.addPass(new ShaderPass(CopyShader));

    // Resize both composers together
    window.addEventListener('resize', () => {
      bloomComposer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });

    log('Bloom composer ready ✓  strength:0.4 radius:0.5 threshold:0.0', 'ok');
  } catch(err) {
    log('Bloom build FAILED: ' + err.message + ' — falling back to standard render', 'err');
    composer = null; bloomComposer = null;
  }
}

// ─────────────────────────────────────────────────────────────
//  SOUND ENGINE
//
//  All audio is handled through the Web Audio API via
//  THREE.AudioListener + THREE.Audio (non-positional).
//  We don't use positional audio because the shop is small
//  and all sounds should be heard at full volume regardless
//  of camera position.
//
//  Sound map:
//    cooking.mp3  — ambient background loop (quiet, always on)
//    hologram.mp3 — ambient hologram hum loop (quiet, always on)
//    whoosh.mp3   — camera fly transition (plays on every flyTo)
//    click.mp3    — sign / screen tap (plays on valid raycast hit)
//    ding.mp3     — vending machine project selection
//    bloop.mp3    — sub-nav tab press (About/Skills/Experience, P1-P8)
//    arcade.mp3   — plays when credits view activates
//
//  Browser autoplay policy: AudioContext must be resumed on the
//  first user gesture. We resume on the first pointerdown and
//  show a mute/unmute button in the UI.
// ─────────────────────────────────────────────────────────────

// AudioListener attaches to the camera — required by THREE.Audio
const audioListener = new THREE.AudioListener();
camera.add(audioListener);

// Sound store: name → { audio, buffer }
const SFX = {};
const ambientSounds = [];   // loops that should respect mute state

let audioReady   = false;   // true after first user gesture
let isMuted      = false;
let audioContext = audioListener.context;

// ── Mute button ────────────────────────────────────────────
const muteBtn = document.createElement('button');
muteBtn.id        = 'mute-btn';
muteBtn.className = 'btn';
muteBtn.textContent = '🔊';
muteBtn.style.cssText = 'position:fixed;bottom:52px;right:10px;z-index:200;font-size:14px;padding:5px 10px;';
document.body.appendChild(muteBtn);

muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  muteBtn.textContent = isMuted ? '🔇' : '🔊';
  // Mute/unmute all sounds via the listener gain
  audioListener.setMasterVolume(isMuted ? 0 : 1);
  log(isMuted ? 'Sound muted' : 'Sound unmuted', 'info');
});

// ── Load a sound ────────────────────────────────────────────
function loadSound(name, path, { loop=false, volume=1.0 }={}) {
  return new Promise(resolve => {
    const audio  = new THREE.Audio(audioListener);
    const loader = new THREE.AudioLoader();
    loader.load(
      path,
      buffer => {
        audio.setBuffer(buffer);
        audio.setLoop(loop);
        audio.setVolume(volume);
        SFX[name] = audio;
        if (loop) ambientSounds.push(audio);
        log(`  ✓ sound loaded: ${name}`, 'ok');
        resolve(audio);
      },
      undefined,
      err => {
        log(`  ✗ sound FAILED: ${name} — ${err?.message||'unknown'}`, 'err');
        resolve(null);
      }
    );
  });
}

// ── Play a one-shot sound ────────────────────────────────────
// Stops and restarts if already playing so rapid taps work
function playSound(name) {
  if (!audioReady || isMuted) return;
  const audio = SFX[name];
  if (!audio) return;
  if (audio.isPlaying) audio.stop();
  audio.play();
}

// ── Start ambient loops ──────────────────────────────────────
function startAmbient() {
  if (!audioReady) return;
  ['cooking', 'hologram'].forEach(name => {
    const a = SFX[name];
    if (a && !a.isPlaying) a.play();
  });
}

// ── Resume AudioContext on first gesture ─────────────────────
// Required by browser autoplay policy — context starts suspended
function resumeAudio() {
  if (audioReady) return;
  audioContext.resume().then(() => {
    audioReady = true;
    startAmbient();
    log('AudioContext resumed ✓ — ambient sounds started', 'ok');
  });
}

// Hook into existing pointer handlers
renderer.domElement.addEventListener('pointerdown', resumeAudio, { once: false });

// Also resume when tap overlay is dismissed
document.addEventListener('pointerdown', () => {
  if(typeof window.dismissTapOverlay==='function') {
    window.dismissTapOverlay();
  }
  resumeAudio();
}, { once: true });

function flyTo(viewKey){
  if(isTransitioning||currentMode===viewKey)return;
  isTransitioning=true; controls.enabled=false;
  const view=VIEWS[viewKey];
  const pp={x:camera.position.x,y:camera.position.y,z:camera.position.z};
  const tp={x:controls.target.x,y:controls.target.y,z:controls.target.z};
  gsap.to(pp,{x:view.camPos.x,y:view.camPos.y,z:view.camPos.z,duration:1.8,ease:'power2.inOut',
    onUpdate(){camera.position.set(pp.x,pp.y,pp.z);}});
  gsap.to(tp,{x:view.target.x,y:view.target.y,z:view.target.z,duration:1.8,ease:'power2.inOut',
    onUpdate(){controls.target.set(tp.x,tp.y,tp.z);controls.update();},
    onComplete(){
      controls.minPolarAngle=view.minPolar; controls.maxPolarAngle=view.maxPolar;
      controls.minAzimuthAngle=view.minAzi; controls.maxAzimuthAngle=view.maxAzi;
      controls.minDistance=view.minDist; controls.maxDistance=view.maxDist;
      controls.enabled=true; isTransitioning=false; currentMode=viewKey;
      modeEl.textContent=view.label; modeEl.style.color=view.color;
      backBtn.style.display=viewKey==='home'?'none':'block';
      if(view.onArrive)view.onArrive();

  });

  // Whoosh on every camera transition
  playSound('whoosh');
}

const raycaster=new THREE.Raycaster();

  'projectsRed':'projects','projectsWhite':'projects',
  'aboutMeBlue':'aboutMe','aboutMeBlack':'aboutMe',
  'articlesRed':'articles','articlesWhite':'articles',
  'creditsOrange':'credits','creditsBlack':'credits',

function onDown(e){pointer._dx=e.touches?e.touches[0].clientX:e.clientX;pointer._dy=e.touches?e.touches[0].clientY:e.clientY;}
function onUp(e){
  if(isTransitioning)return;
  const cx=e.changedTouches?e.changedTouches[0].clientX:e.clientX;
  const cy=e.changedTouches?e.changedTouches[0].clientY:e.clientY;
  if(Math.abs(cx-(pointer._dx||0))>8||Math.abs(cy-(pointer._dy||0))>8)return;
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((cx-rect.left)/rect.width)*2-1;
  pointer.y=-((cy-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(clickableMeshes,false);
  if(hits.length){
    const name=hits[0].object.userData.clickName||hits[0].object.name;
    const vk=CLICK_MAP[name];
    if(vk){
      playSound('click');   // tap feedback on valid hit
      log(`👆 ${name} → ${vk}`,'click');
      flyTo(vk);
    }
  }
}

// ─────────────────────────────────────────────────────────────
//  HOLOGRAM SHADER
//
//  Reconstructed from the original repo's hologramShaders/ and
//  the Three.js Journey holographic shader lesson.
//
//  VERTEX SHADER — passes world-space position and surface
//  normal (in view space) to the fragment stage.
//  The normal is used for the Fresnel rim calculation.
//
//  FRAGMENT SHADER — four layered effects:
//  1. Horizontal scan lines — fract(vPosition.y * lineCount + time)
//     creates repeating bright bands that scroll upward over time.
//  2. Fresnel rim glow — dot(vNormal, viewDir) gives 0 at edges,
//     1 at centre. We invert so edges glow: (1 - dot)^power.
//     This makes the silhouette rim burn brightest, fading toward
//     the centre — the classic hologram edge effect.
//  3. Pulsing opacity — sin(time) drives alpha so the hologram
//     breathes in and out, never going fully transparent.
//  4. Glitch flicker — occasional rapid sin(time*50) spike adds
//     the sci-fi instability feel.
//
//  Hologram colour: #00eeff (cyan-teal) matching the original.
//  Transparency: side=THREE.DoubleSide, depthWrite:false so the
//  hologram composites over the scene without z-fighting.
// ─────────────────────────────────────────────────────────────

const holoVertexShader = /* glsl */`
  varying vec3 vPosition;
  varying vec3 vNormal;

  void main() {
    // World-space position — used for scan line Y coordinate
    vec4 modelPosition = modelMatrix * vec4(position, 1.0);
    vPosition = modelPosition.xyz;

    // View-space normal — used for Fresnel dot product
    // normalMatrix transforms normals correctly into view space
    vNormal = normalize(normalMatrix * normal);

    gl_Position = projectionMatrix * viewMatrix * modelPosition;
  }
`;

const holoFragmentShader = /* glsl */`
  uniform float uTime;
  uniform vec3  uColor;
  uniform float uLineCount;   // number of scan lines
  uniform float uLineSpeed;   // scroll speed
  uniform float uFresnelPow;  // rim sharpness (higher = thinner rim)
  uniform float uOpacityMin;  // minimum alpha (never fully invisible)
  uniform float uOpacityMax;  // maximum alpha peak

  varying vec3 vPosition;
  varying vec3 vNormal;

  void main() {
    // ── 1. Scan lines ──────────────────────────────────────
    // fract creates the repeating 0→1 ramp. Multiplying by a
    // step makes thin bright lines on a dark field.
    float scanLine = fract(vPosition.y * uLineCount + uTime * uLineSpeed);
    // Narrow bright band: values near 0 or 1 → bright
    float line = step(0.85, scanLine);

    // ── 2. Fresnel rim ─────────────────────────────────────
    // vNormal is in view space; viewDir for view-space normals
    // is always (0,0,1) — we don't need the actual camera vec.
    float fresnel = dot(vNormal, vec3(0.0, 0.0, 1.0));
    fresnel = clamp(fresnel, 0.0, 1.0);
    // Invert so rim (low dot) is bright, centre is dark
    float rim = pow(1.0 - fresnel, uFresnelPow);

    // ── 3. Pulsing opacity ─────────────────────────────────
    float pulse = sin(uTime * 1.5) * 0.5 + 0.5;   // 0→1
    float alpha = mix(uOpacityMin, uOpacityMax, pulse);

    // ── 4. Glitch flicker ──────────────────────────────────
    // Rare fast flicker — abs(sin) creates sharp spikes
    float glitch = abs(sin(uTime * 40.0));
    glitch = step(0.98, glitch) * 0.4;   // fires ~2% of time

    // ── Combine ─────────────────────────────────────────────
    // Base: rim glow + scan lines
    float intensity = rim * 0.6 + line * 0.4;
    // Final alpha: base alpha * intensity + glitch spike
    float finalAlpha = (alpha * intensity) + glitch;
    finalAlpha = clamp(finalAlpha, 0.0, 1.0);

    // Colour: hologram cyan, brightness driven by rim + lines
    vec3 color = uColor * (rim + line * 0.5 + 0.1);

    gl_FragColor = vec4(color, finalAlpha);
  }
`;

// Create the hologram ShaderMaterial
const holoUniforms = {
  uTime:       { value: 0.0 },
  uColor:      { value: new THREE.Color(0x00eeff) },
  uLineCount:  { value: 80.0 },    // scan line density
  uLineSpeed:  { value: 1.2 },     // scroll speed (upward)
  uFresnelPow: { value: 2.0 },     // rim sharpness
  uOpacityMin: { value: 0.15 },    // breath minimum
  uOpacityMax: { value: 0.85 },    // breath maximum
};

const holoMaterial = new THREE.ShaderMaterial({
  vertexShader:   holoVertexShader,
  fragmentShader: holoFragmentShader,
  uniforms:       holoUniforms,
  transparent:    true,
  depthWrite:     false,          // composites correctly over scene
  side:           THREE.DoubleSide,
  blending:       THREE.AdditiveBlending,  // glow adds to scene behind it
});

// ─────────────────────────────────────────────────────────────
//  MAIN LOAD — shop first, then hologram
// ─────────────────────────────────────────────────────────────
log('Fetching ramenShop.gltf …','pending');
fetch(GLTF_SHOP)
  .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text();})
  .then(()=>{log('Shop GLTF reachable ✓','ok');setBar(8);loadShop();})
  .catch(err=>{log('FETCH FAILED: '+err.message,'err');setStatus('Error ❌','#ff5f5f');});

function loadShop(){
  log('Loading ramenShop.gltf …','pending');
  gltfLoader.load(GLTF_SHOP, async(gltf)=>{
    log('Shop GLTF parsed ✓','ok'); setBar(18);

    const model=gltf.scene;
    model.traverse(o=>{if(o.name)meshMap[o.name]=o;});
    log(`${Object.keys(meshMap).length} named objects`,'ok');

    // Load sounds in parallel while we process the model
    loadAllSounds();
    // Build bloom composer in parallel (async, non-blocking)
    buildBloomComposer();

    const bbox=new THREE.Box3().setFromObject(model);
    const center=bbox.getCenter(new THREE.Vector3());
    const size=bbox.getSize(new THREE.Vector3());
    model.position.x-=center.x; model.position.z-=center.z; model.position.y-=bbox.min.y;
    model.traverse(c=>{if(c.isMesh){c.receiveShadow=true;c.castShadow=false;}});
    scene.add(model);

    const sh=size.y;
    mshBox.position.set(0,sh+3.5,0);
    spotLight1.position.set(5,sh+14,8); spotLight2.position.set(0,sh+14,6); spotLight3.position.set(-5,sh+14,8);
    log(`Shop: ${size.x.toFixed(1)}×${sh.toFixed(1)}×${size.z.toFixed(1)}`,'info');
    setBar(22,'Scene ready…');

    Object.keys(CLICK_MAP).forEach(name=>{
      const obj=meshMap[name];if(!obj)return;
      obj.traverse(o=>{if(o.isMesh){o.userData.clickName=name;clickableMeshes.push(o);}});
    });

    // Assign bloom layers to neon/LED meshes
    assignBloomLayers(meshMap);

    // ── Baked ──
    log('── Baked textures ──','head');
    for(const[name,ktx2]of BAKED){
      const tex=await loadKTX2(ktx2);if(!tex)continue;
      applyMat(meshMap,name,bakedMat(tex));
    }
    fillLight.intensity=0.0; setBar(38,'Baked textures…');

    for(const[name,hex]of COLORS)applyMat(meshMap,name,new THREE.MeshBasicMaterial({color:hex}));
    setBar(44,'Materials…');

    log('── Matcaps ──','head');
    for(const[names,ktx2,png]of MATCAPS){
      const tex=ktx2?await loadKTX2(ktx2):await loadPNG(png);if(!tex)continue;
      const mat=new THREE.MeshMatcapMaterial({matcap:tex});
      names.forEach(n=>applyMat(meshMap,n,mat));
    }
    setBar(54,'Matcaps…');

    for(const[name,src]of VIDEO_SCREENS)applyMat(meshMap,name,videoMat(src));
    const s1=(await Promise.all(SMALL1_PATHS.map(loadBasis))).filter(Boolean);
    s1.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;});
    if(meshMap['smallScreen1']&&s1.length)cycleScreens(meshMap['smallScreen1'],s1,2000);
    const s2=(await Promise.all(SMALL2_PATHS.map(loadBasis))).filter(Boolean);
    s2.forEach(t=>{t.colorSpace=THREE.SRGBColorSpace;});
    if(meshMap['smallScreen2']&&s2.length)cycleScreens(meshMap['smallScreen2'],s2,2000);
    setBar(62,'Screens…');

    log('── Screen textures ──','head');
    const sideTex=[];
    for(const p of SIDE_PATHS){
      const tex=await loadKTX2(p);
      if(tex){
        tex.colorSpace=THREE.SRGBColorSpace;
        const key=p.split('/').pop().replace('.ktx2','');
        SCREEN_TEX[key]=tex; sideTex.push(tex);
      }
    }
    if(meshMap['sideScreen']&&sideTex.length)sideInterval=cycleScreens(meshMap['sideScreen'],sideTex,3000);

    let loaded=0;
    for(const[key,path]of SCREEN_LOAD_LIST){
      const tex=await loadKTX2(path);
      if(tex){tex.colorSpace=THREE.SRGBColorSpace;SCREEN_TEX[key]=tex;loaded++;}
      setBar(62+Math.round((loaded/SCREEN_LOAD_LIST.length)*18));
    }
    log(`${loaded}/${SCREEN_LOAD_LIST.length} screen textures ✓`,'ok');

    setScreen('bigScreen','bigScreenDefault');
    setScreen('vendingMachineScreen','vendingDefault');
    setScreen('arcadeScreen','arcadeDefault');
    if(SCREEN_TEX['easelTouch'])applyMat(meshMap,'easelFrontGraphic',screenMat(SCREEN_TEX['easelTouch']));
    setBar(82);

    // ── Now load hologram ──
    loadHologram(sh);

  },
  (xhr)=>{if(xhr.total)setBar(8+Math.round((xhr.loaded/xhr.total)*10));},
  (err)=>{log('Shop GLTFLoader ERROR: '+(err?.message||err),'err');setStatus('Error ❌','#ff5f5f');}
  );
}

// ─────────────────────────────────────────────────────────────
//  HOLOGRAM LOAD
//  The hologram model is 106.97×78.01×91.56 units — enormous.
//  The shop is 49.9×10.09×49.9.
//  We scale it down to fit above the neon sign.
//
//  Target: hologram ~2 units wide, ~1.5 units tall
//  Scale factor ≈ 2 / 106.97 ≈ 0.0187
//  Position: centred X, Y just above the neon sign (~7.5 units),
//  Z slightly in front of the shop face (~-1)
// ─────────────────────────────────────────────────────────────
function loadHologram(shopHeight){
  log('── Step 7: ramenHologram.gltf ──','head');
  log('Fetching ramenHologram.gltf …','pending');

  gltfLoader.load(
    GLTF_HOLO,

    (gltf)=>{
      log('Hologram GLTF parsed ✓','ok');

      const holo=gltf.scene;

      // Measure raw size
      const rawBox=new THREE.Box3().setFromObject(holo);
      const rawSize=rawBox.getSize(new THREE.Vector3());
      log(`Hologram raw: ${rawSize.x.toFixed(1)}×${rawSize.y.toFixed(1)}×${rawSize.z.toFixed(1)}`,'info');

      // Scale so the widest dimension becomes ~2.5 units
      const targetWidth = 2.5;
      const scaleFactor = targetWidth / rawSize.x;
      holo.scale.setScalar(scaleFactor);
      log(`Scale factor: ${scaleFactor.toFixed(4)}`,'info');

      // After scaling, re-centre and position above shop sign
      // The neon sign is around Y=6.5–7.5 in the centred model
      const scaledBox=new THREE.Box3().setFromObject(holo);
      const scaledCenter=scaledBox.getCenter(new THREE.Vector3());
      const scaledSize=scaledBox.getSize(new THREE.Vector3());

      // Place: centred on X, above neon sign, slightly in front
      holo.position.x -= scaledCenter.x;
      holo.position.y  = 7.8 - scaledBox.min.y * scaleFactor;   // sit bottom at Y=7.8
      holo.position.z  = -1.0;   // slightly in front of building face

      log(`Hologram scaled size: ${scaledSize.x.toFixed(2)}×${scaledSize.y.toFixed(2)}×${scaledSize.z.toFixed(2)}`,'info');
      log(`Hologram position: ${holo.position.x.toFixed(2)}, ${holo.position.y.toFixed(2)}, ${holo.position.z.toFixed(2)}`,'info');

      // Apply hologram shader to every mesh in the model
      let meshCount=0;
      holo.traverse(child=>{
        if(child.isMesh){
          child.material          = holoMaterial;
          child.castShadow        = false;
          child.receiveShadow     = false;
          child.userData.isHologram = true;   // excluded from bloom darken pass
          // Hologram stays on layer 0 ONLY — never enters the bloom layer
          child.layers.disableAll();
          child.layers.enable(0);
          meshCount++;
        }
      });
      log(`Hologram shader applied to ${meshCount} mesh(es) ✓`,'ok');

      scene.add(holo);

      // Store reference for animation loop
      window._holoScene = holo;

      setBar(100, 'Ready!');
      summaryEl.textContent='Steps 1–9 complete · Hologram + Sound + Selective Bloom live';
      setStatus('✅ Ready','#4eca8b');
      log('▶ PORTFOLIO READY','ok');
      log('Neons/LEDs bloom ✓  Hologram excluded ✓  Baked shop unaffected ✓','ok');

      setTimeout(()=>{
        hideAll();
        // Show tap-to-start overlay (also resumes AudioContext)
        if(typeof window.showTapOverlay==='function') window.showTapOverlay();
        document.getElementById('hint').textContent=
          'Click: Projects · About Me · Articles · Credits';
      },1500);
      log('First tap resumes AudioContext (browser policy)','info');

      setTimeout(()=>{
        hideAll();
        document.getElementById('hint').textContent=
          '🔊 Tap anything to start audio  |  Projects · About Me · Articles · Credits';
      },3000);
    },

    (xhr)=>{if(xhr.total)log(`Hologram: ${Math.round((xhr.loaded/xhr.total)*100)}%`,'pending');},

    (err)=>{
      log('Hologram GLTF ERROR: '+(err?.message||err),'err');
      log('Continuing without hologram — check ./models/ramenHologram.gltf path','info');
      setBar(100);
      setStatus('⚠️ Hologram failed — shop OK','#f0c060');
    }
  );
}

// ── SPOTLIGHT TWEENS ─────────────────────────────────────────
function tweenSpot(l){
  new TWEEN.Tween(l).to({angle:(Math.random()*0.7)+0.1,penumbra:Math.random()+1},Math.random()*3000+2000).easing(TWEEN.Easing.Quadratic.Out).start();
  const bY=l.position.y;
  new TWEEN.Tween(l.position).to({x:(Math.random()*16)-8,y:bY+(Math.random()*4)-2,z:(Math.random()*16)-8},Math.random()*3000+2000).easing(TWEEN.Easing.Quadratic.Out).start();
}
function updateTweens(){tweenSpot(spotLight1);tweenSpot(spotLight2);tweenSpot(spotLight3);setTimeout(updateTweens,5000);}

// ── COORD DEBUG ──────────────────────────────────────────────
let showCoords=true;
coordEl.addEventListener('click',()=>{showCoords=!showCoords;coordEl.style.opacity=showCoords?'1':'0.2';});

// ── RENDER LOOP ───────────────────────────────────────────────
const clock=new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const elapsed=clock.getElapsedTime();

  // Advance hologram time uniform every frame
  holoUniforms.uTime.value = elapsed;

  // Slow Y-axis rotation of the hologram — floats in place
  if(window._holoScene){
    window._holoScene.rotation.y = elapsed * 0.4;
    // Gentle hover bob: oscillate Y position
    window._holoScene.position.y = 7.8 + Math.sin(elapsed * 1.2) * 0.08;
  }

  TWEEN.update(); controls.update();
  lh1.update(); lh2.update(); lh3.update();
  // ── Two-pass selective bloom render ─────────────────────
  if (composer && bloomComposer) {
    // Pass 1: bloom pass — only layer 1 meshes visible
    // Darken everything not on the bloom layer so baked colours
    // don't contribute to the glow texture
    camera.layers.set(BLOOM_LAYER);   // camera sees bloom layer only
    darkenNonBloom();
    bloomComposer.render();
    restoreMaterials();

    // Pass 2: full scene + bloom composite
    camera.layers.enableAll();        // camera sees everything again
    composer.render();
  } else {
    // Fallback: bloom not ready yet (loading) or failed
    renderer.render(scene, camera);
  }

  if(showCoords){
    const p=camera.position,t=controls.target;
    coordEl.innerHTML=
      `<span style="color:#adf">cam</span> ${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}<br>`+
      `<span style="color:#fa0">tgt</span> ${t.x.toFixed(2)} ${t.y.toFixed(2)} ${t.z.toFixed(2)}<br>`+
      `<span style="color:#555">${currentMode}</span>`;
  }
})();

updateTweens();
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
